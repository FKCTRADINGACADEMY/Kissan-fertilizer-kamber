<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customers — Kissan Fertilizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="stylesheet" href="common.css" />
</head>
<body>
  <div class="shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="page-header"><h1>Customers / Udhaar</h1></div>

      <div class="card">
        <h2 id="form-title">Naya Customer Add Karein</h2>
        <form id="customer-form">
          <div class="form-row">
            <div><label>Name</label><input id="c-name" required /></div>
            <div><label>Phone</label><input id="c-phone" /></div>
          </div>
          <div class="form-row">
            <div style="grid-column: 1 / -1;">
              <label>Photo (udhaar customer ki tasveer / CNIC)</label>
              <div class="photo-picker">
                <div id="c-photo-preview-wrap"><div class="preview-placeholder">No Photo</div></div>
                <input id="c-photo" type="file" accept="image/*" capture="environment" />
              </div>
            </div>
          </div>
          <div class="form-row">
            <div style="grid-column: 1 / -1;">
              <label>Is Party ke Banday (jo mall uthane aate hain)</label>
              <div id="c-agents-chips" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
              <div style="display:flex; gap:8px;">
                <input id="c-agent-input" placeholder="e.g. Ali, Ahmed, Sattar" style="flex:1;" />
                <button class="btn secondary" type="button" id="c-agent-add-btn">+ Add Banda</button>
              </div>
            </div>
          </div>
          <div style="display:flex; gap:8px; margin-top:4px;">
            <button class="btn" type="submit" id="c-submit-btn">Add Customer</button>
            <button class="btn secondary hidden" type="button" id="c-cancel-btn">Cancel Edit</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Payment Receive Karein</h2>
        <div class="form-row">
          <div><label>Customer</label><select id="pay-customer"></select></div>
          <div><label>Amount</label><input id="pay-amount" type="number" min="0" step="0.01" /></div>
          <div style="align-self:end;"><button class="btn" type="button" id="receive-payment-btn">Receive Payment</button></div>
        </div>
      </div>

      <div class="card">
        <h2>Sab Customers</h2>
        <table>
          <thead><tr><th></th><th>Name</th><th>Phone</th><th class="right">Pending Balance</th><th>Actions</th></tr></thead>
          <tbody id="customers-body"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth, db, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy,
      increment, serverTimestamp
    } from "./firebase-init.js";
    import { renderSidebar, toast, fmtMoney, todayStr } from "./common.js";

    let allCustomers = [];
    let editingId = null;
    let currentPhotoData = null; // base64 string of the photo currently in the form (add or edit)
    let currentAgents = []; // names of "banday" who pick up goods for this party

    requireAuth(function (user) {
      renderSidebar("customers.html", user.email);
      subscribeCustomers();
      renderAgentChips();
    });

    function subscribeCustomers() {
      onSnapshot(query(collection(db, "customers"), orderBy("name")), function (snap) {
        allCustomers = [];
        snap.forEach(function (d) { allCustomers.push({ id: d.id, ...d.data() }); });
        renderTable();
        renderPaySelect();
      });
    }

    function initials(name) {
      return (name || "?").trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
    }

    function renderTable() {
      const body = document.getElementById("customers-body");
      body.innerHTML = "";
      if (allCustomers.length === 0) {
        body.innerHTML = "<tr><td colspan='5'>Koi customer nahi mila.</td></tr>";
        return;
      }
      allCustomers.forEach(function (c) {
        const bal = Number(c.balance) || 0;
        const tr = document.createElement("tr");
        const photoCell = c.photo
          ? "<img class='avatar' src='" + c.photo + "' />"
          : "<div class='avatar-placeholder'>" + initials(c.name) + "</div>";
        const agentsLine = Array.isArray(c.agents) && c.agents.length
          ? "<div style='font-size:11px;color:#6b6b5f;'>Banday: " + c.agents.join(", ") + "</div>"
          : "";
        tr.innerHTML =
          "<td>" + photoCell + "</td>" +
          "<td>" + c.name + agentsLine + "</td>" +
          "<td>" + (c.phone || "-") + "</td>" +
          "<td class='right'>" + (bal > 0 ? "<span class='pill low'>" + fmtMoney(bal) + "</span>" : fmtMoney(0)) + "</td>" +
          "<td><div class='row-actions'>" +
            "<button class='btn small secondary' data-edit='" + c.id + "'>Edit</button>" +
            "<button class='btn small danger' data-delete='" + c.id + "'>Delete</button>" +
          "</div></td>";
        body.appendChild(tr);
      });
      body.querySelectorAll("[data-edit]").forEach(function (btn) {
        btn.addEventListener("click", function () { startEdit(btn.getAttribute("data-edit")); });
      });
      body.querySelectorAll("[data-delete]").forEach(function (btn) {
        btn.addEventListener("click", function () { deleteCustomer(btn.getAttribute("data-delete")); });
      });
    }

    function renderPaySelect() {
      const sel = document.getElementById("pay-customer");
      sel.innerHTML = allCustomers.map(function (c) {
        return "<option value='" + c.id + "'>" + c.name + " (Due: " + fmtMoney(c.balance) + ")</option>";
      }).join("");
    }

    // ---------- Photo picker: compress to a small base64 JPEG before saving ----------
    document.getElementById("c-photo").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const maxDim = 320;
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          currentPhotoData = canvas.toDataURL("image/jpeg", 0.6);
          updatePhotoPreview();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function updatePhotoPreview() {
      const wrap = document.getElementById("c-photo-preview-wrap");
      wrap.innerHTML = currentPhotoData
        ? "<img class='preview' src='" + currentPhotoData + "' />"
        : "<div class='preview-placeholder'>No Photo</div>";
    }

    function renderAgentChips() {
      const wrap = document.getElementById("c-agents-chips");
      if (currentAgents.length === 0) {
        wrap.innerHTML = "<span style='font-size:12px;color:#6b6b5f;'>Abhi koi banda add nahi hua.</span>";
        return;
      }
      wrap.innerHTML = currentAgents.map(function (name, idx) {
        return "<span class='chip'>" + name + " <button type='button' data-remove-agent='" + idx + "'>×</button></span>";
      }).join("");
      wrap.querySelectorAll("[data-remove-agent]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          currentAgents.splice(Number(btn.getAttribute("data-remove-agent")), 1);
          renderAgentChips();
        });
      });
    }

    function addAgentFromInput() {
      const input = document.getElementById("c-agent-input");
      const name = input.value.trim();
      if (!name) return;
      if (!currentAgents.some(function (a) { return a.toLowerCase() === name.toLowerCase(); })) {
        currentAgents.push(name);
        renderAgentChips();
      }
      input.value = "";
      input.focus();
    }

    document.getElementById("c-agent-add-btn").addEventListener("click", addAgentFromInput);
    document.getElementById("c-agent-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); addAgentFromInput(); }
    });

    function startEdit(id) {
      const c = allCustomers.find(function (x) { return x.id === id; });
      if (!c) return;
      editingId = id;
      currentPhotoData = c.photo || null;
      currentAgents = Array.isArray(c.agents) ? c.agents.slice() : [];
      document.getElementById("c-name").value = c.name || "";
      document.getElementById("c-phone").value = c.phone || "";
      document.getElementById("c-photo").value = "";
      updatePhotoPreview();
      renderAgentChips();
      document.getElementById("form-title").textContent = "Customer Edit Karein";
      document.getElementById("c-submit-btn").textContent = "Update Customer";
      document.getElementById("c-cancel-btn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      editingId = null;
      currentPhotoData = null;
      currentAgents = [];
      document.getElementById("customer-form").reset();
      updatePhotoPreview();
      renderAgentChips();
      document.getElementById("form-title").textContent = "Naya Customer Add Karein";
      document.getElementById("c-submit-btn").textContent = "Add Customer";
      document.getElementById("c-cancel-btn").classList.add("hidden");
    }

    document.getElementById("c-cancel-btn").addEventListener("click", resetForm);

    async function deleteCustomer(id) {
      const c = allCustomers.find(function (x) { return x.id === id; });
      const bal = c ? (Number(c.balance) || 0) : 0;
      const warn = bal > 0 ? " Is customer par abhi " + fmtMoney(bal) + " udhaar baaki hai." : "";
      if (!confirm("Kya aap '" + (c ? c.name : "") + "' ko delete karna chahte hain?" + warn)) return;
      try {
        await deleteDoc(doc(db, "customers", id));
        toast("Customer delete ho gaya.");
        if (editingId === id) resetForm();
      } catch (err) {
        toast("Error: " + err.message);
      }
    }

    document.getElementById("customer-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const name = document.getElementById("c-name").value.trim();
      const phone = document.getElementById("c-phone").value.trim();
      if (!name) return;
      try {
        if (editingId) {
          await updateDoc(doc(db, "customers", editingId), {
            name: name, phone: phone, photo: currentPhotoData || null, agents: currentAgents,
          });
          toast("Customer update ho gaya.");
        } else {
          await addDoc(collection(db, "customers"), {
            name: name, phone: phone, photo: currentPhotoData || null, agents: currentAgents, balance: 0, createdAt: serverTimestamp(),
          });
          toast("Customer add ho gaya.");
        }
        resetForm();
      } catch (err) {
        toast("Error: " + err.message);
      }
    });

    document.getElementById("receive-payment-btn").addEventListener("click", async function () {
      const customerId = document.getElementById("pay-customer").value;
      const amount = Number(document.getElementById("pay-amount").value) || 0;
      if (!customerId || amount <= 0) { toast("Customer aur amount theek darj karein."); return; }
      try {
        await updateDoc(doc(db, "customers", customerId), { balance: increment(-amount) });
        const customer = allCustomers.find(function (c) { return c.id === customerId; });
        await addDoc(collection(db, "cashEntries"), {
          date: todayStr(), type: "in", amount: amount,
          note: "Udhaar payment — " + (customer ? customer.name : ""),
          createdAt: serverTimestamp(),
        });
        toast("Payment receive ho gayi.");
        document.getElementById("pay-amount").value = "";
      } catch (err) {
        toast("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
