<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — Kissan Fertilizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css" />
</head>
<body>
  <div class="shell">
    <div class="sidebar" id="sidebar-root"></div>
    <div class="main">
      <div class="page-header"><h1>Products / Fertilizers</h1></div>

      <div class="card">
        <h2 id="form-title">Naya Product Add Karein</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />
          <div class="form-row">
            <div><label>Product Name</label><input id="p-name" required /></div>
            <div><label>Category</label><input id="p-category" placeholder="e.g. Urea, DAP" /></div>
            <div><label>Unit</label>
              <select id="p-unit">
                <option>Bag</option><option>KG</option><option>Ton</option><option>Litre</option><option>Piece</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div><label>Purchase Price (per unit)</label><input id="p-purchase" type="number" min="0" step="0.01" required /></div>
            <div><label>Sale Price (per unit)</label><input id="p-sale" type="number" min="0" step="0.01" required /></div>
            <div><label>Minimum Stock Alert</label><input id="p-minstock" type="number" min="0" value="10" /></div>
            <div><label>Opening Stock</label><input id="p-stock" type="number" min="0" value="0" /></div>
          </div>
          <button class="btn" type="submit" id="save-btn">Save Product</button>
          <button class="btn secondary hidden" type="button" id="cancel-edit">Cancel Edit</button>
        </form>
      </div>

      <div class="card">
        <h2>Sab Products</h2>
        <input id="search-box" placeholder="Search product…" style="margin-bottom:10px;" />
        <table>
          <thead>
            <tr><th>Name</th><th>Category</th><th>Unit</th><th class="right">Purchase</th><th class="right">Sale</th><th class="right">Stock</th><th></th></tr>
          </thead>
          <tbody id="products-body"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth, db, collection, addDoc, updateDoc, deleteDoc, doc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "./firebase-init.js";
    import { renderSidebar, toast, fmtMoney } from "./common.js";

    let allProducts = [];

    requireAuth(function (user) {
      renderSidebar("products.html", user.email);
      subscribeProducts();
    });

    function subscribeProducts() {
      const q = query(collection(db, "products"), orderBy("name"));
      onSnapshot(q, function (snap) {
        allProducts = [];
        snap.forEach(function (d) { allProducts.push({ id: d.id, ...d.data() }); });
        renderTable(allProducts);
      });
    }

    function renderTable(list) {
      const body = document.getElementById("products-body");
      body.innerHTML = "";
      if (list.length === 0) {
        body.innerHTML = "<tr><td colspan='7'>Koi product nahi mila.</td></tr>";
        return;
      }
      list.forEach(function (p) {
        const low = (Number(p.stock) || 0) <= (Number(p.minStock) || 0);
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + (p.name || "") + "</td>" +
          "<td>" + (p.category || "-") + "</td>" +
          "<td>" + (p.unit || "-") + "</td>" +
          "<td class='right'>" + fmtMoney(p.purchasePrice) + "</td>" +
          "<td class='right'>" + fmtMoney(p.salePrice) + "</td>" +
          "<td class='right'>" + (Number(p.stock) || 0) + (low ? " <span class='pill low'>Low</span>" : "") + "</td>" +
          "<td><button class='btn small secondary' data-edit='" + p.id + "'>Edit</button> " +
          "<button class='btn small danger' data-del='" + p.id + "'>Delete</button></td>";
        body.appendChild(tr);
      });

      body.querySelectorAll("[data-edit]").forEach(function (btn) {
        btn.addEventListener("click", function () { startEdit(btn.getAttribute("data-edit")); });
      });
      body.querySelectorAll("[data-del]").forEach(function (btn) {
        btn.addEventListener("click", function () { removeProduct(btn.getAttribute("data-del")); });
      });
    }

    document.getElementById("search-box").addEventListener("input", function (e) {
      const term = e.target.value.trim().toLowerCase();
      renderTable(allProducts.filter(function (p) {
        return (p.name || "").toLowerCase().includes(term) || (p.category || "").toLowerCase().includes(term);
      }));
    });

    function startEdit(id) {
      const p = allProducts.find(function (x) { return x.id === id; });
      if (!p) return;
      document.getElementById("form-title").textContent = "Product Edit Karein";
      document.getElementById("product-id").value = p.id;
      document.getElementById("p-name").value = p.name || "";
      document.getElementById("p-category").value = p.category || "";
      document.getElementById("p-unit").value = p.unit || "Bag";
      document.getElementById("p-purchase").value = p.purchasePrice || 0;
      document.getElementById("p-sale").value = p.salePrice || 0;
      document.getElementById("p-minstock").value = p.minStock || 0;
      document.getElementById("p-stock").value = p.stock || 0;
      document.getElementById("cancel-edit").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("cancel-edit").addEventListener("click", resetForm);

    function resetForm() {
      document.getElementById("product-form").reset();
      document.getElementById("product-id").value = "";
      document.getElementById("form-title").textContent = "Naya Product Add Karein";
      document.getElementById("cancel-edit").classList.add("hidden");
    }

    async function removeProduct(id) {
      if (!confirm("Kya aap is product ko delete karna chahte hain?")) return;
      await deleteDoc(doc(db, "products", id));
      toast("Product delete ho gaya.");
    }

    document.getElementById("product-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const id = document.getElementById("product-id").value;
      const payload = {
        name: document.getElementById("p-name").value.trim(),
        category: document.getElementById("p-category").value.trim(),
        unit: document.getElementById("p-unit").value,
        purchasePrice: Number(document.getElementById("p-purchase").value) || 0,
        salePrice: Number(document.getElementById("p-sale").value) || 0,
        minStock: Number(document.getElementById("p-minstock").value) || 0,
        stock: Number(document.getElementById("p-stock").value) || 0,
      };
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      try {
        if (id) {
          await updateDoc(doc(db, "products", id), payload);
          toast("Product update ho gaya.");
        } else {
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "products"), payload);
          toast("Product add ho gaya.");
        }
        resetForm();
      } catch (err) {
        toast("Error: " + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
