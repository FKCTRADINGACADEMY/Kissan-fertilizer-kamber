<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Kissan Fertilizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f6e4a 0%, #0a4d33 100%);
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #0f6e4a;
            margin-bottom: 8px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .login-container .shop-info {
            background: #f0fdf4;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 4px solid #0f6e4a;
        }

        .login-container .shop-info p {
            font-size: 13px;
            color: #374151;
            margin: 2px 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0f6e4a;
            box-shadow: 0 0 0 3px rgba(15, 110, 74, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #0f6e4a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #0a4d33;
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .loading-text {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>🌾 Kissan Fertilizer</h1>
        <p class="subtitle">Shop Management System</p>

        <div class="shop-info">
            <p>📍 Miro Khan Road, Kamber</p>
            <p>👨‍💼 Owner: Pro Madad Ali</p>
            <p>👨‍💼 Manager: Nadeem Ali Khichi</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" placeholder="admin@kissan.com" value="admin@kissan.com" required />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Enter password" required />
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js"
        }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyBgj4ICBiPlikXgTjkzPrRUCv3CX3At0KA",
            authDomain: "kissan-fertilizer.firebaseapp.com",
            projectId: "kissan-fertilizer",
            storageBucket: "kissan-fertilizer.firebasestorage.app",
            messagingSenderId: "476514606793",
            appId: "1:476514606793:web:157d8f78e74f426644f718"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            try {
                await signInWithEmailAndPassword(auth, email.value, password.value);
                window.location.href = 'index.html';
            } catch (error) {
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });
    </script>

</body>
</html>
