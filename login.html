<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Kissan Fertilizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="stylesheet" href="common.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="logo.png" alt="Kissan Fertilizer" style="width:88px; height:88px; display:block; margin:0 auto 10px; border-radius:50%;" />
      <h1>Kissan Fertilizer</h1>
      <div class="sub">Shop Management System</div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="btn" id="login-submit" style="width:100%; margin-top:12px;">Login</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./firebase-init.js";

    onAuthStateChanged(auth, function (user) {
      if (user) location.href = "index.html";
    });

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      signInWithEmailAndPassword(auth, email, password)
        .then(function () { location.href = "index.html"; })
        .catch(function () { errorEl.textContent = "Email ya password ghalat hai."; })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = "Login";
        });
    });
  </script>
</body>
</html>
