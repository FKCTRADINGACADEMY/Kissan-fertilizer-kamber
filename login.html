<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Kissan Fertilizer</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f4d2c" />
<link rel="icon" href="icon-192-1.png" />
<link rel="apple-touch-icon" href="icon-192-1.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --field:#1f4d2c; --field-dark:#123420; --wheat:#c98a1f;
  --paper:#faf6ec; --card:#fffdf8; --ink:#23291f; --sub:#6b6152;
  --line:#e7e0cf; --danger:#b5462f;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--field-dark);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink);}
h1{font-family:'Fraunces',serif;margin:6px 0 2px;font-size:20px;}
.login-card{background:var(--card);padding:34px;border-radius:16px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-mark{font-size:38px;}
.sub{font-size:12px;color:var(--sub);margin-bottom:18px;}
.field{margin-bottom:12px;text-align:left;}
label{font-size:11.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}
input{width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
input:focus{outline:2px solid var(--field);outline-offset:1px;}
button{width:100%;border:none;border-radius:8px;padding:11px 14px;font-weight:700;font-size:13.5px;background:var(--field);color:#fff;cursor:pointer;margin-top:4px;}
button:hover{background:var(--field-dark);}
button:disabled{opacity:.6;cursor:default;}
.login-err{color:var(--danger);font-size:12px;min-height:16px;margin-top:10px;}
.foot{margin-top:16px;font-size:11px;color:var(--sub);}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-mark">🌾</div>
  <h1>Kissan Fertilizer</h1>
  <p class="sub">Miro Khan Road, Kamber — ledger &amp; store manager</p>
  <div class="field">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@kissan.com" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button id="loginBtn" onclick="doLogin()"><span id="loginBtnLabel">Sign in</span></button>
  <p class="login-err" id="loginErr"></p>
  <p class="foot">Project: kissan-fertilizer</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

/* Same Firebase project as index.html — one login works across the app. */
const firebaseConfig = {
  apiKey: "AIzaSyBgj4ICBiPlikXgTjkzPrRUCv3CX3At0KA",
  authDomain: "kissan-fertilizer.firebaseapp.com",
  projectId: "kissan-fertilizer",
  storageBucket: "kissan-fertilizer.firebasestorage.app",
  messagingSenderId: "476514606793",
  appId: "1:476514606793:web:157d8f78e74f426644f718"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Already signed in? Skip straight to the app.
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = "index.html";
});

window.doLogin = async function () {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  const btnLabel = document.getElementById('loginBtnLabel');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter email and password'; return; }
  btn.disabled = true;
  btnLabel.textContent = 'Signing in…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = "index.html";
  } catch (e) {
    errEl.textContent = 'Invalid email or password';
    btn.disabled = false;
    btnLabel.textContent = 'Sign in';
  }
};

document.getElementById('loginPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
