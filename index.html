/* Agent-pay voucher helpers — sale edit/delete pe cash-book clean rahe */
function findAgentVouchersForSale(sale){
  if(!sale) return [];
  const saleId = sale.id || '';
  const docNo = sale.docNo || '';
  return (STATE.vouchers || []).filter(v=>{
    if(v.type !== 'Out') return false;
    if(saleId && v.saleId === saleId) return true;
    if(docNo && v.linkedDocNo === docNo) return true;
    if(docNo && (v.note || '').includes('#' + docNo)) return true;
    return false;
  });
}
async function removeAgentVouchersForSale(sale){
  const list = findAgentVouchersForSale(sale);
  for(const v of list){
    try{
      await deleteDoc(doc(db,'vouchers', v.id));
      STATE.vouchers = (STATE.vouchers || []).filter(x=>x.id !== v.id);
    }catch(e){ console.warn('agent voucher delete failed', v.id, e); }
  }
  return list.length;
}
async function createAgentVoucherForSale(saleId, docNo, agentPay, date, takenBy){
  if(!(Number(agentPay) > 0)) return null;
  const payload = {
    type: 'Out',
    amount: Number(agentPay),
    date: date || todayISO(),
    note: `Agent pay — ${takenBy || 'Reseller'}${docNo ? ' #' + docNo : ''}`,
    saleId: saleId || '',
    linkedDocNo: docNo || '',
    atLocal: new Date().toISOString()
  };
  const ref = await addDoc(collection(db,'vouchers'), payload);
  STATE.vouchers = dedupeById([{ id: ref.id, ...payload }, ...(STATE.vouchers || [])]);
  return ref.id;
}

window.saveSale = async function(id){
  if(window._saveLocks['sale']){ toast('Pehle se save ho raha hai — wait…','info'); return; }
  window._saveLocks['sale'] = true;
  try{
    const qty = Number($('sQty').value)||0;
    const rate = Number($('sRate').value)||0;
    const discPct = Number($('sDiscPct').value)||0;
    const resolved = resolveProductFromForm('sProduct','sGenericName');
    if(resolved.isGeneric){
      if(!resolved.productName){ toast('Generic product ka name likhein','error'); return; }
    }else if(!resolved.productId){
      toast('Product select karein','error'); return;
    }
    if(qty<=0 || rate<=0){ toast('Fill quantity and rate','error'); return; }
    const product = resolved.product;
    const party = STATE.parties.find(p=>p.id===$('sParty').value);
    const manualParty = ($('sPartyManual')?.value||'').trim();
    const partyId = party?.id || '';
    const partyName = party?.name || manualParty || 'Walk-in';
    const subtotal = qty*rate;
    const discountAmount = subtotal*discPct/100;
    const total = subtotal - discountAmount;
    let payMode = $('sPayMode').value;
    const date = $('sDate').value||todayISO();
    const takenBy = ($('sTakenBy')?.value||'').trim();
    const resellTotal = Number($('sResellTotal')?.value)||0;
    const agentPay = Number($('sAgentPay')?.value)||0;
    const holdStock = !!$('sHoldStock')?.checked;
    const godamId = $('sGodam')?.value || getDefaultGodamId();
    const productId = resolved.productId;
    const productName = resolved.productName;
    const isGeneric = !!resolved.isGeneric;
    // Phase-2 bill settlement
    let payCash = 0, payBank = 0, payAdvance = 0, payCredit = 0;
    if(window.KissanPhase2){
      const sett = window.KissanPhase2.settlementFromForm();
      payCash = sett.cash; payBank = sett.bank; payAdvance = sett.advance; payCredit = sett.credit;
      if(sett.credit > 0 && sett.paid > 0) payMode = 'Partial';
      else if(sett.credit > 0) payMode = 'Credit';
      else if(sett.bank > 0 && sett.cash <= 0) payMode = 'Bank';
      else payMode = 'Cash';
    }

    // Phase-6: blocked party/product
    if(window.KissanPhase6){
      if(partyId && !window.KissanPhase6.assertNotBlocked('parties', partyId, 'Party')) return;
      if(productId && !window.KissanPhase6.assertNotBlocked('products', productId, 'Product')) return;
    }
    // Phase-4: Credit limit
    if(window.KissanPhase4 && partyId){
      const lim = window.KissanPhase4.checkCreditLimit(partyId, total);
      if(!lim.ok){
        toast(lim.message, 'error');
        return;
      }
    }

    // Phase-1: Data Freezing
    if(window.KissanPhase1 && !window.KissanPhase1.assertNotFrozen(date)){
      return;
    }
    if(id && window.KissanPhase1){
      const oldSale = STATE.sales.find(s=>s.id===id);
      if(oldSale && !window.KissanPhase1.assertNotFrozen(oldSale.date)) return;
    }

    // Phase-1: Warning Alarms (stock)
    if(window.KissanPhase1 && product && !isGeneric && !holdStock){
      const current = productEffectiveStock(product);
      const after = current - qty;
      const chk = window.KissanPhase1.checkStockAlarms(product, after);
      if(chk.messages.length){
        chk.messages.forEach(m => toast(m, chk.ok ? 'info' : 'error'));
        if(!chk.ok) return;
      }
    }

    if(id){
      // ——— EDIT SALE ———
      const old = STATE.sales.find(s=>s.id===id);
      if(!old){ toast('Sale nahi mili','error'); return; }

      // 1) Pehle purana stock wapas (sirf agar pehle cut hua tha)
      const oldCut = old.productId && !old.holdStock && !old.isGeneric;
      if(oldCut){
        await adjustProductStock(old.productId, Number(old.qty||0), old.godamId || getDefaultGodamId());
      }

      // 2) Naya stock check (agar ab cut hoga)
      const willCut = !isGeneric && !holdStock && productId;
      if(willCut){
        const fresh = STATE.products.find(p=>p.id===productId);
        if(qty > productEffectiveStock(fresh)){
          // Validation fail — purana stock phir se cut kar do (rollback)
          if(oldCut){
            await adjustProductStock(old.productId, -Number(old.qty||0), old.godamId || getDefaultGodamId());
          }
          toast('Not enough stock available','error');
          return;
        }
      }

      // 3) Sale document update
      const salePatch = {
        productId: isGeneric ? '' : productId,
        productName, isGeneric, partyId, partyName,
        qty, rate, subtotal, discountPercent: discPct, discountAmount, total,
        payMode, date, takenBy, resellTotal, agentPay, holdStock,
        godamId: isGeneric ? '' : godamId,
        payCash, payBank, payAdvance, payCredit
      };
      await updateDoc(doc(db,'sales', id), salePatch);

      // 4) Naya stock cut
      if(willCut){
        await adjustProductStock(productId, -qty, godamId);
      }

      // 5) Agent voucher sync (purana hatao, naya banao agar agentPay > 0)
      const merged = { ...old, ...salePatch, id };
      await removeAgentVouchersForSale(merged);
      if(agentPay > 0){
        await createAgentVoucherForSale(id, old.docNo || '', agentPay, date, takenBy);
      }

      const si = STATE.sales.findIndex(x=>x.id===id);
      if(si>=0) STATE.sales[si] = { ...STATE.sales[si], ...salePatch };
      await syncSaleOrderLink('sale', id, salePatch);
      await logAudit('Update', `Sale edited: ${qty} x ${productName}`);
      toast('Sale updated' + (isGeneric ? '' : ' & stock adjusted') + (agentPay > 0 ? ' · agent pay synced' : ''), 'success');
      closeModal();
      if(ACTIVE_PAGE==='sales') goPage('sales');
      else if(ACTIVE_PAGE==='dashboard'){ try{ $('pageContent').innerHTML = pageDashboard(); drawDashboardChart(); }catch(e){} }
    }else{
      // ——— NEW SALE ———
      if(!isGeneric){
        if(qty > productEffectiveStock(product)){ toast('Not enough stock available','error'); return; }
      }
      let docNo = nextDocNo('sales');
      while((STATE.sales||[]).some(s=>s.docNo===docNo)){ docNo = nextDocNo('sales'); }
      const atLocal = new Date().toISOString();
      const salePayload = {
        docNo, productId: productId||'', productName, isGeneric, partyId, partyName,
        qty, rate, subtotal, discountPercent:discPct, discountAmount, total, payMode, date,
        takenBy, resellTotal, agentPay, holdStock, godamId, atLocal,
        payCash, payBank, payAdvance, payCredit
      };
      closeModal();
      const ref = await addDoc(collection(db,'sales'), salePayload);
      if(!isGeneric && !holdStock){
        await adjustProductStock(productId, -qty, godamId);
      }
      STATE.sales = dedupeById([{ id: ref.id, ...salePayload }, ...(STATE.sales||[])]);
      await logAudit('Sale', `${qty} x ${productName} sold`);
      if(agentPay > 0){
        await createAgentVoucherForSale(ref.id, docNo, agentPay, date, takenBy);
      }
      toast('Sale saved'+(isGeneric?'':' & stock updated')+(agentPay?' · agent pay recorded':''),'success');
      if(ACTIVE_PAGE==='sales') goPage('sales');
      else if(ACTIVE_PAGE==='dashboard'){ try{ $('pageContent').innerHTML = pageDashboard(); drawDashboardChart(); }catch(e){} }
      if(confirm('Sale save ho gayi. Ab chhoti PARCHI print karein?')){
        setTimeout(()=> printParchi(ref.id), 400);
      }
    }
  }catch(e){ toast('Failed: '+e.message,'error'); }
  finally{ window._saveLocks['sale'] = false; }
};
window.deleteSale = async function(id, productId, qty){
  if(!confirm('Delete this sale? Stock wapas, agent pay voucher bhi hatega. Linked order Pending ho jayega.')) return;
  try{
    const sale = STATE.sales.find(s=>s.id===id);
    if(sale && sale.productId && !sale.holdStock && !sale.isGeneric){
      await adjustProductStock(sale.productId, Number(sale.qty||qty||0), sale.godamId || getDefaultGodamId());
    }
    // Agent pay voucher hatao
    await removeAgentVouchersForSale(sale || { id, docNo: '' });
    // Linked sales order wapas Pending
    const order = findLinkedOrderForSale(sale);
    if(order){
      await updateDoc(doc(db,'salesOrders', order.id), { status:'Pending', saleId: '' });
      const oi = STATE.salesOrders.findIndex(o=>o.id===order.id);
      if(oi>=0) STATE.salesOrders[oi] = { ...STATE.salesOrders[oi], status:'Pending', saleId: '' };
    }
    await deleteDoc(doc(db,'sales',id));
    STATE.sales = (STATE.sales||[]).filter(s=>s.id!==id);
    await logAudit('Delete', 'Sale entry deleted'+(order?` · order ${order.docNo} reopened`:''));
    toast('Sale deleted'+(sale && Number(sale.agentPay||0)>0?' · agent voucher removed':''),'success');
    if(ACTIVE_PAGE==='sales') goPage('sales');
    else if(ACTIVE_PAGE==='dashboard'){ try{ $('pageContent').innerHTML = pageDashboard(); drawDashboardChart(); }catch(e){} }
  }catch(e){ toast('Failed: '+e.message,'error'); }
};

window.saveSalesOrder = async function(id){
  if(window._saveLocks['salesOrder']){ toast('Pehle se save ho raha hai — wait…','info'); return; }
  window._saveLocks['salesOrder'] = true;
  try{
  const qty = Number($('soQty').value)||0;
  const rate = Number($('soRate').value)||0;
  const resolved = resolveProductFromForm('soProduct','soGenericName');
  if(resolved.isGeneric){
    if(!resolved.productName){ toast('Generic product ka name likhein','error'); return; }
  }else if(!resolved.productId){
    toast('Product select karein','error'); return;
  }
  if(qty<=0 || rate<=0){ toast('Fill quantity and rate','error'); return; }
  const party = STATE.parties.find(p=>p.id===$('soParty').value);
  const total = qty*rate;
  const takenBy = ($('soTakenBy')?.value||'').trim();
  const resellTotal = Number($('soResellTotal')?.value)||0;
  const agentPay = Number($('soAgentPay')?.value)||0;
  const holdStock = !!$('soHoldStock')?.checked;
  const payload = {
    productId: resolved.productId,
    productName: resolved.productName,
    isGeneric: !!resolved.isGeneric,
    partyId: party?.id||'',
    partyName: party?.name||'Walk-in',
    qty, rate, total, takenBy, resellTotal, agentPay, holdStock,
    date: $('soDate').value||todayISO()
  };
  try{
    if(id){
      await updateDoc(doc(db,'salesOrders',id), payload);
      const i = STATE.salesOrders.findIndex(x=>x.id===id);
      const prev = i>=0 ? STATE.salesOrders[i] : null;
      if(i>=0) STATE.salesOrders[i] = { ...STATE.salesOrders[i], ...payload };
      // Billed order ↔ linked sale auto-track (ledger bhi yahi sale se banta hai)
      await syncSaleOrderLink('order', id, payload);
      toast('Sales order updated','success');
    }else{
      let docNo = nextDocNo('salesOrders');
      while((STATE.salesOrders||[]).some(s=>s.docNo===docNo)){ docNo = nextDocNo('salesOrders'); }
      const atLocal = new Date().toISOString();
      closeModal();
      const ref = await addDoc(collection(db,'salesOrders'), { ...payload, docNo, status:'Pending', atLocal });
      STATE.salesOrders = dedupeById([{ id: ref.id, ...payload, docNo, status:'Pending', atLocal }, ...(STATE.salesOrders||[])]);
      toast('Sales order saved','success');
    }
    await logAudit('Sales Order', `Sales order ${id?'updated':'created'}: ${qty} x ${resolved.productName}${takenBy?' · le gaya: '+takenBy:''}`);
    closeModal();
    if(ACTIVE_PAGE==='salesOrders') goPage('salesOrders');
  }catch(e){ toast('Failed: '+e.message,'error'); }
  }finally{ window._saveLocks['salesOrder'] = false; }
};
window.convertSalesOrder = async function(id){
  if(window._saveLocks['convertSO']){ toast('Pehle se save ho raha hai — wait…','info'); return; }
  window._saveLocks['convertSO'] = true;
  try{
  const o = STATE.salesOrders.find(x=>x.id===id);
  if(!o) return;
  if(o.status==='Billed' || o.saleId){ toast('Yeh order pehle se sale ban chuka hai','error'); return; }
  if((STATE.sales||[]).some(s=>s.sourceOrderId===id)){ toast('Linked sale pehle se maujood hai','error'); return; }
  const isGeneric = o.isGeneric || !o.productId;
  const product = isGeneric ? null : STATE.products.find(p=>p.id===o.productId);
  if(!isGeneric){
    if(!product || o.qty > productEffectiveStock(product)){ toast('Not enough stock to bill this order','error'); return; }
  }
  if(!confirm(`Convert order ${o.docNo} into a Sale invoice?`)) return;
  try{
    const salePayload = {
      docNo: nextDocNo('sales'), productId:o.productId||'', productName:o.productName, isGeneric: !!isGeneric,
      partyId:o.partyId, partyName:o.partyName, takenBy: (o.takenBy||'').trim(),
      resellTotal: Number(o.resellTotal||0), agentPay: Number(o.agentPay||0), holdStock: !!o.holdStock,
      sourceOrderId: id,
      qty:o.qty, rate:o.rate, total:o.total, payMode:'Cash', date: o.date||todayISO(), atLocal: new Date().toISOString()
    };
    const saleRef = await addDoc(collection(db,'sales'), salePayload);
    STATE.sales = dedupeById([{ id: saleRef.id, ...salePayload }, ...(STATE.sales||[])]);
    if(product && !o.holdStock) await adjustProductStock(o.productId, -Number(o.qty||0), o.godamId || getDefaultGodamId());
    if(Number(o.agentPay||0) > 0){
      await createAgentVoucherForSale(saleRef.id, salePayload.docNo, Number(o.agentPay||0), salePayload.date, o.takenBy||'Reseller');
    }
    await updateDoc(doc(db,'salesOrders',id), { status:'Billed', saleId: saleRef.id });
    const oi = STATE.salesOrders.findIndex(x=>x.id===id);
    if(oi>=0) STATE.salesOrders[oi] = { ...STATE.salesOrders[oi], status:'Billed', saleId: saleRef.id };
    await logAudit('Convert', `Sales order ${o.docNo} → Sale ${salePayload.docNo}${salePayload.takenBy?' · le gaya: '+salePayload.takenBy:''}`);
    toast('Converted — Sale + ledger linked','success');
    if(ACTIVE_PAGE==='salesOrders') goPage('salesOrders');
  }catch(e){ toast('Failed: '+e.message,'error'); }
  }finally{ window._saveLocks['convertSO'] = false; }
};

/* ===================== DAILY BALANCE SHEET =====================
   Opening balance for a day = the running cash position built up
   from every earlier day (cash sales + cash-in vouchers, minus
   purchases, expenses and cash-out vouchers). Closing balance
   simply carries that forward through the selected day. */
let DAILY_BAL_DATE = todayISO();

/* Cash book reset: after reset, only transactions ON/AFTER resetDate
   count toward opening; opening on reset day = resetOpening (default 0). */
function getCashReset(){
  try{ return JSON.parse(localStorage.getItem('kissan_cash_reset')||'null'); }catch(e){ return null; }
}
function setCashReset(obj){
  if(!obj) localStorage.removeItem('kissan_cash_reset');
  else localStorage.setItem('kissan_cash_reset', JSON.stringify(obj));
}

function cumulativeCashBefore(dateStr){
  const reset = getCashReset();
  // After a reset, ignore all history before resetDate
  const floor = (reset && reset.date) ? reset.date : null;
  const afterFloor = (d) => {
    if(!d) return false;
    if(floor && d < floor) return false;
    return d < dateStr;
  };
  const salesCash = STATE.sales.filter(s=>afterFloor(s.date) && (s.payMode==='Cash' || !s.payMode)).reduce((a,b)=>a+Number(b.total||0),0);
  const vIn = STATE.vouchers.filter(v=>v.type==='In' && afterFloor(v.date)).reduce((a,b)=>a+Number(b.amount||0),0);
  const vOut = STATE.vouchers.filter(v=>v.type==='Out' && afterFloor(v.date)).reduce((a,b)=>a+Number(b.amount||0),0);
  // Sirf Cash purchases cash se katte hain — Credit/udhaar nahi
  const purch = STATE.purchases.filter(p=>afterFloor(p.date) && isCashPurchase(p)).reduce((a,b)=>a+Number(b.total||0),0);
  const exp = STATE.expenses.filter(e=>afterFloor(e.date)).reduce((a,b)=>a+Number(b.amount||0),0);
  // Supplier payments (wasool dena) bhi cash out
  const supPay = STATE.payments.filter(p=>afterFloor(p.date) && p.partyType==='supplier' && !p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  const partyWasool = STATE.payments.filter(p=>afterFloor(p.date) && p.partyType==='party' && !p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  let base = salesCash + vIn + partyWasool - vOut - purch - exp - supPay;
  // On/after reset day, seed with the opening amount set at reset
  if(reset && reset.date && dateStr > reset.date){
    base += Number(reset.opening||0);
  }
  return base;
}

function lastClosingBefore(dateStr){
  const reset = getCashReset();
  let prior = STATE.dailyClosings.filter(c=>c.date < dateStr);
  // Closings before a cash reset are ignored
  if(reset && reset.date) prior = prior.filter(c=>c.date >= reset.date);
  prior.sort((a,b)=>b.date.localeCompare(a.date));
  return prior.length ? prior[0] : null;
}
function openingBalanceFor(dateStr){
  const reset = getCashReset();
  // Exact reset day → use the opening you set (usually 0)
  if(reset && reset.date === dateStr){
    return Number(reset.opening||0);
  }
  // Before reset date → show old cumulative only if viewing history before reset
  if(reset && reset.date && dateStr < reset.date){
    // historical view: no floor
    const salesCash = STATE.sales.filter(s=>s.date < dateStr && (s.payMode==='Cash' || !s.payMode)).reduce((a,b)=>a+Number(b.total||0),0);
    const vIn = STATE.vouchers.filter(v=>v.type==='In' && v.date < dateStr).reduce((a,b)=>a+Number(b.amount||0),0);
    const vOut = STATE.vouchers.filter(v=>v.type==='Out' && v.date < dateStr).reduce((a,b)=>a+Number(b.amount||0),0);
    const purch = STATE.purchases.filter(p=>p.date < dateStr && isCashPurchase(p)).reduce((a,b)=>a+Number(b.total||0),0);
    const exp = STATE.expenses.filter(e=>e.date < dateStr).reduce((a,b)=>a+Number(e.amount||0),0);
    const supPay = STATE.payments.filter(p=>p.date < dateStr && p.partyType==='supplier' && !p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
    const partyWasool = STATE.payments.filter(p=>p.date < dateStr && p.partyType==='party' && !p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
    return salesCash + vIn + partyWasool - vOut - purch - exp - supPay;
  }
  const prev = lastClosingBefore(dateStr);
  if(prev) return Number(prev.closing||0);
  return cumulativeCashBefore(dateStr);
}
function closingRecordFor(dateStr){
  return STATE.dailyClosings.find(c=>c.date===dateStr) || null;
}
function closingReminderBanner(){
  const today = todayISO();
  const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);

    STATE.expenses.some(e=>e.date===yest) || STATE.vouchers.some(v=>v.date===yest);

/* ===================== SHARED CASH TRACKING (Dashboard + Cash Memo) ===================== */
function dayCashSummary(dateStr){
  const d = dateStr || todayISO();
  const opening = openingBalanceFor(d);

  const cashSales = STATE.sales.filter(s=>s.date===d && (s.payMode==='Cash' || !s.payMode));
  const udhaarSales = STATE.sales.filter(s=>s.date===d && s.payMode && s.payMode!=='Cash');
  const partyWasool = STATE.payments.filter(p=>p.date===d && p.partyType==='party' && !p.isGiven);
  const partyGiven = STATE.payments.filter(p=>p.date===d && p.partyType==='party' && p.isGiven);
  const vIn = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
  const vOut = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);
  const purchToday = STATE.purchases.filter(p=>p.date===d);
  const cashPurchToday = purchToday.filter(isCashPurchase);
  const creditPurchToday = purchToday.filter(isCreditPurchase);
  const supplierPays = STATE.payments.filter(p=>p.date===d && p.partyType==='supplier' && !p.isGiven);
  const expToday = STATE.expenses.filter(e=>e.date===d);
  const payrollToday = (STATE.payroll||[]).filter(p=>p.date===d);
  // Returns: cash-sale return ≈ cash refund out; purchase return ≈ cash back in (shop convention)
  const salesRetToday = (STATE.salesReturns||[]).filter(r=>r.date===d);
  const purchRetToday = (STATE.purchaseReturns||[]).filter(r=>r.date===d);

  const cashSalesTotal = cashSales.reduce((a,s)=>a+Number(s.total||0),0);
  const udhaarSalesTotal = udhaarSales.reduce((a,s)=>a+Number(s.total||0),0);
  const wasoolTotal = partyWasool.reduce((a,p)=>a+Number(p.amount||0),0);
  const givenTotal = partyGiven.reduce((a,p)=>a+Number(p.amount||0),0);
  const vInTotal = vIn.reduce((a,v)=>a+Number(v.amount||0),0);
  const vOutTotal = vOut.reduce((a,v)=>a+Number(v.amount||0),0);
  const purchTotal = purchToday.reduce((a,p)=>a+Number(p.total||0),0); // display all
  const cashPurchTotal = cashPurchToday.reduce((a,p)=>a+Number(p.total||0),0); // cash out only
  const creditPurchTotal = creditPurchToday.reduce((a,p)=>a+Number(p.total||0),0);
  const supplierPayTotal = supplierPays.reduce((a,p)=>a+Number(p.amount||0),0);
  const expTotal = expToday.reduce((a,e)=>a+Number(e.amount||0),0);
  const payrollTotal = payrollToday.reduce((a,p)=>a+Number(p.amount||0),0);
  const salesRetTotal = salesRetToday.reduce((a,r)=>a+Number(r.total||0),0);
  const purchRetTotal = purchRetToday.reduce((a,r)=>a+Number(r.total||0),0);

  const totalReceipts = cashSalesTotal + wasoolTotal + vInTotal + purchRetTotal;
  // Credit purchase cash se NAHI kat-ta — sirf Cash purchase + supplier payment + expenses...
  const totalPayments = cashPurchTotal + supplierPayTotal + expTotal + payrollTotal + vOutTotal + givenTotal + salesRetTotal;
  const closing = opening + totalReceipts - totalPayments;

  return {
    d, opening,
    cashSales, udhaarSales, partyWasool, partyGiven, vIn, vOut, purchToday, supplierPays, expToday, payrollToday,
    salesRetToday, purchRetToday,
    cashSalesTotal, udhaarSalesTotal, wasoolTotal, givenTotal, vInTotal, vOutTotal,
    purchTotal, cashPurchTotal, creditPurchTotal, supplierPayTotal, expTotal, payrollTotal, salesRetTotal, purchRetTotal,
    totalReceipts, totalPayments, closing
  };
}

/* ===================== DAILY CASH MEMO =====================
   Classic two-column cash memo: Receipts (Left) vs Payments (Right).
   Har taraf ki entries ek doosri ko match karti hain —
   Opening + Receipts = Payments + Closing.
   Cash sales, party payments, supplier payments, expenses, vouchers
   sab track hote hain. */
let CASH_MEMO_DATE = todayISO();

function pageDailyCashMemo(){
  const d = CASH_MEMO_DATE;
  const opening = openingBalanceFor(d);

  // --- RECEIPTS (Cash In) ---
  const cashSales = STATE.sales.filter(s=>s.date===d && (s.payMode==='Cash' || !s.payMode));
  const partyPays = STATE.payments.filter(p=>p.date===d && p.partyType==='party' && !p.isGiven);
  const vIn = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);

  const receiptLines = [];
  cashSales.forEach(s=>{
    receiptLines.push({
      desc: `Cash sale — ${s.productName||''} (${s.partyName||'Walk-in'})${s.docNo?' #'+s.docNo:''}`,
      amount: Number(s.total||0)
    });
  });
  partyPays.forEach(p=>{
    const party = STATE.parties.find(x=>x.id===p.partyId);
    receiptLines.push({
      desc: `Udhaar wasool — ${party?.name||'Customer'}${p.note?': '+p.note:''}`,
      amount: Number(p.amount||0)
    });
  });
  vIn.forEach(v=>{
    receiptLines.push({
      desc: `Cash in — ${v.note||'Voucher'}`,
      amount: Number(v.amount||0)
    });
  });
  (STATE.purchaseReturns||[]).filter(r=>r.date===d).forEach(r=>{
    receiptLines.push({
      desc: `Purchase return — ${r.productName||''} (${r.supplierName||'Supplier'})${r.docNo?' #'+r.docNo:''}`,
      amount: Number(r.total||0)
    });
  });

  // --- PAYMENTS (Cash Out) ---
  // Sirf Cash purchases — Credit/udhaar purchase cash memo se bahar
  const purchToday = STATE.purchases.filter(p=>p.date===d && isCashPurchase(p));
  const supplierPays = STATE.payments.filter(p=>p.date===d && p.partyType==='supplier' && !p.isGiven);
  const expToday = STATE.expenses.filter(e=>e.date===d);
  const vOut = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);
  const payrollToday = (STATE.payroll||[]).filter(p=>p.date===d);

  const paymentLines = [];
  purchToday.forEach(p=>{
    paymentLines.push({
      desc: `Purchase (cash) — ${p.productName||''} (${p.supplierName||'—'})${p.docNo?' #'+p.docNo:''}`,
      amount: Number(p.total||0)
    });
  });
  (STATE.salesReturns||[]).filter(r=>r.date===d).forEach(r=>{
    paymentLines.push({
      desc: `Sales return — ${r.productName||''} (${r.partyName||'Customer'})${r.docNo?' #'+r.docNo:''}`,
      amount: Number(r.total||0)
    });

    paymentLines.push({
      desc: `Supplier payment — ${sup?.name||'Supplier'}${p.note?': '+p.note:''}`,
      amount: Number(p.amount||0)
    });
  });
  STATE.payments.filter(p=>p.date===d && p.partyType==='party' && p.isGiven).forEach(p=>{
    const party = STATE.parties.find(x=>x.id===p.partyId);
    paymentLines.push({

      amount: Number(p.amount||0)
    });

  expToday.forEach(e=>{

      amount: Number(e.amount||0)
    });

  payrollToday.forEach(p=>{

window.confirmClearTestDay = async function(){
  const d = $('cmDate')?.value || CASH_MEMO_DATE || todayISO();
  const password = ($('clearDayPass')?.value || '').trim();
  if(!password){ toast('Password likhein','error'); return; }
  if(!auth.currentUser || !auth.currentUser.email){
    toast('Pehle login karein','error'); return;
  }
  const ok = confirm('Last confirm: ' + d + ' ki test entries PERMANENT delete?');
  if(!ok) return;
  try{
    toast('Password check…','info');
    const cred = EmailAuthProvider.credential(auth.currentUser.email, password);
    await reauthenticateWithCredential(auth.currentUser, cred);

    toast('Clearing ' + d + '…','info');
    let deleted = 0;

    // Sales — restore stock then delete
    const sales = (STATE.sales||[]).filter(s=>s.date===d);
    for(const s of sales){
      try{
        if(s.productId && !s.holdStock && !s.isGeneric){
          const product = STATE.products.find(p=>p.id===s.productId);
          if(product){
            const qty = Number(s.qty||0);
            await adjustProductStock(s.productId, qty, s.godamId || getDefaultGodamId());
          }
        }
        await deleteDoc(doc(db,'sales', s.id));
        deleted++;
      }catch(e){ console.warn('sale del', e); }
    }
    STATE.sales = (STATE.sales||[]).filter(s=>s.date!==d);

    async function wipeCol(colName, stateKey, pred){
      const rows = (STATE[stateKey]||[]).filter(pred);
      for(const r of rows){
        try{
          await deleteDoc(doc(db, colName, r.id));
          deleted++;
        }catch(e){ console.warn(colName, e); }
      }
      STATE[stateKey] = (STATE[stateKey]||[]).filter(x=>!pred(x));
    }
    await wipeCol('payments', 'payments', p=>p.date===d);
    await wipeCol('vouchers', 'vouchers', v=>v.date===d);
    await wipeCol('expenses', 'expenses', e=>e.date===d);
    await wipeCol('payroll', 'payroll', p=>p.date===d);
    // Us din ka closing lock hatao taake opening dubara calculate ho
    await wipeCol('dailyClosings', 'dailyClosings', c=>c.date===d);
    // Sales returns us din ki
    const srets = (STATE.salesReturns||[]).filter(r=>r.date===d);
    for(const r of srets){
      try{
        if(r.productId && !r.isGeneric){
          await adjustProductStock(r.productId, -Number(r.qty||0), r.godamId || getDefaultGodamId());
        }
        await deleteDoc(doc(db,'salesReturns', r.id));
        deleted++;
      }catch(e){ console.warn('sret', e); }
    }
    STATE.salesReturns = (STATE.salesReturns||[]).filter(r=>r.date!==d);

    await logAudit('Clear', `Test day cleared ${d} — ${deleted} records deleted by ${auth.currentUser.email} (parties/products/purchases safe)`);
    closeModal();
    toast(`Clear ho gaya ✓ ${d} — ${deleted} entries · stock/party safe`, 'success');
    if(typeof softRefreshActivePage === 'function') softRefreshActivePage();
    else goPage('dailycashmemo');
  }catch(e){
    console.error(e);
    const msg = (e.code==='auth/wrong-password' || e.code==='auth/invalid-credential')
      ? 'Password galat hai'
      : (e.message || 'Clear failed');
    toast(msg, 'error');
  }
};

window.exportCashMemoPdf = function(){
  const jsPDFCtor = window.jspdf?.jsPDF;
  if(!jsPDFCtor){ toast('PDF library not ready','error'); return; }
  const d = CASH_MEMO_DATE;
  const opening = openingBalanceFor(d);
  const cashSales = STATE.sales.filter(s=>s.date===d && (s.payMode==='Cash' || !s.payMode));
  const partyPays = STATE.payments.filter(p=>p.date===d && p.partyType==='party' && !p.isGiven);
  const vIn = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
  const purchToday = STATE.purchases.filter(p=>p.date===d && isCashPurchase(p));
  const supplierPays = STATE.payments.filter(p=>p.date===d && p.partyType==='supplier' && !p.isGiven);
  const expToday = STATE.expenses.filter(e=>e.date===d);
  const vOut = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);

  const receipts = [
    ['Opening', '', opening],
    ...cashSales.map(s=>['Cash sale', `${s.productName} (${s.partyName||'Walk-in'})`, Number(s.total||0)]),
    ...partyPays.map(p=>{
      const party = STATE.parties.find(x=>x.id===p.partyId);
      return ['Udhaar wasool', party?.name||'Customer', Number(p.amount||0)];
    }),
    ...vIn.map(v=>['Cash in', v.note||'Voucher', Number(v.amount||0)]),
  ];
  const payments = [
    ...purchToday.map(p=>['Purchase', `${p.productName} (${p.supplierName||'—'})`, Number(p.total||0)]),
    ...supplierPays.map(p=>{
      const sup = STATE.suppliers.find(x=>x.id===p.partyId);
      return ['Supplier pay', sup?.name||'Supplier', Number(p.amount||0)];
    }),
    ...expToday.map(e=>['Expense', e.category||'', Number(e.amount||0)]),
    ...vOut.map(v=>['Cash out', v.note||'Voucher', Number(v.amount||0)]),
  ];
  const totalR = receipts.reduce((a,b)=>a+Number(b[2]||0),0) - opening + opening; // opening already in list
  const sumR = receipts.reduce((a,b)=>a+Number(b[2]||0),0);
  const sumP = payments.reduce((a,b)=>a+Number(b[2]||0),0);
  const closing = opening + (sumR - opening) - sumP;

  const pdf = new jsPDFCtor();
  pdf.setFontSize(14); pdf.text('Kissan Fertilizer — Daily Cash Memo', 14, 16);
  pdf.setFontSize(10); pdf.text(`Date: ${d}  |  Miro Khan Road, Kamber`, 14, 22);
  pdf.text(`Opening: ${fmt(opening)}   Receipts: ${fmt(sumR-opening)}   Payments: ${fmt(sumP)}   Closing: ${fmt(closing)}`, 14, 28);
  pdf.autoTable({ startY:34, head:[['Type','Detail','Amount']], body: receipts.map(r=>[r[0],r[1],fmt(r[2])]), styles:{fontSize:9} });
  const y2 = pdf.lastAutoTable.finalY + 8;
  pdf.setFontSize(11); pdf.text('Payments (Cash Out)', 14, y2);
  pdf.autoTable({ startY:y2+4, head:[['Type','Detail','Amount']], body: payments.map(r=>[r[0],r[1],fmt(r[2])]), styles:{fontSize:9} });
  const pageH = pdf.internal.pageSize.getHeight();
  pdf.setFontSize(8); pdf.setTextColor(120);
  pdf.text('Software by Fazul Khan Chandio · 03333909816', 14, pageH - 10);
  pdf.save(`daily_cash_memo_${d}.pdf`);
};

window.confirmCashReset = async function(){
  const password = ($('cashResetPassword')?.value||'').trim();
  const opening = Number($('cashResetOpening')?.value||0);
  const date = $('cashResetDate')?.value || todayISO();
  if(!password){ toast('Password likhein','error'); return; }
  if(!auth.currentUser || !auth.currentUser.email){
    toast('Pehle login karein','error'); return;
  }
  try{
    toast('Password check…','info');
    const cred = EmailAuthProvider.credential(auth.currentUser.email, password);
    await reauthenticateWithCredential(auth.currentUser, cred);

    setCashReset({
      date,
      opening,
      by: auth.currentUser.email,
      at: new Date().toISOString()
    });
    // Galat locked daily closings hatao (warna purana −3.3M wapas aa jata hai)
    const badClosings = (STATE.dailyClosings || []).filter(c => c.date >= date);
    for(const c of badClosings){
      try{
        await deleteDoc(doc(db, 'dailyClosings', c.id));
      }catch(e){ console.warn('closing wipe', e); }
    }
    STATE.dailyClosings = (STATE.dailyClosings || []).filter(c => c.date < date);

    await logAudit('Reset', `Cash opening reset to ${opening} from ${date} (closings cleared from ${date})`);
    closeModal();
    toast(`Opening fix ✓ ${fmt(opening)} · date ${date}`,'success');
    CASH_MEMO_DATE = date;
    if(typeof softRefreshActivePage === 'function') softRefreshActivePage();
    else goPage('dailycashmemo');
  }catch(e){
    console.error(e);
    const msg = (e.code==='auth/wrong-password' || e.code==='auth/invalid-credential')
      ? 'Password galat hai'
      : (e.message || 'Reset failed');
    toast(msg,'error');
  }
};

window.clearCashReset = async function(){
  const password = prompt('Purana cumulative wapas lane ke liye login password likhein:');
  if(password===null) return;
  if(!password){ toast('Password required','error'); return; }
  try{
    const cred = EmailAuthProvider.credential(auth.currentUser.email, password);
    await reauthenticateWithCredential(auth.currentUser, cred);
    setCashReset(null);
    await logAudit('Reset', 'Cash opening reset cleared — cumulative restored');
    toast('Reset hata diya — purana cumulative wapas','success');
    goPage('dailybalance');
  }catch(e){
    toast(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'Password galat':'Failed: '+e.message,'error');
  }
};

/* ===================== DAILY CLOSING (bank-style end-of-day) =====================
   "Close Day" locks that date's opening/in/out/closing into the
   dailyClosings collection as a permanent history record. Once locked,
   that day's figures never move again even if data is edited later.
   The next day automatically opens fresh — its opening balance = the
   last closing, and its own cash-in/out list starts empty because
   it's simply filtered by that day's date. No manual reset needed. */
let CLOSING_VIEW_DATE = todayISO();

function pageDailyClosing(){
  const d = CLOSING_VIEW_DATE;
  const locked = closingRecordFor(d);

  let opening, salesToday, purchToday, expToday, vInToday, vOutToday, cashIn, cashOut, closing;
  if(locked){
    opening = Number(locked.opening||0);
    cashIn = Number(locked.cashIn||0);
    cashOut = Number(locked.cashOut||0);
    closing = Number(locked.closing||0);
    salesToday = STATE.sales.filter(s=>s.date===d);
    purchToday = STATE.purchases.filter(p=>p.date===d);
    expToday = STATE.expenses.filter(e=>e.date===d);
    vInToday = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
    vOutToday = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);
  }else{
    opening = openingBalanceFor(d);
    salesToday = STATE.sales.filter(s=>s.date===d);
    purchToday = STATE.purchases.filter(p=>p.date===d);
    expToday = STATE.expenses.filter(e=>e.date===d);
    vInToday = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
    vOutToday = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);
    cashIn = salesToday.reduce((a,b)=>a+Number(b.total||0),0) + vInToday.reduce((a,b)=>a+Number(b.amount||0),0);
    cashOut = purchToday.reduce((a,b)=>a+Number(b.total||0),0) + expToday.reduce((a,b)=>a+Number(b.amount||0),0) + vOutToday.reduce((a,b)=>a+Number(b.amount||0),0);
    closing = opening + cashIn - cashOut;
  }

  const history = [...STATE.dailyClosings].sort((a,b)=>b.date.localeCompare(a.date));

  return `
  <div class="stitch panel no-print">
    <div class="panel-head"><h3>Choose date</h3>
      <div class="toolbar">
        <input type="date" id="dcDate" value="${d}" max="${todayISO()}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <button class="btn btn-primary btn-sm" onclick="applyClosingDate()">Show</button>
        <button class="btn btn-outline btn-sm" onclick="exportClosingHistoryExcel()">Export history (Excel)</button>
      </div>
    </div>
  </div>

  <div class="stitch panel" style="text-align:center;margin-bottom:16px">
    <h3 style="font-family:var(--serif);font-size:19px;color:var(--field-dark)">Daily Closing — ${d}</h3>
    ${locked
      ? `<p style="margin-top:6px"><span class="stamp" style="background:var(--ok-soft);color:var(--ok);padding:4px 12px;border-radius:20px;font-weight:700;font-size:12.5px">🔒 Closed by ${locked.closedBy||'—'} at ${(locked.closedAt||'').replace('T',' ').slice(0,16)}</span></p>`
      : `<p class="muted" style="font-size:12.5px;margin-top:4px">Not yet closed — figures below are live and will change until you close the day.</p>`}
  </div>

  <div class="stats">
    <div class="stitch stat"><div class="lbl">Opening balance</div><div class="val">${fmt(opening)}</div><div class="sub">${locked?'locked from previous closing':"carried from last closed day"}</div></div>
    <div class="stitch stat"><div class="lbl">Cash in</div><div class="val" style="color:var(--ok)">${fmt(cashIn)}</div><div class="sub">${salesToday.length} sale(s), ${vInToday.length} voucher(s)</div></div>
    <div class="stitch stat red"><div class="lbl">Cash out</div><div class="val">${fmt(cashOut)}</div><div class="sub">${purchToday.length} purchase(s), ${expToday.length} expense(s), ${vOutToday.length} voucher(s)</div></div>
    <div class="stitch stat gold"><div class="lbl">Closing balance</div><div class="val">${fmt(closing)}</div><div class="sub">opening + in − out</div></div>
  </div>

  <div class="stitch panel no-print" style="text-align:center">
    ${locked
      ? `<p style="color:var(--ink-soft);font-size:13px">This day is closed and locked. Tomorrow opens automatically with ${fmt(closing)} as its opening balance.</p>`
      : `<button class="btn btn-primary" onclick="closeDailyDay('${d}')">🔒 Close ${d===todayISO()?"Today's":'this'} Day &amp; Save to History</button>
         <p class="muted" style="font-size:12px;margin-top:8px">Locks opening/in/out/closing for ${d} into permanent history. Do this once, at the end of the day.</p>`}
  </div>

  <div class="stitch panel">
    <div class="panel-head"><h3>Closing history <span class="muted" style="font-weight:500;font-size:12px">(${history.length})</span></h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th class="right">Opening</th><th class="right">Cash in</th><th class="right">Cash out</th><th class="right">Closing</th><th>Closed by</th></tr></thead>
      <tbody>
        ${history.length? history.map(c=>`<tr style="cursor:pointer" onclick="CLOSING_VIEW_DATE='${c.date}';goPage('dailyclosing')">
            <td class="mono">${c.date}</td>
            <td class="right mono">${fmt(c.opening)}</td>
            <td class="right mono" style="color:var(--ok)">${fmt(c.cashIn)}</td>
            <td class="right mono" style="color:var(--danger)">${fmt(c.cashOut)}</td>
            <td class="right mono" style="font-weight:700">${fmt(c.closing)}</td>
            <td>${c.closedBy||'—'}</td>
          </tr>`).join('')
        : `<tr class="empty-row"><td colspan="6">No day has been closed yet.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}
window.applyClosingDate = function(){
  CLOSING_VIEW_DATE = $('dcDate').value || todayISO();
  goPage('dailyclosing');
};
window.closeDailyDay = async function(dateStr){
  if(closingRecordFor(dateStr)){ toast('This day is already closed.','error'); return; }
  const opening = openingBalanceFor(dateStr);
  const salesToday = STATE.sales.filter(s=>s.date===dateStr);
  const purchToday = STATE.purchases.filter(p=>p.date===dateStr);
  const expToday = STATE.expenses.filter(e=>e.date===dateStr);
  const vInToday = STATE.vouchers.filter(v=>v.type==='In' && v.date===dateStr);
  const vOutToday = STATE.vouchers.filter(v=>v.type==='Out' && v.date===dateStr);
  const cashIn = salesToday.reduce((a,b)=>a+Number(b.total||0),0) + vInToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const cashOut = purchToday.reduce((a,b)=>a+Number(b.total||0),0) + expToday.reduce((a,b)=>a+Number(b.amount||0),0) + vOutToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const closing = opening + cashIn - cashOut;
  if(!confirm(`Close ${dateStr} with a closing balance of ${fmt(closing)}?\n\nThis locks the day permanently. It cannot be edited afterwards — only a fresh day can be closed going forward.`)) return;
  try{
    await addDoc(collection(db,'dailyClosings'), {
      date: dateStr, opening, cashIn, cashOut, closing,
      salesCount: salesToday.length, purchCount: purchToday.length, expCount: expToday.length,
      vInCount: vInToday.length, vOutCount: vOutToday.length,
      closedBy: CURRENT_USER?.email || 'unknown',
      closedAt: new Date().toISOString(), at: serverTimestamp()
    });
    await logAudit('Daily Closing', `Closed ${dateStr} — opening ${fmt(opening)}, closing ${fmt(closing)}`);
    toast(`${dateStr} closed. Tomorrow opens automatically at ${fmt(closing)}.`, 'success');
  }catch(e){ toast('Could not save closing — check connection.', 'error'); }
};
window.exportClosingHistoryExcel = function(){
  const history = [...STATE.dailyClosings].sort((a,b)=>a.date.localeCompare(b.date));
  const ws = XLSX.utils.json_to_sheet(history.map(c=>({

let REPORT_FROM = new Date(new Date().setDate(new Date().getDate()-6)).toISOString().slice(0,10);
let REPORT_TO = todayISO();
window.REPORT_FROM = REPORT_FROM; window.REPORT_TO = REPORT_TO;
function pageReports(){
  const sales = STATE.sales.filter(s=>s.date>=REPORT_FROM && s.date<=REPORT_TO);
  const purch = STATE.purchases.filter(p=>p.date>=REPORT_FROM && p.date<=REPORT_TO);
  const exp = STATE.expenses.filter(e=>e.date>=REPORT_FROM && e.date<=REPORT_TO);
  const salesTotal = sales.reduce((a,b)=>a+Number(b.total||0),0);
  const purchTotal = purch.reduce((a,b)=>a+Number(b.total||0),0);
  const expTotal = exp.reduce((a,b)=>a+Number(b.amount||0),0);
  const profitSimple = salesTotal - purchTotal - expTotal;
  // Detailed profit — same formula as dashboard (product margin + reseller)
  function repProductCost(s){
    if(s.isGeneric || !s.productId) return 0;
    const p = STATE.products.find(x=>x.id===s.productId);
    return Number(p?.purchasePrice||0) * Number(s.qty||0);
  }
  function repSaleProfit(s){
    const total = Number(s.total||0);
    const agent = Number(s.agentPay||0);
    const cost = repProductCost(s);
    if(agent > 0) return (total - cost) + (total - agent);
    return total - cost;
  }
  const detailedProfit = sales.reduce((a,s)=>a + repSaleProfit(s), 0) - expTotal;
  const productMargin = sales.reduce((a,s)=>a + (Number(s.total||0) - repProductCost(s)), 0);
  const resellerNet = sales.reduce((a,s)=>{
    const agent = Number(s.agentPay||0);
    return agent > 0 ? a + (Number(s.total||0) - agent) : a;
  }, 0);
  const agentDeals = sales.filter(s=>Number(s.agentPay||0)>0).length;
  return `
  <div class="stitch panel">
    <div class="panel-head"><h3>Date range</h3>
      <div class="toolbar">
        <input type="date" id="repFrom" value="${REPORT_FROM}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <input type="date" id="repTo" value="${REPORT_TO}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <button class="btn btn-primary btn-sm" onclick="applyReportRange()">Apply</button>
        <button class="btn btn-outline btn-sm" onclick="exportReportExcel()">Export Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportReportPdf()">Export PDF</button>
      </div>
    </div>
  </div>
  <div class="stats">
    <div class="stitch stat"><div class="lbl">Sales</div><div class="val">${fmt(salesTotal)}</div><div class="sub">${sales.length} invoices</div></div>
    <div class="stitch stat gold"><div class="lbl">Purchases</div><div class="val">${fmt(purchTotal)}</div><div class="sub">${purch.length} entries</div></div>
    <div class="stitch stat red"><div class="lbl">Expenses</div><div class="val">${fmt(expTotal)}</div><div class="sub">${exp.length} entries</div></div>
    <div class="stitch stat"><div class="lbl">Simple estimate</div><div class="val" style="color:${profitSimple>=0?'var(--ok)':'var(--danger)'}">${fmt(profitSimple)}</div><div class="sub">sales − purch − exp</div></div>
    <div class="stitch stat ${detailedProfit>=0?'ok':'red'}"><div class="lbl">Detailed profit</div><div class="val">${fmt(detailedProfit)}</div><div class="sub">margin ${fmt(productMargin)}${resellerNet?` + resell ${fmt(resellerNet)}`:''}${agentDeals?` · ${agentDeals} reseller`:''} − exp</div></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Sales in range</h3></div>
    <div class="tbl-wrap"><table class="tbl" id="repTable">
      <thead><tr><th>Date</th><th>Customer</th><th>Product</th><th class="right">Qty</th><th class="right">Total</th><th>Deal</th></tr></thead>
      <tbody>${sales.length? sales.map(s=>{
        const ap = Number(s.agentPay||0);
        const deal = ap>0 ? `Reseller · agent ${fmt(ap)}` : (s.holdStock ? 'Hold stock' : '—');
        return `<tr><td>${s.date}</td><td>${s.partyName||'Walk-in'}${s.takenBy?`<div class="hint" style="margin:0">${s.takenBy}</div>`:''}</td><td>${s.productName}</td><td class="right mono">${s.qty}</td><td class="right mono">${fmt(s.total)}</td><td class="muted" style="font-size:12px">${deal}</td></tr>`;
      }).join('')
      : `<tr class="empty-row"><td colspan="6">No sales in this range.</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Purchases in range</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Supplier</th><th>Product</th><th class="right">Qty</th><th class="right">Total</th></tr></thead>
      <tbody>${purch.length? purch.map(p=>`<tr><td>${p.date}</td><td>${p.supplierName||'—'}</td><td>${p.productName}</td><td class="right mono">${p.qty}</td><td class="right mono">${fmt(p.total)}</td></tr>`).join('')
      : `<tr class="empty-row"><td colspan="5">No purchases in this range.</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Product-wise sales (MIS)</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Product</th><th class="right">Qty sold</th><th class="right">Sales value</th></tr></thead>
      <tbody>${productWiseReport(sales)}</tbody>
    </table></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Customer-wise sales (MIS)</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Customer</th><th class="right">Invoices</th><th class="right">Sales value</th></tr></thead>
      <tbody>${partyWiseReport(sales)}</tbody>
    </table></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Receivables aging (Udhaar)</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Customer</th><th class="right">0–30 days</th><th class="right">31–60 days</th><th class="right">60+ days</th><th class="right">Total due</th></tr></thead>
      <tbody>${agingReport()}</tbody>
    </table></div>
  </div>`;
}
function productWiseReport(sales){
  const map = {};
  sales.forEach(s=>{ const k=s.productName||'—'; map[k]=map[k]||{qty:0,total:0}; map[k].qty+=Number(s.qty||0); map[k].total+=Number(s.total||0); });
  const rows = Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
  if(!rows.length) return `<tr class="empty-row"><td colspan="3">No sales in this range.</td></tr>`;
  return rows.map(([name,v])=>`<tr><td>${name}</td><td class="right mono">${v.qty}</td><td class="right mono">${fmt(v.total)}</td></tr>`).join('');
}
function partyWiseReport(sales){
  const map = {};
  sales.forEach(s=>{ const k=s.partyName||'Walk-in'; map[k]=map[k]||{n:0,total:0}; map[k].n+=1; map[k].total+=Number(s.total||0); });
  const rows = Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
  if(!rows.length) return `<tr class="empty-row"><td colspan="3">No sales in this range.</td></tr>`;
  return rows.map(([name,v])=>`<tr><td>${name}</td><td class="right mono">${v.n}</td><td class="right mono">${fmt(v.total)}</td></tr>`).join('');
}
function agingReport(){
  const today = new Date();
  const rows = STATE.parties.map(p=>{
    const bal = partyBalance(p.id);
    if(bal<=0) return null;
    const unpaidSales = STATE.sales.filter(s=>s.partyId===p.id && s.payMode!=='Cash');
    let b0=0,b30=0,b60=0;
    unpaidSales.forEach(s=>{
      const days = Math.floor((today - new Date(s.date)) / 86400000);
      if(days<=30) b0 += Number(s.total||0);
      else if(days<=60) b30 += Number(s.total||0);
      else b60 += Number(s.total||0);
    });
    return {name:p.name, b0, b30, b60, bal};
  }).filter(Boolean).sort((a,b)=>b.bal-a.bal);
  if(!rows.length) return `<tr class="empty-row"><td colspan="5">No outstanding udhaar balances.</td></tr>`;
  return rows.map(r=>`<tr><td>${r.name}</td><td class="right mono">${fmt(r.b0)}</td><td class="right mono">${fmt(r.b30)}</td><td class="right mono" style="color:var(--danger)">${fmt(r.b60)}</td><td class="right mono" style="font-weight:700">${fmt(r.bal)}</td></tr>`).join('');
}

window.gdriveConnect = async function(){
  try{
    toast('Google account choose karein…','info');
    const provider = new GoogleAuthProvider();
    provider.addScope('https://www.googleapis.com/auth/drive.file');
    provider.addScope('https://www.googleapis.com/auth/userinfo.email');
    provider.setCustomParameters({ prompt: 'select_account' });

    let result = null;
    // Prefer link so shop login (admin@kissan.com) same rahe
    try{
      if(auth.currentUser){
        result = await linkWithPopup(auth.currentUser, provider);
      }
    }catch(linkErr){
      const code = linkErr?.code || '';
      // already linked / credential-in-use / popup closed → try plain Google popup for token only
      if(code === 'auth/credential-already-in-use' || code === 'auth/provider-already-linked' || code === 'auth/email-already-in-use'){
        // Account pehle se Google se judi ho sakti hai — naya popup token ke liye
        result = await signInWithPopup(auth, provider);
      } else if(code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request'){
        toast('Google window band ho gayi — phir try karein','error');
        return;
      } else if(code === 'auth/popup-blocked'){
        toast('Popup block hai — browser mein allow karein','error');
        return;
      } else {
        // Fallback: sign-in with Google (may switch session to Google user)
        console.warn('linkWithPopup failed, fallback signInWithPopup', linkErr);
        result = await signInWithPopup(auth, provider);
      }
    }
    if(!result){
      result = await signInWithPopup(auth, provider);
    }

    const cred = GoogleAuthProvider.credentialFromResult(result);
    const accessToken = cred && cred.accessToken;
    if(!accessToken){
      toast('Google token nahi mila — Firebase mein Google Sign-in enable karein','error');
      return;
    }
    // Token ~1 hour; refresh by re-connect
    const expires_at = Date.now() + 55 * 60 * 1000;
    localStorage.setItem('gdrive_token', JSON.stringify({ access_token: accessToken, expires_at }));

    let email = result.user?.email || '';
    const gProv = (result.user?.providerData || []).find(p => p.providerId === 'google.com');
    if(gProv && gProv.email) email = gProv.email;
    if(!email){
      try{
        const info = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', {
          headers: { Authorization: 'Bearer ' + accessToken }
        }).then(r=>r.json());
        if(info.email) email = info.email;
      }catch(_){}
    }
    if(email) localStorage.setItem('gdrive_email', email);

    toast(email ? ('Connected: ' + email) : 'Google Drive connected', 'success');
    if(ACTIVE_PAGE==='settings') goPage('settings');
  }catch(e){
    console.error(e);
    const msg = e?.code === 'auth/operation-not-allowed'
      ? 'Firebase Console mein Google Sign-in ON karein'
      : (e?.message || 'Connect failed');
    toast(msg, 'error');
  }
};

async function gdriveEnsureToken(){
  let t = gdriveGetToken();
  if(t && t.access_token && t.expires_at > Date.now()) return t.access_token;
  // Token expire — user se phir Connect
  toast('Google session expire — dubara Connect karein','error');
  throw new Error('Google Drive reconnect required');
}

async function gdriveEnsureFolder(accessToken){
  // Find folder
  const q = encodeURIComponent(`name='${GDRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const list = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer '+accessToken }
  }).then(r=>r.json());
  if(list.files && list.files.length) return list.files[0].id;
  // Create folder
  const created = await fetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST',
    headers:{ Authorization:'Bearer '+accessToken, 'Content-Type':'application/json' },
    body: JSON.stringify({ name: GDRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  }).then(r=>r.json());
  if(!created.id) throw new Error(created.error?.message || 'Folder create failed');
  return created.id;
}

window.gdriveUploadBackup = async function(){
  try{
    toast('Drive pe backup ho raha hai…','info');
    const accessToken = await gdriveEnsureToken();
    const folderId = await gdriveEnsureFolder(accessToken);
    const payload = buildBackupPayload();
    const fileName = `kissan-fertilizer-backup_${todayISO()}_${Date.now()}.json`;
    const metadata = { name: fileName, parents: [folderId], mimeType: 'application/json' };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
      method:'POST',
      headers:{ Authorization: 'Bearer '+accessToken },
      body: form
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error?.message || 'Upload failed');
    localStorage.setItem('gdrive_last_backup', new Date().toISOString());
    saveLocalDailyBackup();
    const totalRecords = BACKUP_COLLECTIONS.reduce((n,k)=>n+(payload.collections[k]?.length||0),0);
    await logAudit('Backup', `Google Drive backup — ${totalRecords} records → ${fileName}`);
    toast('Drive backup complete ✓','success');
    if(ACTIVE_PAGE==='settings') goPage('settings');
  }catch(e){
    console.error(e);
    toast('Drive backup failed: '+e.message,'error');
  }
};

/* ===================== PC FOLDER BACKUP (File System Access API) =====================
   Chrome/Edge on desktop: user picks a folder once; we write daily JSON there. */
const PC_FOLDER_DB = 'kissan_pc_backup_fs';
const PC_FOLDER_STORE = 'handles';
const PC_FOLDER_KEY = 'backupDir';

function pcFolderIsReady(){
  return localStorage.getItem('pc_folder_linked') === '1';
}
function pcFolderStatusLabel(){
  const last = localStorage.getItem('pc_folder_last_backup');
  const name = localStorage.getItem('pc_folder_name') || '';
  if(!pcFolderIsReady()) return 'Abhi koi folder link nahi. PC pe “Choose folder” dabao.';
  return (name ? ('Folder: <b>'+name+'</b>. ') : '') +
    (last ? ('Last file backup: ' + new Date(last).toLocaleString('en-PK')) : 'Abhi file nahi bani.');
}
window.togglePcFolderAuto = function(on){
  localStorage.setItem('pc_folder_auto', on ? '1' : '0');
  toast(on ? 'PC folder auto-backup ON' : 'PC folder auto-backup OFF', 'success');
};

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(PC_FOLDER_DB, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(PC_FOLDER_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSetHandle(handle){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(PC_FOLDER_STORE, 'readwrite');
    tx.objectStore(PC_FOLDER_STORE).put(handle, PC_FOLDER_KEY);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetHandle(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(PC_FOLDER_STORE, 'readonly');
    const req = tx.objectStore(PC_FOLDER_STORE).get(PC_FOLDER_KEY);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbClearHandle(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(PC_FOLDER_STORE, 'readwrite');
    tx.objectStore(PC_FOLDER_STORE).delete(PC_FOLDER_KEY);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

async function ensurePcDirPermission(handle){
  const q = await handle.queryPermission({ mode: 'readwrite' });

  return r === 'granted';
}

window.writePcFolderBackup = async function(forceToast){
  try{
    if(!window.showDirectoryPicker){
      if(forceToast) toast('PC folder backup sirf Chrome/Edge (desktop) pe','error');
      return false;
    }
    const handle = await idbGetHandle();
    if(!handle){
      if(forceToast) toast('Pehle folder choose karein','error');
      return false;
    }
    const ok = await ensurePcDirPermission(handle);
    if(!ok){
      if(forceToast) toast('Folder permission chahiye — Settings se dubara Choose folder','error');
      return false;
    }
    const payload = buildBackupPayload();
    const fileName = `kissan-backup_${todayISO()}.json`;
    const fileHandle = await handle.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    // Also keep a stable "latest" file (overwrite)
    try{
      const latest = await handle.getFileHandle('kissan-backup_LATEST.json', { create: true });
      const w2 = await latest.createWritable();
      await w2.write(JSON.stringify(payload, null, 2));
      await w2.close();
    }catch(_){}
    localStorage.setItem('pc_folder_last_backup', new Date().toISOString());
    saveLocalDailyBackup();
    const total = BACKUP_COLLECTIONS.reduce((n,k)=>n+(payload.collections[k]?.length||0),0);
    await logAudit('Backup', `PC folder backup — ${fileName} (${total} records)`);
    if(forceToast) toast('Folder mein backup save: ' + fileName, 'success');
    return true;
  }catch(e){
    console.warn('PC folder backup failed', e);
    if(forceToast) toast('Folder backup failed: '+(e.message||e.name),'error');
    return false;
  }
};

/* Local daily snapshot (always) + optional Drive upload */
function saveLocalDailyBackup(){
  try{
    const payload = buildBackupPayload();
    const key = 'kissan_local_backup';
    const meta = { savedAt: new Date().toISOString(), date: todayISO() };
    // Store latest only (overwrite purani local backup)
    localStorage.setItem(key, JSON.stringify({ meta, ...payload }));
    localStorage.setItem('kissan_local_backup_at', meta.savedAt);
    return true;
  }catch(e){
    console.warn('Local backup failed', e);
    // quota — try smaller
    try{
      localStorage.setItem('kissan_local_backup_at', new Date().toISOString());
    }catch(_){}
    return false;
  }
}

async function maybeAutoGdriveBackup(){
  // Always try local daily snapshot once per day
  const lastLocal = localStorage.getItem('kissan_local_backup_at');
  const localHours = lastLocal ? (Date.now() - new Date(lastLocal).getTime())/3600000 : 999;
  if(localHours >= 20){
    setTimeout(()=>{ saveLocalDailyBackup(); }, 5000);
  }

  // PC folder daily backup (Chrome/Edge desktop)
  if(localStorage.getItem('pc_folder_auto')!=='0' && pcFolderIsReady()){
    const lastPc = localStorage.getItem('pc_folder_last_backup');
    const pcHours = lastPc ? (Date.now() - new Date(lastPc).getTime())/3600000 : 999;
    if(pcHours >= 20){
      setTimeout(()=>{ writePcFolderBackup(false).catch(()=>{}); }, 7000);
    }
  }

  // Drive auto only if enabled + connected
  if(localStorage.getItem('gdrive_auto')!=='1') return;
  if(!gdriveIsConnected() && !localStorage.getItem('gdrive_token')) return;
  const last = localStorage.getItem('gdrive_last_backup');
  const hours = last ? (Date.now() - new Date(last).getTime())/3600000 : 999;
  if(hours < 20) return;
  setTimeout(()=>{
    try{
      const hasData = (STATE.products?.length||0) + (STATE.sales?.length||0) + (STATE.parties?.length||0);
      if(hasData === 0 && !gdriveIsConnected()) return;
      gdriveUploadBackup().catch(()=>{});
    }catch(e){}
  }, 10000);
}

window.restoreFromLocalBackup = async function(){
  const raw = localStorage.getItem('kissan_local_backup');
  if(!raw){ toast('Koi local backup nahi mila','error'); return; }
  try{
    const parsed = JSON.parse(raw);
    await fullRestoreFromPayload(parsed, 'local auto-backup');
  }catch(e){ toast('Local restore failed: '+e.message,'error'); }
};

/* ===================== BACKUP & RESTORE ===================== */
window.downloadBackup = async function(){
  try{
    toast('Preparing backup…','info');
    const payload = buildBackupPayload();
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kissan-fertilizer-backup_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    const totalRecords = BACKUP_COLLECTIONS.reduce((n,k)=>n+(payload.collections[k]?.length||0),0);
    saveLocalDailyBackup();
    await logAudit('Backup', `Downloaded backup — ${totalRecords} records across ${BACKUP_COLLECTIONS.length} collections`);
    toast('Backup downloaded','success');
  }catch(e){ toast('Backup failed: '+e.message, 'error'); }
};

/* Full restore: purana data delete → backup data write (overwrite) */
async function clearCollection(colName){
  const snap = await getDocs(collection(db, colName));
  let deleted = 0;
  const docs = snap.docs;
  for(let i=0;i<docs.length;i+=450){
    const batch = writeBatch(db);
    docs.slice(i, i+450).forEach(d=>{ batch.delete(d.ref); deleted++; });
    await batch.commit();
  }
  return deleted;
}

async function fullRestoreFromPayload(parsed, sourceLabel){
  const incoming = parsed.collections || parsed;
  const foundKeys = BACKUP_COLLECTIONS.filter(k=>Array.isArray(incoming[k]));
  if(!foundKeys.length) throw new Error('Backup mein koi data nahi mila');
  const totalRecords = foundKeys.reduce((n,k)=>n+incoming[k].length,0);
  const summary = foundKeys.map(k=>`${k}: ${incoming[k].length}`).join(', ');
  const ok = confirm(
    `FULL RESTORE from ${sourceLabel}?\n\n${summary}\n\n`+
    `⚠ In collections ka purana data DELETE hoga, phir backup wala data likha jayega.\n`+
    `Restore ke baad ledger bilkul is backup jaisa ho jayega (naya/backup data wapas).\n\nContinue?`
  );
  if(!ok) return;
  toast('Restoring… purana data hata rahe hain — tab khula rakhein','info');
  let deleted = 0, written = 0;
  for(const key of foundKeys){
    deleted += await clearCollection(key);
    const records = incoming[key];
    for(let i=0;i<records.length;i+=450){
      const batch = writeBatch(db);
      const chunk = records.slice(i, i+450);
      chunk.forEach(rec=>{
        const {id, ...data} = rec;
        const ref = id ? doc(db, key, String(id)) : doc(collection(db, key));
        batch.set(ref, data);
      });
      await batch.commit();
      written += chunk.length;
    }
  }
  await logAudit('Restore', `FULL restore from ${sourceLabel} — deleted ${deleted}, wrote ${written}`);
  toast(`Restore complete ✓ ${written} records wapas aa gaye`,'success');
}

window.handleRestoreFile = async function(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  try{
    const fileText = await file.text();
    const parsed = JSON.parse(fileText);
    await fullRestoreFromPayload(parsed, `"${file.name}"`);
  }catch(e){ toast('Restore failed: '+e.message, 'error'); }
};

<script>
/* ===================== PWA: install + offline ===================== */
(function(){
  // Register service worker so the app shell loads with zero network.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // Har 60 sec naya SW check (GitHub deploy ke baad auto catch)
        setInterval(() => { try { reg.update(); } catch (e) {} }, 60 * 1000);
        // Page visible ho to bhi check
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            try { reg.update(); } catch (e) {}
          }
        });
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // Naya version ready — banner / auto reload path
              if (window.KissanPhase4 && window.KissanPhase4.setupUpdateWatcher) {
                try { window.KissanPhase4.setupUpdateWatcher(); } catch (e) {}
              }
              if (!document.getElementById('kissanUpdateBanner')) {
                const bar = document.createElement('div');
                bar.id = 'kissanUpdateBanner';
                bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10000;background:#0f3d24;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:13.5px;font-weight:600';
                bar.innerHTML = '<span>🆕 New version ready</span><button type="button" style="background:#d4a017;color:#1a2218;border:none;padding:8px 16px;border-radius:8px;font-weight:800;cursor:pointer" id="kissanUpdateBtn">Update now</button>';
                document.body.appendChild(bar);
                document.getElementById('kissanUpdateBtn').onclick = function () {
                  if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                  else location.reload();
                };
              }
            }
          });
        });
      }).catch((err) => console.warn('SW registration failed:', err));
    });
    // SW activate hone par auto reload (ek dafa)
    var __swReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (__swReloading) return;
      __swReloading = true;
      location.reload();
    });
    navigator.serviceWorker.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'SW_UPDATED') {
        if (!__swReloading) {
          __swReloading = true;
          location.reload();
        }
      }
    });
  }

  // Install prompt (Android/desktop Chrome/Edge).
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.add('show');
  });
  window.installApp = async function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (installBtn) installBtn.classList.remove('show');
  };
  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.classList.remove('show');
    deferredPrompt = null;
  });

  // Online / offline UI — ledger keeps working offline (Firestore's local
  // cache handles reads/writes); this just tells the shopkeeper the state.
  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');
  const offlineBanner = document.getElementById('offlineBanner');

  function updateOnlineStatus() {
    const online = navigator.onLine;
    if (syncDot) syncDot.classList.toggle('offline', !online);
    if (syncLabel) syncLabel.textContent = online ? 'Synced' : 'Offline — saved locally';
    if (offlineBanner) offlineBanner.classList.toggle('show', !online);
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();
})();
</script>
