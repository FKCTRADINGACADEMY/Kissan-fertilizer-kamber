<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kissan Fertilizer — Kamber</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f4d2c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kissan Fertilizer" />
<link rel="icon" href="icon-192-1.png" />
<link rel="apple-touch-icon" href="icon-192-1.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="./thermal-printer.js"></script>
<script src="./security-language.js"></script>
<script src="./phases-bundle.js"></script>

<style>
/* ============================================================
   KISSAN FERTILIZER — DESIGN SYSTEM
   Theme: a shopkeeper's field ledger — cream paper, deep crop
   green, wheat-gold stamps. Signature element: the wax-stamp
   status badge and the stitched "ledger" card border.
   ============================================================ */
:root{
  --field:#0f3d24;
  --field-mid:#1a5c38;
  --field-dark:#0a2a18;
  --field-soft:#e8f2ec;
  --wheat:#d4a017;
  --wheat-soft:#fbf0d4;
  --soil:#6b4423;
  --paper:#f5f1e6;
  --card:#fffcf6;
  --ink:#1a2218;
  --ink-soft:#5a6656;
  --ink-faint:#8f9a8a;
  --line:#e4dcc8;
  --danger:#b33a2b;
  --danger-soft:#f8e4e0;
  --ok:#1f7a45;
  --ok-soft:#e0f0e6;
  --info:#2a5f8f;
  --info-soft:#e4eef6;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,61,36,.04), 0 4px 16px rgba(15,61,36,.06);
  --shadow-lg:0 12px 40px rgba(10,42,24,.16);
  --sidebar-w:260px;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, rgba(212,160,23,.07), transparent 50%),
    radial-gradient(ellipse 60% 40% at 100% 0%, rgba(15,61,36,.05), transparent 45%);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d4cbb0;border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

.stitch{
  position:relative;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition: box-shadow .2s, transform .15s;
}
.stitch:hover{box-shadow:0 4px 20px rgba(15,61,36,.09);}
.stitch::before{
  content:"";
  position:absolute; left:16px; right:16px; top:0;
  height:3px;
  border-radius:0 0 3px 3px;
  background:linear-gradient(90deg, var(--field-mid), var(--wheat), var(--field-mid));
  opacity:.85;
}

#loginScreen{
  position:fixed; inset:0; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(201,138,31,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,.08), transparent 45%),
    linear-gradient(160deg, var(--field) 0%, var(--field-dark) 100%);
  padding:20px;
}
.login-card{
  width:100%; max-width:380px;
  background:var(--paper);
  border-radius:20px;
  padding:38px 34px 30px;
  box-shadow:var(--shadow-lg);
  text-align:center;
  position:relative;
}
.login-mark{
  width:58px;height:58px;border-radius:50%;
  background:var(--field); color:var(--wheat-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:26px; margin:0 auto 16px;
  box-shadow:0 0 0 5px var(--field-soft);
}
.login-card h1{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--field-dark);}
.login-card p.sub{color:var(--ink-soft);font-size:13px;margin-top:4px;margin-bottom:26px;}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em;}
.field input,.field select,.field textarea{
  width:100%; padding:11px 13px; border:1.5px solid var(--line);
  border-radius:var(--radius-sm); font-size:14px; background:#fff; color:var(--ink);
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--field);}
.field textarea{resize:vertical;min-height:70px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:var(--radius-sm); border:none;
  font-weight:700; font-size:13.5px; letter-spacing:.01em; transition:.15s;
}
.btn-primary{background:linear-gradient(180deg, var(--field-mid) 0%, var(--field) 100%);color:#fff;box-shadow:0 1px 3px rgba(15,61,36,.25);}
.btn-primary:hover{background:linear-gradient(180deg, #1f6b40 0%, var(--field-dark) 100%);transform:translateY(-1px);}
.btn-block{width:100%;}
.btn-gold{background:linear-gradient(180deg, #e0b020 0%, var(--wheat) 100%);color:#3a2503;box-shadow:0 1px 3px rgba(180,120,10,.25);}
.btn-gold:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--field);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px;}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

#app{display:none;}
#app.show{display:flex;min-height:100vh;position:relative;z-index:1;}
.sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  background:linear-gradient(180deg, var(--field-dark) 0%, #0d3320 100%);
  color:#e8efe4;
  position:fixed; top:0; bottom:0; left:0;
  display:flex; flex-direction:column;
  z-index:100;
  transition:transform .25s;
}
.sidebar-head{
  padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:11px;
}
.sidebar-head .mark{
  width:38px;height:38px;border-radius:10px;background:var(--wheat);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
}
.sidebar-head h1{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.15;}
.sidebar-head span{font-size:10.5px;color:#b9c9b3;letter-spacing:.03em;}
.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f9179;padding:14px 10px 6px;font-weight:700;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px;
  font-size:13.5px; color:#cfdccb; font-weight:500; margin-bottom:2px;
}
.nav a .ic{width:17px;text-align:center;font-size:14px;opacity:.85;}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav a.active{background:linear-gradient(135deg, var(--wheat) 0%, #e8b82a 100%);color:#2a1c02;font-weight:700;box-shadow:0 2px 8px rgba(212,160,23,.35);}
.nav a.active .ic{opacity:1;}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px;}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--field-soft);color:var(--field-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.who .nm{font-size:12.5px;font-weight:700;color:#fff;}
.who .rl{font-size:10.5px;color:#9fb298;}
.logout-btn{width:100%;background:rgba(255,255,255,.07);color:#e8efe4;border:1px solid rgba(255,255,255,.1);padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,.14);}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;position:relative;z-index:1;}
.topbar{
  position:sticky; top:0; z-index:60;
  height:64px; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; background:rgba(245,241,230,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.burger{display:none;width:36px;height:36px;border:none;background:transparent;font-size:18px;color:var(--field-dark);}
.crumb{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--field-dark);}
.crumb small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-faint);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-place{font-size:11.5px;color:var(--ink-soft);background:var(--field-soft);padding:6px 12px;border-radius:20px;font-weight:600;}
.sync-dot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:700;}
.sync-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft);}
.sync-dot.offline{color:#b5462f;}
.sync-dot.offline i{background:#b5462f;box-shadow:0 0 0 3px #f6d9d0;}
.install-btn{display:none;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--field);background:var(--wheat-soft);border:1px solid var(--wheat);padding:6px 10px;border-radius:8px;cursor:pointer;}
.install-btn.show{display:inline-flex;}
.offline-banner{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#b5462f;color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:8px 12px;}
.offline-banner.show{display:block;}

.content{padding:22px 28px 56px;max-width:1280px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-head h2{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--field-dark);}
.page-head p{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat{padding:20px 18px 18px;position:relative;overflow:hidden;background:var(--card);}
.stat .lbl{font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.stat .val{font-family:var(--serif);font-size:26px;font-weight:700;margin-top:10px;color:var(--field-dark);letter-spacing:-.02em;}
.stat .sub{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}
.stat .ic{
  position:absolute;right:14px;top:14px;
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;background:var(--field-soft);opacity:1;
}
.stat.gold .val{color:#9a6b0a;}
.stat.gold .ic{background:var(--wheat-soft);}
.stat.red .val{color:var(--danger);}
.stat.red .ic{background:var(--danger-soft);}
.stat.ok .val{color:var(--ok);}
.stat.ok .ic{background:var(--ok-soft);}
.stat.info .val{color:var(--info);}
.stat.info .ic{background:var(--info-soft);}

.stat-link{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.stat-link:active{transform:scale(.98);}
.chip-link{cursor:pointer;}
.chip-link:active{opacity:.85;}


.dash-hero{
  background:linear-gradient(135deg, var(--field-dark) 0%, var(--field-mid) 55%, #2a6b42 100%);
  border-radius:var(--radius);
  padding:28px 28px 24px;
  color:#f4f7f2;
  margin-bottom:22px;
  position:relative; overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.dash-hero::after{
  content:"";
  position:absolute; right:-40px; top:-40px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle, rgba(212,160,23,.25), transparent 70%);
  pointer-events:none;
}
.dash-hero h2{font-family:var(--serif);font-size:26px;font-weight:700;margin:0 0 4px;position:relative;z-index:1;}
.dash-hero p{font-size:13.5px;opacity:.82;margin:0;position:relative;z-index:1;}
.dash-hero .hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;position:relative;z-index:1;}
.dash-hero .chip{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
  padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;
}
.quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
.quick-actions .btn{flex:1;min-width:140px;justify-content:center;}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.activity-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.activity-dot.sale{background:var(--ok);}
.activity-dot.purchase{background:var(--wheat);}
.activity-dot.voucher{background:var(--info);}

.panel{padding:20px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--field-dark);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;}
.search-box input{padding:9px 12px 9px 32px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;width:210px;background:#fff;}
.search-box::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:15px;}

.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{
  text-align:left; padding:9px 12px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-soft); border-bottom:2px solid var(--line); font-weight:700; white-space:nowrap;
}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tbl tr:hover td{background:var(--field-soft);}
table.tbl tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:6px;}
.empty-row td{text-align:center;color:var(--ink-faint);padding:34px 10px;font-style:italic;}

.stamp{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 8px;
  border-radius:20px; font-size:11px; font-weight:800; letter-spacing:.03em;
  border:1.5px dashed currentColor; transform:rotate(-1.5deg);
}
.stamp.ok{color:var(--ok);background:var(--ok-soft);}
.stamp.warn{color:#8a5c0e;background:var(--wheat-soft);}
.stamp.bad{color:var(--danger);background:var(--danger-soft);}
.stamp.mute{color:var(--ink-faint);background:#f0ece0;}

.modal-backdrop{position:fixed;inset:0;background:rgba(18,32,20,.5);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.show{display:flex;}
.modal{
  width:100%;max-width:520px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);
  max-height:88vh;display:flex;flex-direction:column;
}
.modal.wide{max-width:760px;}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--field-dark);}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--field-soft);color:var(--field-dark);font-size:15px;}
.modal-body{padding:22px 24px;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast-item{
  padding:12px 18px;border-radius:11px;color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease; max-width:320px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast-item.success{background:var(--ok);}
.toast-item.error{background:var(--danger);}
.toast-item.info{background:var(--field);}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
.ledger-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.ledger-line:last-child{border-bottom:none;}
.mono{font-family:var(--mono);}
.right{text-align:right;}
.center{text-align:center;}
.muted{color:var(--ink-soft);}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .burger{display:block;}
}
@media print{
  .no-print{display:none!important;}
  body{background:#fff;}
  body::after{
    content:"Software by Fazul Khan Chandio  03333909816";
    display:block;
    text-align:center;
    font-size:10px;
    color:#666;
    margin-top:18px;
    padding-top:8px;
    border-top:1px dashed #ccc;
  }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">🌾</div>
    <h1>Kissan Fertilizer</h1>
    <p class="sub">Miro Khan Road, Kamber — ledger &amp; store manager</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@kissan.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()"><span id="loginBtnLabel">Sign in</span></button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<div id="app">
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-head">
      <div class="mark">🌾</div>
      <div><h1>Kissan Fertilizer</h1><span>Kamber Branch</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <div class="av" id="whoAv">K</div>
        <div><div class="nm" id="whoName">—</div><div class="rl">Signed in</div></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar no-print">
      <div class="topbar-left">
        <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="crumb"><span id="crumbTitle">Dashboard</span><small id="crumbSub">Today's overview</small></div>
      </div>
      <div class="topbar-right">
        <span id="langSwitchSlot"></span>
        <span class="badge-place">📍 Miro Khan Road, Kamber</span>
        <button class="install-btn" id="installBtn" onclick="window.installApp()"><i class="fas fa-download"></i> Install app</button>
        <span class="sync-dot" id="syncDot"><i></i><span id="syncLabel">Synced</span></span>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<div class="offline-banner" id="offlineBanner">You're offline — changes will sync automatically once you're back online.</div>

<div id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle">Title</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>

   Kept in localStorage (per-device) so the shopkeeper can customize the

const SERIES_DEFAULTS = { sales:'INV', purchases:'PUR', quotations:'QUO', salesOrders:'SO', purchaseOrders:'PO', salesReturns:'SR', purchaseReturns:'PR' };
function getSeries(){
  try{ return { ...SERIES_DEFAULTS, ...JSON.parse(localStorage.getItem('invoiceSeries')||'{}') }; }
  catch(e){ return SERIES_DEFAULTS; }
}

function nextDocNo(stateKey){
  const series = getSeries();
  const prefix = series[stateKey] || SERIES_DEFAULTS[stateKey] || 'DOC';
  const yr = new Date().getFullYear();
  const esc = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^' + esc + '-' + yr + '-(\\d+)$', 'i');
  let max = 0;
  (STATE[stateKey] || []).forEach(r=>{
    const m = String(r.docNo || '').match(re);
    if(m) max = Math.max(max, parseInt(m[1], 10) || 0);
  });
  // Reserve counter — double-click / race mein same number na aaye
  window._docNoReserve = window._docNoReserve || {};
  const reserved = Number(window._docNoReserve[stateKey] || 0);
  max = Math.max(max, reserved);
  const next = max + 1;
  window._docNoReserve[stateKey] = next;
  return prefix + '-' + yr + '-' + String(next).padStart(4, '0');
}

function dedupeById(arr){
  const seen = new Set();
  const out = [];
  (arr||[]).forEach(item=>{
    if(!item || !item.id){ out.push(item); return; }
    if(seen.has(item.id)) return;
    seen.add(item.id);
    out.push(item);
  });
  return out;
}

/* ===================== GODAM / LOCATION STOCK =====================
   Single source of truth:
   - godamStock[godamId] = qty in that godam
   - product.stock = ALWAYS sum(godamStock values) when map exists
   - All +/- stock must go through adjustProductStock() so totals never drift.
   ================================================================ */
function getDefaultGodamId(){
  const list = STATE.godams || [];
  if(!list.length) return '';
  const main = list.find(g=>g.isDefault) || list[0];
  return main?.id || '';
}
function productGodamMap(p){
  const m = (p && p.godamStock && typeof p.godamStock==='object') ? { ...p.godamStock } : {};
  return m;
}
function totalFromGodamMap(m){
  return Object.values(m||{}).reduce((a,b)=>a+Number(b||0),0);
}
/** True total stock — prefer godam map sum when breakdown exists (never stale p.stock alone). */
function productEffectiveStock(p){
  if(!p) return 0;
  const map = productGodamMap(p);
  if(Object.keys(map).length) return totalFromGodamMap(map);
  return Number(p.stock||0);
}
function productStockInGodam(p, godamId){
  if(!p) return 0;
  const m = productGodamMap(p);
  if(godamId && m[godamId]!=null) return Number(m[godamId]||0);
  // Legacy: no breakdown — treat total stock as unassigned / default godam
  if(!Object.keys(m).length){
    if(!godamId || godamId===getDefaultGodamId()) return Number(p.stock||0);
    return 0;
  }
  return Number(m[godamId]||0);
}
function godamOptionsHtml(selectedId, includeEmpty){
  const list = STATE.godams || [];
  let h = includeEmpty ? `<option value="">— Select godam —</option>` : '';
  if(!list.length){
    h += `<option value="">No godam yet (total stock)</option>`;
    return h;
  }
  const sel = selectedId || getDefaultGodamId();
  h += list.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${g.name}${g.location?` — ${g.location}`:''}</option>`).join('');
  return h;
}
/**
 * Unified stock +/- . Always keeps godamStock map + product.stock in sync.
 * @param {string} productId
 * @param {number} delta  + for purchase/return-in, − for sale/return-out
 * @param {string} [godamId]  preferred godam; falls back to default
 */
async function adjustProductStock(productId, delta, godamId){
  const product = STATE.products.find(p=>p.id===productId);
  if(!product) throw new Error('Product not found');
  const map = productGodamMap(product);
  const gid = godamId || getDefaultGodamId();
  const d = Number(delta||0);

  // Migrate legacy total into default/selected godam once
  if(!Object.keys(map).length && Number(product.stock||0)!==0){
    const migrateTo = gid || getDefaultGodamId();
    if(migrateTo) map[migrateTo] = Number(product.stock||0);
  }

  if(gid){
    const cur = Number(map[gid]||0);
    if(d < 0 && cur + d < 0){
      // Is godam mein itna stock nahi — pehle yahan 0, baqi doosre godam se kaato
      let need = -(cur + d);
      map[gid] = 0;
      for(const k of Object.keys(map)){
        if(need <= 0) break;
        if(k === gid) continue;
        const take = Math.min(Number(map[k]||0), need);
        map[k] = Number(map[k]||0) - take;
        need -= take;
      }
    }else{
      map[gid] = Math.max(0, cur + d);
    }
    const stock = totalFromGodamMap(map);
    await updateDoc(doc(db,'products',productId), { godamStock: map, stock });
    const i = STATE.products.findIndex(p=>p.id===productId);
    if(i>=0) STATE.products[i] = { ...STATE.products[i], godamStock: map, stock };
    return { map, stock };
  }

  // No godams configured — only total field
  const stock = Math.max(0, Number(product.stock||0) + d);
  await updateDoc(doc(db,'products',productId), { stock });
  const i = STATE.products.findIndex(p=>p.id===productId);
  if(i>=0) STATE.products[i] = { ...STATE.products[i], stock };
  return { map:{}, stock };
}
window.adjustProductStock = adjustProductStock;

/** Back-compat alias used across the app */
async function adjustProductGodamStock(productId, godamId, delta){

/** Repair products where stock field ≠ sum(godamStock). Safe to call anytime. */
async function repairAllProductStockSync(){
  let fixed = 0;
  for(const p of (STATE.products||[])){
    const map = productGodamMap(p);
    if(!Object.keys(map).length) continue;
    const sum = totalFromGodamMap(map);
    if(Number(p.stock||0) !== sum){
      try{
        await updateDoc(doc(db,'products',p.id), { stock: sum });
        const i = STATE.products.findIndex(x=>x.id===p.id);
        if(i>=0) STATE.products[i] = { ...STATE.products[i], stock: sum };
        fixed++;
      }catch(e){ console.warn('stock repair failed', p.id, e); }
    }
  }
  if(fixed) console.log('[stock] repaired', fixed, 'product(s) — total now matches godam breakdown');
  return fixed;
}

function formatGodamBreakdown(p){
  const list = STATE.godams || [];
  const map = productGodamMap(p);
  const total = productEffectiveStock(p);
  if(!list.length) return `<span class="mono" style="font-weight:700">${total}</span>`;
  if(!Object.keys(map).length){
    return `<span class="mono" style="font-weight:700">${total}</span> <span class="hint">total</span>`;
  }
  const parts = list.map(g=>{
    const q = Number(map[g.id]||0);
    if(!q) return null;
    return `<span title="${(g.location||g.name).replace(/"/g,'')}">${g.name}: <b>${q}</b></span>`;
  }).filter(Boolean);
  const unknown = Object.keys(map).filter(id=>!list.some(g=>g.id===id)).reduce((a,id)=>a+Number(map[id]||0),0);
  if(unknown) parts.push(`<span>Other: <b>${unknown}</b></span>`);
  return `<div style="font-size:12px;line-height:1.45">${parts.join(' · ')||'<span class="muted">0</span>'}
    <div class="hint" style="margin:0">Total: <b>${total}</b></div></div>`;
}


/** Mall lene wala — sale pe, warna linked / matching sales-order se */
function saleTakenBy(s){
  if(!s) return '';
  if(s.takenBy) return String(s.takenBy).trim();
  const orders = STATE.salesOrders || [];
  if(s.sourceOrderId){
    const o = orders.find(x=>x.id===s.sourceOrderId);
    if(o && o.takenBy) return String(o.takenBy).trim();
  }
  // Linked by saleId on order
  const bySaleId = orders.find(o=>o.saleId && o.saleId===s.id && o.takenBy);
  if(bySaleId) return String(bySaleId.takenBy).trim();
  // Same party + product + date + total
  let match = orders.find(o=>
    o.takenBy &&
    (o.partyId||'')===(s.partyId||'') &&
    (o.productName||'')===(s.productName||'') &&
    Number(o.total||0)===Number(s.total||0) &&
    (o.date||'')===(s.date||'')
  );
  if(match) return String(match.takenBy).trim();
  // Looser: same party + product + date (qty match preferred)
  const candidates = orders.filter(o=>
    o.takenBy &&
    (o.partyId||'')===(s.partyId||'') &&
    (o.productName||'')===(s.productName||'') &&
    (o.date||'')===(s.date||'')
  );
  if(candidates.length===1) return String(candidates[0].takenBy).trim();
  match = candidates.find(o=>Number(o.qty||0)===Number(s.qty||0));
  return match ? String(match.takenBy).trim() : '';
}
function saleDetailLine(s){
  const who = saleTakenBy(s);
  let base = `Sale — ${s.productName||''}${s.docNo?' ('+s.docNo+')':''}`;
  if(who) base += ` · le gaya: ${who}`;
  const rt = Number(s.resellTotal||0);
  if(rt > 0) base += ` · resell ${Number(rt).toLocaleString('en-PK')}`;
  const ap = Number(s.agentPay||0);
  if(ap > 0) base += ` · agent pay ${Number(ap).toLocaleString('en-PK')}`;
  if(s.holdStock) base += ` · maal shop pe`;
  return base;
}
function findLinkedSaleForOrder(order){
  if(!order) return null;
  if(order.saleId){
    const s = STATE.sales.find(x=>x.id===order.saleId);
    if(s) return s;
  }
  return (STATE.sales||[]).find(s=>s.sourceOrderId===order.id) || null;
}
function findLinkedOrderForSale(sale){
  if(!sale) return null;
  if(sale.sourceOrderId){
    const o = STATE.salesOrders.find(x=>x.id===sale.sourceOrderId);
    if(o) return o;
  }
  return (STATE.salesOrders||[]).find(o=>o.saleId===sale.id) || null;
}
/** Keep Sales Order ↔ Sale fields in sync (party, product, qty, rate, total, date, takenBy) */
async function syncSaleOrderLink(from, id, fields){
  try{
    if(from==='order'){
      const order = STATE.salesOrders.find(x=>x.id===id);
      if(!order || (order.status!=='Billed' && !order.saleId)) return;
      const sale = findLinkedSaleForOrder(order);
      if(!sale) return;
      const patch = {};
      ['takenBy','partyId','partyName','productId','productName','qty','rate','total','date','isGeneric','resellTotal','agentPay','holdStock'].forEach(k=>{
        if(fields[k]!==undefined) patch[k] = fields[k];
      });
      if(!Object.keys(patch).length) return;
      await updateDoc(doc(db,'sales', sale.id), patch);
      const si = STATE.sales.findIndex(s=>s.id===sale.id);
      if(si>=0) STATE.sales[si] = { ...STATE.sales[si], ...patch };
    }else if(from==='sale'){
      const sale = STATE.sales.find(x=>x.id===id);
      if(!sale) return;
      const order = findLinkedOrderForSale(sale);
      if(!order) return;
      const patch = {};
      ['takenBy','partyId','partyName','productId','productName','qty','rate','total','date','isGeneric','resellTotal','agentPay','holdStock'].forEach(k=>{
        if(fields[k]!==undefined) patch[k] = fields[k];
      });
      if(!Object.keys(patch).length) return;
      await updateDoc(doc(db,'salesOrders', order.id), patch);
      const oi = STATE.salesOrders.findIndex(o=>o.id===order.id);
      if(oi>=0) STATE.salesOrders[oi] = { ...STATE.salesOrders[oi], ...patch };
    }
  }catch(e){ console.warn('syncSaleOrderLink', e); }
}

function listen(colName, stateKey, order='atLocal'){
  try{
    onSnapshot(query(collection(db,colName)), (snap)=>{
      STATE[stateKey] = dedupeById(snap.docs.map(d=>({id:d.id, ...d.data()})));
      // Name lists A→Z; baaki newest first
      if(order === 'name'){
        STATE[stateKey].sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), undefined, {sensitivity:'base'}));
      }else{
        STATE[stateKey].sort((a,b)=> (b[order]||'').localeCompare(a[order]||''));
      }
      // Debounced soft refresh — modal open ho to mat chhedo, page mat badlo
      const shouldRefresh =
        (ACTIVE_PAGE === stateKey) ||
        ((LISTEN_REFRESH_MAP[stateKey] || []).includes(ACTIVE_PAGE));
      if(shouldRefresh && !isModalOpen()){
        clearTimeout(window._pageRefreshT);
        window._pageRefreshT = setTimeout(()=>{
          if(!isModalOpen()) softRefreshActivePage();
        }, 120);
      }
    }, (err)=>{ console.warn('listen error', colName, err.message); });
  }catch(e){ console.warn(e); }
}

/* ===================== GENERIC CRUD ENGINE =====================
   One compact engine drives Products / Suppliers / Parties /
   Expenses / Users so each module is just a field schema, not
   hundreds of bespoke lines. */
function fieldInput(f, val=''){
  val = val ?? '';
  if(f.type==='select'){
    const opts = f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
    return `<select id="f_${f.key}"><option value="">Select…</option>${opts}</select>`;
  }
  if(f.type==='textarea') return `<textarea id="f_${f.key}">${val}</textarea>`;
  return `<input type="${f.type||'text'}" id="f_${f.key}" value="${val}" ${f.step?`step="${f.step}"`:''} placeholder="${f.ph||''}">`;
}

function crudModalOpen(cfg, existing){
  const fieldsHtml = cfg.fields.map(f=>`
    <div class="field"><label>${f.label}${f.required?' *':''}</label>${fieldInput(f, existing?existing[f.key]:'')}</div>
  `).join('');
  openModal(existing? `Edit ${cfg.singular}`:`Add ${cfg.singular}`,
    `<div class="grid2">${fieldsHtml}</div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" id="crudSaveBtn" onclick="crudSave('${cfg.key}', ${existing? `'${existing.id}'`:'null'})">Save</button>`);
}

window.crudSave = async function(key, id){
  const lockKey = 'crud_' + key;
  if(window._saveLocks[lockKey]){ toast('Pehle se save ho raha hai — wait…','info'); return; }
  window._saveLocks[lockKey] = true;
  const btn = $('crudSaveBtn');
  const prevLabel = btn ? btn.textContent : 'Save';
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    const cfg = CRUD_MODULES[key];
    if(!cfg){ toast('Unknown form','error'); return; }
    const data = {};
    for(const f of cfg.fields){
      const el = $('f_'+f.key);
      if(!el) continue;
      let v = el.value;
      if(f.type==='number') v = Number(v)||0;
      if(f.required && (v===''||v===null||v===undefined)){ toast(`${f.label} is required`, 'error'); return; }
      data[f.key] = v;
    }
    // Products: stock field must stay in sync with godamStock breakdown
    if(key === 'products'){
      const desired = Number(data.stock||0);
      const existing = id ? (STATE.products.find(p=>p.id===id) || {}) : {};
      const map = productGodamMap(existing);
      const gid = getDefaultGodamId();
      if(Object.keys(map).length){
        const oldSum = totalFromGodamMap(map);
        const delta = desired - oldSum;
        if(delta !== 0 && gid){
          map[gid] = Math.max(0, Number(map[gid]||0) + delta);
        }
        data.godamStock = map;
        data.stock = totalFromGodamMap(map);
      } else if(desired > 0 && gid){
        data.godamStock = { [gid]: desired };
        data.stock = desired;
      } else {
        data.stock = desired;
      }
    }
    const stateArr = STATE[cfg.key] || STATE[cfg.collection] || [];
    if(id){
      await updateDoc(doc(db, cfg.collection, id), data);
      const i = stateArr.findIndex(p=>p.id===id);
      if(i>=0) stateArr[i] = { ...stateArr[i], ...data };
      else stateArr.push({ id, ...data });
      STATE[cfg.key] = stateArr;
      if(cfg.key !== cfg.collection) STATE[cfg.collection] = stateArr;
      await logAudit('Update', `${cfg.singular} updated: ${data[cfg.titleField]||id}`);
      toast(`${cfg.singular} updated`, 'success');
    }else{
      data.atLocal = new Date().toISOString();
      const ref = await addDoc(collection(db, cfg.collection), data);
      const row = { id: ref.id, ...data };
      STATE[cfg.key] = dedupeById([row, ...(STATE[cfg.key]||[])]);
      if(cfg.key !== cfg.collection) STATE[cfg.collection] = STATE[cfg.key];
      await logAudit('Create', `${cfg.singular} added: ${data[cfg.titleField]||''}`);
      toast(`${cfg.singular} added`, 'success');
    }
    closeModal();
    // Jis page pe ho wahi rehna — dashboard pe mat jao
    softRefreshActivePage();
  }catch(e){
    toast('Save failed: '+e.message, 'error');
    if(btn){ btn.disabled = false; btn.textContent = prevLabel; }
  }finally{
    window._saveLocks[lockKey] = false;
  }
};

window.crudDelete = async function(key, id, label){
  if(!confirm(`Delete "${label}"? This can't be undone.`)) return;
  const cfg = CRUD_MODULES[key];
  try{
    await deleteDoc(doc(db, cfg.collection, id));
    if(STATE[cfg.key]) STATE[cfg.key] = (STATE[cfg.key]||[]).filter(x=>x.id!==id);
    if(cfg.collection && STATE[cfg.collection] && cfg.collection !== cfg.key){
      STATE[cfg.collection] = (STATE[cfg.collection]||[]).filter(x=>x.id!==id);
    }
    await logAudit('Delete', `${cfg.singular} deleted: ${label}`);
    toast(`${cfg.singular} deleted`, 'success');
    softRefreshActivePage();
  }catch(e){ toast('Delete failed: '+e.message, 'error'); }
};

  if(!printer) throw new Error('thermal-printer.js load nahi hua');
  if(!printer.isConnected){
    toast('Printer connect ho raha hai…','info');
    await printer.connect();
    toast('Printer connected ✓','success');
  }
  const qty = r.qty || 0;
  const unit = (()=>{
    const p = STATE.products.find(x=>x.id===r.productId);
    return (p && p.unit) ? p.unit : 'bag';
  })();
  const product = r.productName || 'Item';
  const party = r.partyName || 'Walk-in';
  const total = Number(r.total||0);
  const rate = Number(r.rate||0);
  const pay = r.payMode || (kind==='order' ? 'Order' : 'Cash');
  const docNo = r.docNo || '—';
  const dateStr = r.date || todayISO();
  const timeStr = new Date().toLocaleTimeString('en-PK', {hour:'2-digit', minute:'2-digit'});
  const takenBy = (r.takenBy || (typeof saleTakenBy==='function' ? saleTakenBy(r) : '') || '').trim();
  const godam = (STATE.godams||[]).find(g=>g.id===r.godamId) || (STATE.godams||[]).find(g=>g.isDefault) || (STATE.godams||[])[0];
  const godamName = godam ? godam.name : 'Main Godam';
  const godamLoc = godam && godam.location ? godam.location : '';
  const agentPay = Number(r.agentPay||0);
  const resellTotal = Number(r.resellTotal||0);

  await printer.init();
  await printer.printText('KISSAN FERTILIZER', { align:'center', bold:true });
  await printer.printText('Miro Khan Road, Kamber', { align:'center' });
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText('GODAM PARCHI', { align:'center', bold:true });
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText(printer._row('Parchi No', docNo));
  await printer.printText(printer._row('Date', dateStr));
  await printer.printText(printer._row('Time', timeStr));
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText(String(qty) + ' ' + unit, { align:'center', bold:true, double:true });
  await printer.printText(product, { align:'center', bold:true });
  await printer.printText('Bill: ' + party, { align:'center' });
  await printer.printText('Mall le gaya: ' + (takenBy || '_______________'), { align:'center' });
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText(printer._row('Rate / ' + unit, rate.toLocaleString('en-PK')));
  await printer.printText(printer._row('Total', total.toLocaleString('en-PK') + ' Rs'));
  await printer.printText(printer._row('Payment', pay));
  if(resellTotal) await printer.printText(printer._row('Resell', resellTotal.toLocaleString('en-PK')));
  if(agentPay) await printer.printText(printer._row('Agent pay', agentPay.toLocaleString('en-PK')));
  if(r.holdStock) await printer.printText(printer._row('Stock', 'Shop pe rakha'));
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText('WAREHOUSE', { align:'center', bold:true });
  await printer.printText(godamName, { align:'center', bold:true });
  if(godamLoc) await printer.printText(godamLoc, { align:'center' });
  await printer.printText(printer._line(), { align:'center' });
  await printer.printText('Counter          Godam', { align:'center' });
  await printer.printSmall('Godam pe yeh parchi dikhayein', { align:'center' });
  await printer.printSmall('Software by Fazul Khan Chandio', { align:'center' });
  await printer.printSmall('03333909816', { align:'center' });
  await printer.doCut();
  toast('Parchi print ho gayi ✓','success');
}

/* ===================== DASHBOARD ===================== */
function pageDashboard(){
  const today = todayISO();
  const salesToday = STATE.sales.filter(s=>s.date===today);
  const purchToday = STATE.purchases.filter(p=>p.date===today);
  const dayCash = dayCashSummary(today);
  const cashInHand = dayCash.closing; // same formula as Daily Cash Memo closing
  const receivable = STATE.parties.reduce((sum,p)=>sum + partyBalance(p.id), 0);
  const payable = STATE.suppliers.reduce((sum,s)=>sum + supplierBalance(s.id), 0);
  const lowStock = STATE.products.filter(p=> productEffectiveStock(p) <= Number(p.lowStock||0));
  const salesTodayTotal = salesToday.reduce((a,b)=>a+Number(b.total||0),0);
  const purchTodayTotal = purchToday.reduce((a,b)=>a+Number(b.total||0),0);
  const expToday = dayCash.expTotal;
  const udhaarToday = dayCash.udhaarSalesTotal;
  const cashSalesToday = dayCash.cashSalesTotal;
  const wasoolToday = dayCash.wasoolTotal;
  // Profit per sale:
  // 1) Product margin = bill − purchase cost  (17000 − 16500 = 500) — hamesha
  // 2) Reseller/agent deal: product margin + resell profit (dono)
  //    resell profit = bill − agentPay  (e.g. 17000 − 15000 = 2000)
  //    total profit  = 500 + 2000 = 2500
  // 3) Normal sale (bina agent): profit = product margin
  function productCost(s){
    if(s.isGeneric || !s.productId) return 0;
    const p = STATE.products.find(x=>x.id===s.productId);
    return Number(p?.purchasePrice||0) * Number(s.qty||0);
  }
  function saleProfit(s){
    const total = Number(s.total||0);
    const agent = Number(s.agentPay||0);
    const cost  = productCost(s);
    if(agent > 0){
      // Product margin + reseller net — dono (real profit aapko dono milte hain)
      return (total - cost) + (total - agent);
    }
    return total - cost;                          // normal: 17000-16500=500
  }
  function lineCost(s){
    // reports / COGS: product cost + agent pay (jab agent deal ho)
    const agent = Number(s.agentPay||0);
    const cost  = productCost(s);
    if(agent > 0) return cost + agent;
    return cost;
  }
  const profitToday = salesToday.reduce((a,s)=>a + saleProfit(s), 0) - expToday;
  const marginToday = salesToday.reduce((a,s)=>a + (Number(s.total||0) - productCost(s)), 0);
  const resellerProfitToday = salesToday.reduce((a,s)=>{
    const agent = Number(s.agentPay||0);
    if(agent <= 0) return a;
    return a + (Number(s.total||0) - agent);
  }, 0);
  const agentDealsToday = salesToday.filter(s=>Number(s.agentPay||0)>0).length;
  const salesAllTotal = STATE.sales.reduce((a,b)=>a+Number(b.total||0),0);
  const cogsAll = STATE.sales.reduce((a,s)=>a+lineCost(s),0);
  const expAll = STATE.expenses.reduce((a,b)=>a+Number(b.amount||0),0);
  const profitAll = STATE.sales.reduce((a,s)=>a + saleProfit(s), 0) - expAll;
  // Stock summary for dashboard
  const totalStockUnits = STATE.products.reduce((a,p)=>a + productEffectiveStock(p), 0);
  const stockValue = STATE.products.reduce((a,p)=>a + productEffectiveStock(p) * Number(p.purchasePrice||0), 0);

  const recent = [...STATE.sales.map(s=>({...s,_k:'Sale'})), ...STATE.purchases.map(p=>({...p,_k:'Purchase'})), ...STATE.vouchers.map(v=>({...v,_k:'Voucher'}))]
    .sort((a,b)=>(b.atLocal||'').localeCompare(a.atLocal||'')).slice(0,8);

  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const dayName = new Date().toLocaleDateString('en-PK', { weekday:'long', day:'numeric', month:'short', year:'numeric' });

  return `
  ${closingReminderBanner()}

  ${(window.KissanPhase6 && window.KissanPhase6.triggersBannerHtml)?window.KissanPhase6.triggersBannerHtml():''}
  <div class="dash-hero">
    <h2>${greet} 🌾</h2>
    <p>Kissan Fertilizer · Miro Khan Road, Kamber</p>
    <div class="hero-meta">
      <span class="chip">📅 ${dayName}</span>
      <span class="chip chip-link" onclick="event.stopPropagation();goPage('sales')">🧾 ${salesToday.length} sale(s) today</span>
      <span class="chip chip-link" onclick="event.stopPropagation();goPage('products')">📦 ${STATE.products.length} products</span>
      <span class="chip chip-link" onclick="event.stopPropagation();goPage('parties')">☺ ${STATE.parties.length} customers</span>
    </div>
  </div>

  <div class="quick-actions no-print">
    <button class="btn btn-primary" onclick="goPage('sales'); setTimeout(()=>openSaleModal(),200)">+ New Sale</button>
    <button class="btn btn-gold" onclick="goPage('purchases'); setTimeout(()=>openPurchaseModal(),200)">+ Purchase</button>
    <button class="btn btn-outline" onclick="openCashResetModal()">💰 Opening Balance</button>
    <button class="btn btn-outline" onclick="goPage('parties')">All Party</button>
    <button class="btn btn-outline" onclick="goPage('dailycashmemo')">Cash Memo</button>
    <button class="btn btn-outline" onclick="goPage('reports')">Reports</button>
  </div>

  <div class="stats">
    <div class="stitch stat ok stat-link" role="button" tabindex="0" onclick="goPage('sales')"><div class="ic">🧾</div><div class="lbl">Sales Today</div><div class="val">${fmt(salesTodayTotal)}</div><div class="sub">${salesToday.length} inv · cash ${fmt(cashSalesToday)}${udhaarToday?` · udhaar ${fmt(udhaarToday)}`:''}${wasoolToday?` · wasool ${fmt(wasoolToday)}`:''}</div></div>
    <div class="stitch stat gold stat-link" role="button" tabindex="0" onclick="goPage('purchases')"><div class="ic">📦</div><div class="lbl">Purchases Today</div><div class="val">${fmt(purchTodayTotal)}</div><div class="sub">${purchToday.length} entr${purchToday.length===1?'y':'ies'}</div></div>
    <div class="stitch stat stat-link" role="button" tabindex="0" onclick="goPage('dailycashmemo')"><div class="ic">💰</div><div class="lbl">Cash in Hand</div><div class="val">${fmt(cashInHand)}</div><div class="sub">today closing · same as Cash Memo · tap → Memo</div></div>

    <div class="stitch stat ${profitAll>=0?'ok':'red'} stat-link" role="button" tabindex="0" onclick="goPage('reports')"><div class="ic">💹</div><div class="lbl">Est. Profit (all)</div><div class="val">${fmt(profitAll)}</div><div class="sub">all sales profit − expenses</div></div>
  </div>

  <div class="dash-grid">
    <div class="stitch panel">

    </div>
    <div class="stitch panel">
      <div class="panel-head"><h3>Low stock alerts</h3><span class="stamp ${lowStock.length?'bad':'ok'}">${lowStock.length}</span></div>

        <div class="ledger-line">
          <span style="font-weight:600">${p.name}</span>

window.saveGodam = async function(id){
  const name = ($('gName')?.value||'').trim();
  if(!name){ toast('Godam name likhein','error'); return; }
  const payload = {
    name,
    location: ($('gLoc')?.value||'').trim(),
    note: ($('gNote')?.value||'').trim(),
    isDefault: !!$('gDefault')?.checked,
    atLocal: new Date().toISOString()
  };
  try{
    if(payload.isDefault){
      // clear other defaults
      for(const g of (STATE.godams||[])){
        if(g.isDefault && g.id!==id) await updateDoc(doc(db,'godams',g.id), { isDefault:false });
      }
    }
    if(id){
      await updateDoc(doc(db,'godams',id), payload);
      const i = STATE.godams.findIndex(g=>g.id===id);
      if(i>=0) STATE.godams[i] = { ...STATE.godams[i], ...payload };
      toast('Godam updated','success');
    }else{
      const ref = await addDoc(collection(db,'godams'), payload);
      STATE.godams = [{ id:ref.id, ...payload }, ...(STATE.godams||[])];
      toast('Godam added','success');
    }
    await logAudit('Godam', `Godam ${id?'updated':'added'}: ${name}`);
    closeModal();
    if(ACTIVE_PAGE==='godams') softRefreshActivePage();
  }catch(e){ toast('Failed: '+e.message,'error'); }
};

};

window._gasShowCurrent = function(){
  const pid = $('gasProduct')?.value;
  const gid = $('gasGodam')?.value;
  const mode = $('gasMode')?.value || 'add';
  const hint = $('gasCurrentHint');
  if(!hint) return;
  if(!pid || !gid){ hint.textContent = 'Product + godam select karein — current stock dikhega.'; return; }
  const p = STATE.products.find(x=>x.id===pid);
  const g = STATE.godams.find(x=>x.id===gid);
  const q = productStockInGodam(p, gid);
  const total = productEffectiveStock(p);
  const modeTxt = mode==='set' ? 'Set absolute qty' : (mode==='sub' ? 'Remove qty' : 'Add qty');
  hint.innerHTML = `<b>${g?.name||'Godam'}</b> mein ab: <b>${q}</b> ${p?.unit||''} · total all godams: <b>${total}</b> · mode: ${modeTxt}`;
};
window.saveGodamAddStock = async function(){
  if(window._saveLocks['godamAddStock']){ toast('Pehle se save ho raha hai…','info'); return; }
  window._saveLocks['godamAddStock'] = true;
  const btn = $('gasSaveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    const productId = $('gasProduct')?.value;
    const godamId = $('gasGodam')?.value;
    const mode = $('gasMode')?.value || 'add';
    const qty = Number($('gasQty')?.value);
    if(!productId || !godamId){ toast('Product aur godam select karein','error'); return; }
    if(!(qty >= 0) || (mode !== 'set' && qty <= 0)){ toast('Sahi quantity likhein','error'); return; }
    const p = STATE.products.find(x=>x.id===productId);
    if(!p){ toast('Product nahi mila','error'); return; }
    const current = productStockInGodam(p, godamId);
    let delta = 0;
    if(mode === 'add') delta = qty;
    else if(mode === 'sub'){
      if(qty > current){ toast(`Is godam mein sirf ${current} hai`,'error'); return; }
      delta = -qty;
    }else{
      // set absolute
      delta = qty - current;
    }
    if(delta === 0){ toast('Koi change nahi','info'); return; }
    await adjustProductStock(productId, delta, godamId);
    const g = STATE.godams.find(x=>x.id===godamId);
    await logAudit('Godam', `Stock ${mode} ${Math.abs(delta)} x ${p.name} → ${g?.name||godamId} (was ${current})`);
    toast(`Stock updated: ${p.name} → ${g?.name||'godam'}`,'success');
    closeModal();
    if(typeof softRefreshActivePage === 'function') softRefreshActivePage();
    else if(ACTIVE_PAGE==='godams') softRefreshActivePage();
  }catch(e){
    toast('Failed: '+e.message,'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Save stock'; }
  }finally{
    window._saveLocks['godamAddStock'] = false;
  }
};

  const gOpts = godamOptionsHtml('', true);
  const pOpts = (STATE.products||[]).map(p=>`<option value="${p.id}">${p.name} (total ${productEffectiveStock(p)})</option>`).join('');
  openModal('Transfer stock between godams', `
    <div class="field"><label>Product *</label><select id="trProduct"><option value="">— Select —</option>${pOpts}</select></div>
    <div class="grid2">
      <div class="field"><label>From godam *</label><select id="trFrom">${gOpts}</select></div>
      <div class="field"><label>To godam *</label><select id="trTo">${gOpts}</select></div>
    </div>
    <div class="field"><label>Quantity *</label><input type="number" id="trQty" step="1" min="1"></div>
  `, `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveGodamTransfer()">Transfer</button>`);
};
window.saveGodamTransfer = async function(){
  const productId = $('trProduct')?.value;
  const fromId = $('trFrom')?.value;
  const toId = $('trTo')?.value;
  const qty = Number($('trQty')?.value)||0;
  if(!productId || !fromId || !toId || qty<=0){ toast('Product, godams aur qty bharo','error'); return; }
  if(fromId===toId){ toast('From aur To alag hone chahiye','error'); return; }
  const p = STATE.products.find(x=>x.id===productId);
  const avail = productStockInGodam(p, fromId);
  // refine avail from map
  const map = productGodamMap(p);
  const avail2 = map[fromId]!=null ? Number(map[fromId]||0) : (Object.keys(map).length?0: (fromId===getDefaultGodamId()?Number(p.stock||0):0));
  if(qty > avail2){ toast(`Sirf ${avail2} available in source godam`,'error'); return; }
  try{
    await adjustProductGodamStock(productId, fromId, -qty);
    await adjustProductGodamStock(productId, toId, qty);
    await logAudit('Godam', `Transfer ${qty} x ${p.name} between godams`);
    toast('Stock transfer ho gaya','success');
    closeModal();
    if(ACTIVE_PAGE==='godams') softRefreshActivePage();
  }catch(e){ toast('Failed: '+e.message,'error'); }
};

/* ===================== SUPPLIERS ===================== */
/** Cash purchase = cash in hand se kata. Credit / missing payMode = udhaar (cash nahi). */
function isCashPurchase(p){
  return (p && p.payMode) === 'Cash';
}
function isCreditPurchase(p){
  return !isCashPurchase(p);
}
function supplierBalance(id){
  const s = STATE.suppliers.find(x=>x.id===id);
  // Sirf credit purchases payable badhate hain (cash purchase pe paisa de diya)
  const purchased = STATE.purchases.filter(p=>p.supplierId===id && isCreditPurchase(p)).reduce((a,b)=>a+Number(b.total||0),0);
  const returned = (STATE.purchaseReturns||[]).filter(r=>r.supplierId===id).reduce((a,b)=>a+Number(b.total||0),0);
  const paid = STATE.payments.filter(p=>p.partyType==='supplier' && p.partyId===id && !p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  const givenExtra = STATE.payments.filter(p=>p.partyType==='supplier' && p.partyId===id && p.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  return Number(s?.openingBalance||0) + purchased + givenExtra - paid - returned;
}
window.supplierBalance = supplierBalance;
function pageSuppliers(){
  return genericListPage('suppliers', [
    {label:'Name', key:'name'},
    {label:'Sifa No.', render:r=> r.sifaNo? `<span class="mono" style="font-weight:700;color:var(--field-dark)">p.${r.sifaNo}</span>` : '<span class="muted">—</span>'},
    {label:'Phone', key:'phone'},
    {label:'Address', key:'address'},
    {label:'Closing Balance', render:r=>{
      const bal = supplierBalance(r.id);
      const safeName = (r.name||'').replace(/'/g,"\\'");
      return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${formatClosingBal(bal, true)}
        <button class="btn btn-gold btn-sm" onclick="openPaymentModal('supplier','${r.id}','${safeName}')">Payment</button>
        <button class="btn btn-outline btn-sm" onclick="openLedger('supplier','${r.id}')">Ledger</button>
      </div>`;
    }},
  ]);
}

/* ===================== PARTIES / CUSTOMERS (Udhaar) ===================== */
function partyBalance(id){
  const p = STATE.parties.find(x=>x.id===id);
  const sold = STATE.sales.filter(s=>s.partyId===id).reduce((a,b)=>a+Number(b.total||0),0);
  const returned = (STATE.salesReturns||[]).filter(r=>r.partyId===id).reduce((a,b)=>a+Number(b.total||0),0);
  const paid = STATE.payments.filter(x=>x.partyType==='party' && x.partyId===id && !x.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  const givenExtra = STATE.payments.filter(x=>x.partyType==='party' && x.partyId===id && x.isGiven).reduce((a,b)=>a+Number(b.amount||0),0);
  // Sale badhata hai udhaar; return + wasool kam karte hain
  return Number(p?.openingBalance||0) + sold + givenExtra - paid - returned;
}
window.partyBalance = partyBalance;
function formatClosingBal(bal, forSupplier){
  const n = Number(bal)||0;
  // forSupplier: + means we owe supplier (hume dena); for party: + means they owe us (unhe dena)
  if(n > 0){
    const label = forSupplier ? 'Debt' : 'Credit';
    return `<div>
      <div class="mono" style="color:var(--danger);font-weight:800;font-size:14px">${fmt(n)}</div>
      <div style="font-size:11px;color:var(--danger);font-weight:600;margin-top:2px">${label}</div>
    </div>`;
  }
  if(n < 0){
    const label = forSupplier ? 'Credit' : 'Debt';
    return `<div>
      <div class="mono" style="color:var(--ok);font-weight:800;font-size:14px">${fmt(Math.abs(n))}</div>
      <div style="font-size:11px;color:var(--ok);font-weight:600;margin-top:2px">${label}</div>
    </div>`;
  }
  return `<div>
    <div class="mono" style="font-weight:700">${fmt(0)}</div>
    <div style="font-size:11px;color:var(--ink-faint);margin-top:2px">Clear</div>
  </div>`;
}

    {label:'Sifa No.', render:r=> r.sifaNo? `<span class="mono" style="font-weight:700;color:var(--field-dark)">p.${r.sifaNo}</span>` : '<span class="muted">—</span>'},

/* ---------- PARTY LEDGER — khata book style (تاریخ تفصیل صفحہ نام جمع باقیات) ---------- */
window.openLedger = function(partyType, partyId){
  /* Prefer traditional Bahi-Khata (Phase 8) when loaded */
  try {
    if (window.KissanPhase8 && typeof window.KissanPhase8.openBahiLedger === 'function') {
      return window.KissanPhase8.openBahiLedger(partyType, partyId);
    }
  } catch (e) {
    console.error('Bahi ledger failed, fallback', e);
  }
  try {
  if(arguments.length === 1){
    partyId = partyType;
    partyType = 'party';
  }
  const isCustomer = partyType === 'party';
  const party = isCustomer
    ? (STATE.parties||[]).find(x=>x.id===partyId)
    : (STATE.suppliers||[]).find(x=>x.id===partyId);
  if(!party){ toast('Party / supplier nahi mili','error'); return; }
  const name = party?.name || '—';
  const opening = Number(party?.openingBalance||0);
  const sifa = party?.sifaNo || '';

  let rows = [];
  if(opening){
    rows.push({date:'—', desc:'Opening balance', safha: sifa||'', naam: opening>0?opening:0, jama: opening<0?Math.abs(opening):0});
  } else {
    rows.push({date:'—', desc:'Opening balance', safha: sifa||'', naam:0, jama:0});
  }

  if(isCustomer){
    (STATE.sales||[]).filter(s=>s.partyId===partyId).forEach(s=>{
      rows.push({date:s.date||'', desc: (typeof saleDetailLine==='function'?saleDetailLine(s):(s.productName||'Sale')), takenBy: (typeof saleTakenBy==='function'?saleTakenBy(s):s.takenBy||''), safha:s.safha||sifa||'', naam:Number(s.total||0), jama:0});
    });
    (STATE.salesReturns||[]).filter(r=>r.partyId===partyId).forEach(r=>{
      rows.push({date:r.date||'', desc:`Return — ${r.productName||''}`, safha:r.safha||'', naam:0, jama:Number(r.total||0)});
    });
  } else {
    (STATE.purchases||[]).filter(p=>p.supplierId===partyId).forEach(p=>{
      rows.push({date:p.date||'', desc:`Purchase — ${p.productName||''}${p.docNo?' ('+p.docNo+')':''}`, safha:p.safha||sifa||'', naam:Number(p.total||0), jama:0});
    });
    (STATE.purchaseReturns||[]).filter(r=>r.supplierId===partyId).forEach(r=>{
      rows.push({date:r.date||'', desc:`Return — ${r.productName||''}`, safha:r.safha||'', naam:0, jama:Number(r.total||0)});
    });
  }

  (STATE.payments||[]).filter(x=>x.partyType===partyType && x.partyId===partyId).forEach(x=>{
    if(x.isGiven){
      rows.push({date:x.date||'', desc:x.note||'Given', safha:x.safha||'', naam:Number(x.amount||0), jama:0, payId:x.id, editable:true});
    } else {
      rows.push({date:x.date||'', desc:x.note||(isCustomer?'Payment received':'Payment'), safha:x.safha||'', naam:0, jama:Number(x.amount||0), payId:x.id, editable:true});
    }
  });

  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let running = 0;
  rows = rows.map(r=>{
    running += (Number(r.naam)||0) - (Number(r.jama)||0);
    const jn = (Number(r.naam)||0) > 0 ? 'G' : ((Number(r.jama)||0) > 0 ? 'T' : '—');
    return {...r, bal: running, jn};
  });
  const closing = running;
  const balColor = closing>0 ? 'var(--danger)' : (closing<0 ? 'var(--ok)' : 'var(--ink)');
  const balLabel = closing>0 ? (isCustomer?'Credit':'Debt') : (closing<0 ? (isCustomer?'Advance':'Credit') : 'Clear');
  const safeName = (name||'').replace(/'/g,"\\'");

  openModal(`Ledger — ${name}`, `
    <div style="margin-bottom:12px">
      <div style="font-family:var(--serif);font-size:22px;font-weight:800;color:var(--field-dark)">Party Ledger</div>
      <div class="muted" style="font-size:12px">${isCustomer?'Customer':'Supplier'} · Sifa: ${sifa||'—'} · ${party?.phone||''}</div>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>Date</th><th>Detail</th><th>Page</th>
        <th class="right">Naam (Debit)</th><th class="right">Jama (Credit)</th>
        <th class="right">Balance</th><th></th>
      </tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td class="mono">${r.date||'—'}</td>
            <td>${r.desc||''}${r.takenBy?` <span class="hint">(${r.takenBy})</span>`:''}</td>
            <td class="mono">${r.safha||''}</td>
            <td class="right mono">${r.naam?Number(r.naam).toLocaleString('en-PK'):''}</td>
            <td class="right mono">${r.jama?Number(r.jama).toLocaleString('en-PK'):''}</td>
            <td class="right mono" style="font-weight:700">${Number(r.bal||0).toLocaleString('en-PK')}</td>
            <td class="right">${r.editable&&r.payId?`
              <button class="btn btn-outline btn-sm" onclick="editLedgerPayment('${partyType}','${partyId}','${r.payId}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteLedgerPayment('${partyType}','${partyId}','${r.payId}')">Del</button>
            `:''}</td>
          </tr>`).join('')||'<tr class="empty-row"><td colspan="7">No entries</td></tr>'}
      </tbody>
    </table></div>
    <div style="margin-top:14px;padding:12px;background:var(--field-soft);border-radius:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><span class="muted">Closing</span> <b style="color:${balColor};font-size:18px">${fmt(Math.abs(closing))}</b> <span class="stamp ${closing>0?'bad':(closing<0?'ok':'mute')}">${balLabel}</span></div>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">Close</button>
    <button class="btn btn-gold" onclick="openManualLedgerEntry('${partyType}','${partyId}','${safeName}')">+ Given / Take</button>
    <button class="btn btn-outline" onclick="printPartyLedger('${partyType}','${partyId}')">Print</button>
    <button class="btn btn-primary" onclick="downloadPartyLedgerPdf('${partyType}','${partyId}')">PDF</button>
  `, true);
  } catch (e) {
    console.error('openLedger', e);
    toast('Ledger open nahi hua: '+(e.message||e), 'error');
  }
};

window.saveManualLedgerEntry = async function(partyType, partyId, editId){
  if(window._ledgerSaving) return;
  const amount = Number($('mlAmt').value)||0;
  const type = $('mlType').value;
  if(amount<=0){ toast('Enter a valid amount','error'); return; }
  window._ledgerSaving = true;
  try{
    const payload = {
      partyType, partyId, amount,
      isGiven: type === 'given',
      date: $('mlDate').value||todayISO(),
      safha: ($('mlSafha')?.value||'').trim(),
      note: $('mlNote').value || (type==='given'?'Given':'Take'),
      atLocal: new Date().toISOString()
    };
    if(editId){
      await updateDoc(doc(db,'payments', editId), payload);
      STATE.payments = (STATE.payments||[]).map(p => p.id===editId ? {...p, ...payload} : p);
      await logAudit('Ledger', `Entry edited: ${fmt(amount)}`);
      toast('Entry update ho gayi','success');
    } else {
      const ref = await addDoc(collection(db,'payments'), payload);
      // Dedupe by id — double save / snapshot race avoid
      const rest = (STATE.payments||[]).filter(p => p.id !== ref.id);
      STATE.payments = [{id:ref.id, ...payload}, ...rest];
      await logAudit('Ledger', `${partyType} ${type}: ${fmt(amount)}`);
      toast('Ledger entry saved','success');
    }
    closeModal();
    openLedger(partyType, partyId);
    if(ACTIVE_PAGE==='parties'){ const c=$('pageContent'); if(c) c.innerHTML=pageParties(); }
    if(ACTIVE_PAGE==='suppliers'){ const c=$('pageContent'); if(c) c.innerHTML=pageSuppliers(); }
  }catch(e){ toast('Failed: '+e.message,'error'); }
  finally{ window._ledgerSaving = false; }
};

window.buildPartyLedgerRows = function(partyType, partyId){

  const name = party?.name || '—';
  const opening = Number(party?.openingBalance||0);
  const sifa = party?.sifaNo || '';
  const phone = party?.phone || '';
  const address = party?.address || '';

  let rows = [];
  rows.push({date:'—', desc:'Opening balance', safha:sifa||'', naam: opening>0?opening:0, jama: opening<0?Math.abs(opening):0});
  if(isCustomer){
    STATE.sales.filter(s=>s.partyId===partyId).forEach(s=>{
      rows.push({date:s.date||'', desc: saleDetailLine(s), takenBy: saleTakenBy(s), safha:s.safha||sifa||'', naam:Number(s.total||0), jama:0});
    });
    (STATE.salesReturns||[]).filter(r=>r.partyId===partyId).forEach(r=>{
      rows.push({date:r.date||'', desc:`Return — ${r.productName||''}`, safha:r.safha||'', naam:0, jama:Number(r.total||0)});
    });
  } else {
    STATE.purchases.filter(p=>p.supplierId===partyId).forEach(p=>{
      rows.push({date:p.date||'', desc:`Purchase — ${p.productName||''}${p.docNo?' ('+p.docNo+')':''}`, safha:p.safha||sifa||'', naam:Number(p.total||0), jama:0});
    });
    (STATE.purchaseReturns||[]).filter(r=>r.supplierId===partyId).forEach(r=>{
      rows.push({date:r.date||'', desc:`Return — ${r.productName||''}`, safha:r.safha||'', naam:0, jama:Number(r.total||0)});
    });
  }
  STATE.payments.filter(x=>x.partyType===partyType && x.partyId===partyId).forEach(x=>{
    if(x.isGiven) rows.push({date:x.date||'', desc:x.note||'Given', safha:x.safha||'', naam:Number(x.amount||0), jama:0});

};

window.downloadPartyLedgerPdf = function(partyType, partyId){
  const L = buildPartyLedgerRows(partyType, partyId);
  const { name, sifa, phone, address, rows, closing, isCustomer } = L;
  const jsPDFCtor = window.jspdf?.jsPDF;
  if(!jsPDFCtor){ toast('PDF library not ready — Print use karein','error'); return; }
  try{
    const pdf = new jsPDFCtor({ orientation:'portrait', unit:'mm', format:'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const balLabel = closing>0 ? (isCustomer?'Credit (udhaar)':'Payable') : (closing<0 ? (isCustomer?'Advance':'Receivable') : 'Clear');

    pdf.setFontSize(14);
    pdf.setTextColor(15, 61, 36);
    pdf.text('KISSAN FERTILIZER — PARTY LEDGER', pageW/2, 14, { align:'center' });
    pdf.setFontSize(9);
    pdf.setTextColor(80);
    pdf.text('Miro Khan Road, Kamber', pageW/2, 20, { align:'center' });
    pdf.setFontSize(12);
    pdf.setTextColor(20);
    pdf.text(String(name), pageW/2, 28, { align:'center' });
    pdf.setFontSize(8);
    pdf.setTextColor(60);
    const meta = [
      sifa ? ('Sifa: '+sifa) : '',
      phone ? ('Phone: '+phone) : '',
      'Printed: '+new Date().toLocaleString('en-PK'),
      'Lines: '+rows.length
    ].filter(Boolean).join('  ·  ');
    pdf.text(meta, pageW/2, 34, { align:'center' });
    if(address) pdf.text(String(address).slice(0,90), pageW/2, 39, { align:'center' });

    const body = rows.map(r=>[
      r.date||'—',
      r.desc||'',
      r.takenBy||'—',
      r.safha||'',
      r.naam ? Number(r.naam).toLocaleString('en-PK') : '',
      r.jama ? Number(r.jama).toLocaleString('en-PK') : '',
      r.jn||'',
      Number(r.bal).toLocaleString('en-PK')
    ]);

    pdf.autoTable({
      startY: address ? 43 : 38,
      head:[['Date','Detail','Le gaya','Page','Given','Take','G/T','Balance']],
      body,
      styles: { fontSize: 8, cellPadding: 1.5, overflow: 'linebreak' },
      headStyles: { fillColor: [15, 61, 36], textColor: 255, fontStyle: 'bold', fontSize: 8 },
      columnStyles: {
        0: { cellWidth: 22 },
        1: { cellWidth: 'auto' },
        2: { cellWidth: 16 },
        3: { cellWidth: 22, halign:'right' },
        4: { cellWidth: 22, halign:'right' },
        5: { cellWidth: 12, halign:'center' },
        6: { cellWidth: 24, halign:'right', fontStyle:'bold' }
      },
      margin: { left: 10, right: 10 },
      didDrawPage: function(data){
        const pageH = pdf.internal.pageSize.getHeight();
        pdf.setFontSize(7);
        pdf.setTextColor(120);
        pdf.text('Software by Fazul Khan Chandio · 03333909816', 10, pageH - 8);
        pdf.text('Page '+data.pageNumber, pageW - 10, pageH - 8, { align:'right' });
      }
    });

    const finalY = (pdf.lastAutoTable && pdf.lastAutoTable.finalY ? pdf.lastAutoTable.finalY : 50) + 8;
    pdf.setFontSize(10);
    pdf.setTextColor(15, 61, 36);
    pdf.text('Closing Balance: Rs. '+Number(closing).toLocaleString('en-PK')+'  ('+balLabel+')', 10, finalY);

    const safe = String(name).replace(/[^a-zA-Z0-9\\-_]+/g,'_').slice(0,40);
    pdf.save('ledger_'+safe+'_'+todayISO()+'.pdf');
    toast('Ledger PDF downloaded','success');
  }catch(e){
    console.error(e);
    toast('PDF failed: '+(e.message||e),'error');
  }
};

window.savePurchase = async function(id){
  if(window._saveLocks['purchase']){ toast('Pehle se save ho raha hai — wait…','info'); return; }
  window._saveLocks['purchase'] = true;
  try{
  const productId = $('pProduct').value;
  const qty = Number($('pQty').value)||0;
  const rate = Number($('pRate').value)||0;
  if(!productId || qty<=0 || rate<=0){ toast('Fill product, quantity and rate','error'); return; }
  const product = STATE.products.find(p=>p.id===productId);
  const supplier = STATE.suppliers.find(s=>s.id===$('pSupplier').value);
  const manual = ($('pSupplierManual')?.value||'').trim();
  const supplierId = supplier?.id || '';
  const supplierName = supplier?.name || manual || 'Walk-in / cash';
  if(!supplierId && !manual){
    // allow empty -> Walk-in, but prefer typed name
  }
  const freeQty = Number($('pFreeQty')?.value)||0;
  const total = qty*rate; // free qty not valued
  const batchNo = $('pBatch').value||'';
  const mfgDate = $('pMfg')?.value||'';
  const expiryDate = $('pExp')?.value||'';
  const date = $('pDate').value||todayISO();
  const payMode = ($('pPayMode')?.value || 'Credit (udhaar)');
  const stockIn = qty + freeQty;
  try{
    if(id){
      const old = STATE.purchases.find(p=>p.id===id);
      if(old && old.productId){
        // reverse previous purchase qty from its godam
        const oldIn = Number(old.qty||0) + Number(old.freeQty||0);
        await adjustProductStock(old.productId, -oldIn, old.godamId || getDefaultGodamId());
      }
      const godamId = $('pGodam')?.value || getDefaultGodamId();
      await updateDoc(doc(db,'purchases',id), { productId, productName: product.name, supplierId, supplierName, qty, freeQty, rate, total, batchNo, mfgDate, expiryDate, date, godamId, payMode });
      await adjustProductStock(productId, stockIn, godamId);
      if(window.KissanPhase3 && (batchNo || mfgDate || expiryDate)){
        await window.KissanPhase3.addBatchRecord({ productId, productName: product.name, batchNo: batchNo||('P-'+Date.now()), qty: stockIn, mfgDate, expiryDate, receivedDate: date, godamId });
      }
      if(window.KissanPhase3){
        await window.KissanPhase3.recordStockMove({ productId, productName: product.name, qty: stockIn, freeQty, type:'Purchase', refDoc: batchNo, godamId, batchNo, date });
      }
      // Cost price update — future profit margin sahi rahe
      try{ await updateDoc(doc(db,'products', productId), { purchasePrice: rate }); 
        const pi = STATE.products.findIndex(p=>p.id===productId);
        if(pi>=0) STATE.products[pi] = { ...STATE.products[pi], purchasePrice: rate };
      }catch(_){}
      const si = STATE.purchases.findIndex(p=>p.id===id);
      if(si>=0) STATE.purchases[si] = { ...STATE.purchases[si], productId, productName: product.name, supplierId, supplierName, qty, rate, total, batchNo, date, godamId, payMode };
      await logAudit('Update', `Purchase edited: ${qty} x ${product.name} (${payMode})`);
      toast('Purchase updated & stock adjusted','success');
    }else{
      const godamId = $('pGodam')?.value || getDefaultGodamId();
      const payload = {
        docNo: nextDocNo('purchases'),
        productId, productName: product.name, supplierId, supplierName,
        qty, freeQty, rate, total, batchNo, mfgDate, expiryDate, date, godamId, payMode, atLocal: new Date().toISOString()
      };
      const ref = await addDoc(collection(db,'purchases'), payload);
      STATE.purchases = dedupeById([{ id: ref.id, ...payload }, ...(STATE.purchases||[])]);
      await adjustProductStock(productId, stockIn, godamId);
      if(window.KissanPhase3 && (batchNo || mfgDate || expiryDate)){
        await window.KissanPhase3.addBatchRecord({ productId, productName: product.name, batchNo: batchNo||('P-'+Date.now()), qty: stockIn, mfgDate, expiryDate, receivedDate: date, godamId });
      }
      if(window.KissanPhase3){
        await window.KissanPhase3.recordStockMove({ productId, productName: product.name, qty: stockIn, freeQty, type:'Purchase', refDoc: payload.docNo, godamId, batchNo, date });
      }
      try{ await updateDoc(doc(db,'products', productId), { purchasePrice: rate });
        const pi = STATE.products.findIndex(p=>p.id===productId);
        if(pi>=0) STATE.products[pi] = { ...STATE.products[pi], purchasePrice: rate };
      }catch(_){}
      await logAudit('Purchase', `${qty}${freeQty?`+${freeQty} free`:''} x ${product.name} purchased (${payMode})`);
      toast('Purchase saved & stock updated'+(payMode==='Cash'?' · cash out':''),'success');
    }
    closeModal();
    if(typeof softRefreshActivePage === 'function') softRefreshActivePage();
  }catch(e){ toast('Failed: '+e.message,'error'); }
  }finally{ window._saveLocks['purchase'] = false; }
};
window.deletePurchase = async function(id, productId, qty){
  if(!confirm('Delete this purchase? Stock godam se wapas cut hoga.')) return;
  try{
    const pur = STATE.purchases.find(p=>p.id===id);
    if(!pur){ toast('Purchase nahi mili','error'); return; }
    const pid = productId || pur.productId || '';
    const q = Number(qty != null ? qty : pur.qty) || 0;
    const gid = pur.godamId || getDefaultGodamId();
    const product = STATE.products.find(p=>p.id===pid);

    // Stock reverse — pehle cut, phir doc delete
    if(pid && q > 0){
      if(product){
        await adjustProductStock(pid, -q, gid);
      }else{
        // product list mein na mile to bhi Firestore se try
        try{
          const map = {};
          if(gid) map[gid] = -q; // adjustProductStock needs product in STATE
          console.warn('deletePurchase: product missing in STATE', pid);
        }catch(_){}
        toast('Product nahi mila — stock manually check karein','error');
      }
    }
    await deleteDoc(doc(db,'purchases',id));
    STATE.purchases = (STATE.purchases||[]).filter(p=>p.id!==id);
    await logAudit('Delete', `Purchase deleted: ${q} x ${pur.productName||pid} (stock −${q})`);
    toast(`Purchase deleted · stock −${q}`,'success');
    if(typeof softRefreshActivePage === 'function') softRefreshActivePage();
  }catch(e){ toast('Failed: '+e.message,'error'); }
};
