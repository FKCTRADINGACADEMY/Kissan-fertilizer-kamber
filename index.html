<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kissan Fertilizer — Kamber</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
/* ============================================================
   KISSAN FERTILIZER — DESIGN SYSTEM
   Theme: a shopkeeper's field ledger — cream paper, deep crop
   green, wheat-gold stamps. Signature element: the wax-stamp
   status badge and the stitched "ledger" card border.
   ============================================================ */
:root{
  --field:#1f4d2c;
  --field-dark:#123420;
  --field-soft:#e7efe4;
  --wheat:#c98a1f;
  --wheat-soft:#f6e6bf;
  --soil:#7a4b2e;
  --paper:#faf6ec;
  --card:#fffdf8;
  --ink:#20281f;
  --ink-soft:#5f6a58;
  --ink-faint:#9aa393;
  --line:#e6ddc6;
  --danger:#a8402a;
  --danger-soft:#f6e0da;
  --ok:#2f7a45;
  --ok-soft:#e2f0e1;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 2px 10px rgba(31,77,44,.07), 0 1px 2px rgba(31,77,44,.06);
  --shadow-lg:0 18px 48px rgba(18,52,32,.18);
  --sidebar-w:250px;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(31,77,44,.035) 1px, transparent 1px);
  background-size:22px 22px;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#d9cfae;border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

.stitch{
  position:relative;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.stitch::before{
  content:"";
  position:absolute; left:14px; right:14px; top:5px;
  height:1px;
  background:repeating-linear-gradient(90deg, var(--wheat) 0 6px, transparent 6px 11px);
  opacity:.55;
}

#loginScreen{
  position:fixed; inset:0; z-index:500;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(201,138,31,.18), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,.08), transparent 45%),
    linear-gradient(160deg, var(--field) 0%, var(--field-dark) 100%);
  padding:20px;
}
.login-card{
  width:100%; max-width:380px;
  background:var(--paper);
  border-radius:20px;
  padding:38px 34px 30px;
  box-shadow:var(--shadow-lg);
  text-align:center;
  position:relative;
}
.login-mark{
  width:58px;height:58px;border-radius:50%;
  background:var(--field); color:var(--wheat-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:26px; margin:0 auto 16px;
  box-shadow:0 0 0 5px var(--field-soft);
}
.login-card h1{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--field-dark);}
.login-card p.sub{color:var(--ink-soft);font-size:13px;margin-top:4px;margin-bottom:26px;}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.02em;}
.field input,.field select,.field textarea{
  width:100%; padding:11px 13px; border:1.5px solid var(--line);
  border-radius:var(--radius-sm); font-size:14px; background:#fff; color:var(--ink);
  transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--field);}
.field textarea{resize:vertical;min-height:70px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 18px; border-radius:var(--radius-sm); border:none;
  font-weight:700; font-size:13.5px; letter-spacing:.01em; transition:.15s;
}
.btn-primary{background:var(--field);color:#fff;}
.btn-primary:hover{background:var(--field-dark);}
.btn-block{width:100%;}
.btn-gold{background:var(--wheat);color:#3a2503;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--field);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px;}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;display:none;}

#app{display:none;}
#app.show{display:flex;min-height:100vh;position:relative;z-index:1;}
.sidebar{
  width:var(--sidebar-w); min-width:var(--sidebar-w);
  background:var(--field-dark);
  color:#e8efe4;
  position:fixed; top:0; bottom:0; left:0;
  display:flex; flex-direction:column;
  z-index:100;
  transition:transform .25s;
}
.sidebar-head{
  padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08);
  display:flex; align-items:center; gap:11px;
}
.sidebar-head .mark{
  width:38px;height:38px;border-radius:10px;background:var(--wheat);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
}
.sidebar-head h1{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.15;}
.sidebar-head span{font-size:10.5px;color:#b9c9b3;letter-spacing:.03em;}
.nav{flex:1;overflow-y:auto;padding:14px 10px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7f9179;padding:14px 10px 6px;font-weight:700;}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:9px;
  font-size:13.5px; color:#cfdccb; font-weight:500; margin-bottom:2px;
}
.nav a .ic{width:17px;text-align:center;font-size:14px;opacity:.85;}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav a.active{background:var(--wheat);color:#3a2503;font-weight:700;}
.nav a.active .ic{opacity:1;}
.sidebar-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 4px;}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--field-soft);color:var(--field-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.who .nm{font-size:12.5px;font-weight:700;color:#fff;}
.who .rl{font-size:10.5px;color:#9fb298;}
.logout-btn{width:100%;background:rgba(255,255,255,.07);color:#e8efe4;border:1px solid rgba(255,255,255,.1);padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;}
.logout-btn:hover{background:rgba(255,255,255,.14);}

.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;position:relative;z-index:1;}
.topbar{
  position:sticky; top:0; z-index:60;
  height:64px; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; background:rgba(250,246,236,.9); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.topbar-left{display:flex;align-items:center;gap:14px;}
.burger{display:none;width:36px;height:36px;border:none;background:transparent;font-size:18px;color:var(--field-dark);}
.crumb{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--field-dark);}
.crumb small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;color:var(--ink-faint);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-place{font-size:11.5px;color:var(--ink-soft);background:var(--field-soft);padding:6px 12px;border-radius:20px;font-weight:600;}
.sync-dot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:700;}
.sync-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft);}

.content{padding:26px 30px 60px;max-width:1400px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-head h2{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--field-dark);}
.page-head p{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.stat{padding:18px 18px 16px;position:relative;overflow:hidden;}
.stat .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.stat .val{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:8px;color:var(--field-dark);}
.stat .sub{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.stat .ic{position:absolute;right:14px;top:14px;font-size:20px;opacity:.7;}
.stat.gold .val{color:#8a5c0e;}
.stat.red .val{color:var(--danger);}

.panel{padding:20px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--field-dark);}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;}
.search-box input{padding:9px 12px 9px 32px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;width:210px;background:#fff;}
.search-box::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:15px;}

.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{
  text-align:left; padding:9px 12px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--ink-soft); border-bottom:2px solid var(--line); font-weight:700; white-space:nowrap;
}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.tbl tr:hover td{background:var(--field-soft);}
table.tbl tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:6px;}
.empty-row td{text-align:center;color:var(--ink-faint);padding:34px 10px;font-style:italic;}

.stamp{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 8px;
  border-radius:20px; font-size:11px; font-weight:800; letter-spacing:.03em;
  border:1.5px dashed currentColor; transform:rotate(-1.5deg);
}
.stamp.ok{color:var(--ok);background:var(--ok-soft);}
.stamp.warn{color:#8a5c0e;background:var(--wheat-soft);}
.stamp.bad{color:var(--danger);background:var(--danger-soft);}
.stamp.mute{color:var(--ink-faint);background:#f0ece0;}

.modal-backdrop{position:fixed;inset:0;background:rgba(18,32,20,.5);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.show{display:flex;}
.modal{
  width:100%;max-width:520px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);
  max-height:88vh;display:flex;flex-direction:column;
}
.modal.wide{max-width:760px;}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--field-dark);}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--field-soft);color:var(--field-dark);font-size:15px;}
.modal-body{padding:22px 24px;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}

#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast-item{
  padding:12px 18px;border-radius:11px;color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease; max-width:320px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.toast-item.success{background:var(--ok);}
.toast-item.error{background:var(--danger);}
.toast-item.info{background:var(--field);}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
.ledger-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.ledger-line:last-child{border-bottom:none;}
.mono{font-family:var(--mono);}
.right{text-align:right;}
.center{text-align:center;}
.muted{color:var(--ink-soft);}
.hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .burger{display:block;}
}
@media print{
  .no-print{display:none!important;}
  body{background:#fff;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">🌾</div>
    <h1>Kissan Fertilizer</h1>
    <p class="sub">Miro Khan Road, Kamber — ledger &amp; store manager</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@kissan.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()"><span id="loginBtnLabel">Sign in</span></button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<div id="app">
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-head">
      <div class="mark">🌾</div>
      <div><h1>Kissan Fertilizer</h1><span>Kamber Branch</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <div class="av" id="whoAv">K</div>
        <div><div class="nm" id="whoName">—</div><div class="rl">Signed in</div></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar no-print">
      <div class="topbar-left">
        <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="crumb"><span id="crumbTitle">Dashboard</span><small id="crumbSub">Today's overview</small></div>
      </div>
      <div class="topbar-right">
        <span class="badge-place">📍 Miro Khan Road, Kamber</span>
        <span class="sync-dot"><i></i>Synced</span>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<div id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle">Title</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
  query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ===================== FIREBASE (unchanged) ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBgj4ICBiPlikXgTjkzPrRUCv3CX3At0KA",
  authDomain: "kissan-fertilizer.firebaseapp.com",
  projectId: "kissan-fertilizer",
  storageBucket: "kissan-fertilizer.firebasestorage.app",
  messagingSenderId: "476514606793",
  appId: "1:476514606793:web:157d8f78e74f426644f718"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ===================== STATE =====================
   Every record lives as its OWN Firestore document inside its
   collection (never one big array in a single doc), so no
   collection can ever push a single document past Firestore's
   1MB-per-document ceiling no matter how much data is stored. */
const STATE = {
  products:[], purchases:[], sales:[], parties:[], suppliers:[],
  expenses:[], vouchers:[], payments:[], users:[], audit:[]
};
let CURRENT_USER = null;
let ACTIVE_PAGE = 'dashboard';

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const fmt = n => 'Rs. ' + (Number(n)||0).toLocaleString('en-PK', {maximumFractionDigits:0});
const todayISO = () => new Date().toISOString().slice(0,10);

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

async function logAudit(action, detail){
  try{
    await addDoc(collection(db,'audit'), {
      action, detail, user: CURRENT_USER?.email || 'unknown', at: serverTimestamp(), atLocal: new Date().toISOString()
    });
  }catch(e){ /* non-fatal */ }
}

function closeModal(){ $('modalBackdrop').classList.remove('show'); $('modalBody').innerHTML=''; $('modalFoot').innerHTML=''; }
window.closeModal = closeModal;

function openModal(title, bodyHtml, footHtml, wide=false){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHtml;
  $('modalFoot').innerHTML = footHtml;
  $('modalBox').classList.toggle('wide', wide);
  $('modalBackdrop').classList.add('show');
}

/* ===================== AUTH ===================== */
window.doLogin = async function(){
  const email = $('loginEmail').value.trim();
  const pass = $('loginPass').value;
  const errEl = $('loginErr');
  errEl.style.display='none';
  if(!email || !pass){ errEl.textContent='Enter email and password.'; errEl.style.display='block'; return; }
  $('loginBtnLabel').textContent = 'Signing in…';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errEl.textContent = 'Sign-in failed — check your email and password.';
    errEl.style.display='block';
  }
  $('loginBtnLabel').textContent = 'Sign in';
};

window.doLogout = async function(){
  await logAudit('Logout','User signed out');
  await signOut(auth);
};

onAuthStateChanged(auth, (user)=>{
  if(user){
    CURRENT_USER = user;
    $('loginScreen').style.display='none';
    $('app').classList.add('show');
    $('whoName').textContent = user.email;
    $('whoAv').textContent = (user.email||'K').charAt(0).toUpperCase();
    startListeners();
    renderNav();
    goPage('dashboard');
  }else{
    CURRENT_USER = null;
    $('app').classList.remove('show');
    $('loginScreen').style.display='flex';
  }
});

/* ===================== NAV / ROUTING ===================== */
const NAV = [
  {sec:'Overview', items:[
    {id:'dashboard', label:'Dashboard', ic:'◆'}
  ]},
  {sec:'Inventory', items:[
    {id:'products', label:'Products', ic:'▤'},
  ]},
  {sec:'Transactions', items:[
    {id:'purchases', label:'Purchases', ic:'⇩'},
    {id:'sales', label:'Sales', ic:'⇧'},
    {id:'vouchers', label:'Cash Book', ic:'✎'},
    {id:'expenses', label:'Expenses', ic:'−'},
  ]},
  {sec:'People', items:[
    {id:'parties', label:'Customers (Udhaar)', ic:'☺'},
    {id:'suppliers', label:'Suppliers', ic:'⚑'},
  ]},
  {sec:'Records', items:[
    {id:'dailybalance', label:'Daily Balance Sheet', ic:'⚖'},
    {id:'reports', label:'Reports', ic:'▦'},
    {id:'users', label:'Staff & Users', ic:'☷'},
    {id:'audit', label:'Audit Log', ic:'☰'},
    {id:'settings', label:'Settings', ic:'⚙'},
  ]}
];

function renderNav(){
  let html = '';
  NAV.forEach(sec=>{
    html += `<div class="nav-label">${sec.sec}</div>`;
    sec.items.forEach(it=>{
      html += `<a href="#" data-page="${it.id}" class="${it.id===ACTIVE_PAGE?'active':''}"><span class="ic">${it.ic}</span>${it.label}</a>`;
    });
  });
  $('navList').innerHTML = html;

function listen(colName, stateKey, order='atLocal'){
  try{
    onSnapshot(query(collection(db,colName)), (snap)=>{
      STATE[stateKey] = snap.docs.map(d=>({id:d.id, ...d.data()}));
      STATE[stateKey].sort((a,b)=> (b[order]||'').localeCompare(a[order]||''));
      if(ACTIVE_PAGE===stateKey){ goPage(ACTIVE_PAGE); }
      if(ACTIVE_PAGE==='dashboard'){ $('pageContent').innerHTML = pageDashboard(); drawDashboardChart(); }
    }, (err)=>{ console.warn('listen error', colName, err.message); });
  }catch(e){ console.warn(e); }
}
function startListeners(){
  listen('products','products','name');
  listen('purchases','purchases');
  listen('sales','sales');
  listen('parties','parties','name');
  listen('suppliers','suppliers','name');
  listen('expenses','expenses');
  listen('vouchers','vouchers');
  listen('payments','payments');
  listen('users','users','name');
  onSnapshot(query(collection(db,'audit'), orderBy('atLocal','desc')), (snap)=>{
    STATE.audit = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(ACTIVE_PAGE==='audit') goPage('audit');
  }, ()=>{});
}

/* ===================== GENERIC CRUD ENGINE =====================
   One compact engine drives Products / Suppliers / Parties /
   Expenses / Users so each module is just a field schema, not
   hundreds of bespoke lines. */
function fieldInput(f, val=''){
  val = val ?? '';
  if(f.type==='select'){
    const opts = f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('');
    return `<select id="f_${f.key}"><option value="">Select…</option>${opts}</select>`;
  }
  if(f.type==='textarea') return `<textarea id="f_${f.key}">${val}</textarea>`;
  return `<input type="${f.type||'text'}" id="f_${f.key}" value="${val}" ${f.step?`step="${f.step}"`:''} placeholder="${f.ph||''}">`;
}

function crudModalOpen(cfg, existing){
  const fieldsHtml = cfg.fields.map(f=>`
    <div class="field"><label>${f.label}${f.required?' *':''}</label>${fieldInput(f, existing?existing[f.key]:'')}</div>
  `).join('');
  openModal(existing? `Edit ${cfg.singular}`:`Add ${cfg.singular}`,
    `<div class="grid2">${fieldsHtml}</div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="crudSave('${cfg.key}', ${existing? `'${existing.id}'`:'null'})">Save</button>`);
}

window.crudSave = async function(key, id){
  const cfg = CRUD_MODULES[key];
  const data = {};
  for(const f of cfg.fields){
    const el = $('f_'+f.key);
    let v = el.value;
    if(f.type==='number') v = Number(v)||0;
    if(f.required && (v===''||v===null)){ toast(`${f.label} is required`, 'error'); return; }
    data[f.key] = v;
  }
  try{
    if(id){
      await updateDoc(doc(db, cfg.collection, id), data);
      await logAudit('Update', `${cfg.singular} updated: ${data[cfg.titleField]||id}`);
      toast(`${cfg.singular} updated`, 'success');
    }else{
      data.atLocal = new Date().toISOString();
      await addDoc(collection(db, cfg.collection), data);
      await logAudit('Create', `${cfg.singular} added: ${data[cfg.titleField]||''}`);
      toast(`${cfg.singular} added`, 'success');
    }
    closeModal();
  }catch(e){ toast('Save failed: '+e.message, 'error'); }
};

window.crudDelete = async function(key, id, label){
  if(!confirm(`Delete "${label}"? This can't be undone.`)) return;
  const cfg = CRUD_MODULES[key];
  try{
    await deleteDoc(doc(db, cfg.collection, id));
    await logAudit('Delete', `${cfg.singular} deleted: ${label}`);
    toast(`${cfg.singular} deleted`, 'success');
  }catch(e){ toast('Delete failed: '+e.message, 'error'); }
};

/* ===================== DASHBOARD ===================== */
function pageDashboard(){
  const today = todayISO();
  const salesToday = STATE.sales.filter(s=>s.date===today);
  const purchToday = STATE.purchases.filter(p=>p.date===today);
  const cashIn = STATE.vouchers.filter(v=>v.type==='In').reduce((a,b)=>a+Number(b.amount||0),0);
  const cashOut = STATE.vouchers.filter(v=>v.type==='Out').reduce((a,b)=>a+Number(b.amount||0),0);
  const salesTotalAll = STATE.sales.reduce((a,b)=>a+Number(b.total||0),0);
  const cashInHand = cashIn - cashOut + salesTotalAll - STATE.purchases.reduce((a,b)=>a+Number(b.total||0),0) - STATE.expenses.reduce((a,b)=>a+Number(b.amount||0),0);
  const receivable = STATE.parties.reduce((sum,p)=>sum + partyBalance(p.id), 0);
  const lowStock = STATE.products.filter(p=> Number(p.stock||0) <= Number(p.lowStock||0));
  const salesTodayTotal = salesToday.reduce((a,b)=>a+Number(b.total||0),0);
  const purchTodayTotal = purchToday.reduce((a,b)=>a+Number(b.total||0),0);

  const recent = [...STATE.sales.map(s=>({...s,_k:'Sale'})), ...STATE.purchases.map(p=>({...p,_k:'Purchase'})), ...STATE.vouchers.map(v=>({...v,_k:'Voucher'}))]
    .sort((a,b)=>(b.atLocal||'').localeCompare(a.atLocal||'')).slice(0,8);

  return `
  <div class="stats">
    <div class="stitch stat"><div class="ic">🧾</div><div class="lbl">Sales Today</div><div class="val">${fmt(salesTodayTotal)}</div><div class="sub">${salesToday.length} invoice(s)</div></div>
    <div class="stitch stat gold"><div class="ic">📦</div><div class="lbl">Purchases Today</div><div class="val">${fmt(purchTodayTotal)}</div><div class="sub">${purchToday.length} entr(y/ies)</div></div>
    <div class="stitch stat"><div class="ic">💰</div><div class="lbl">Cash in Hand</div><div class="val">${fmt(cashInHand)}</div><div class="sub">from sales, vouchers &amp; costs</div></div>
    <div class="stitch stat red"><div class="ic">☺</div><div class="lbl">Receivable (Udhaar)</div><div class="val">${fmt(receivable)}</div><div class="sub">across ${STATE.parties.length} customers</div></div>
  </div>

  <div class="two-col">
    <div class="stitch panel">
      <div class="panel-head"><h3>Sales — last 7 days</h3></div>
      <canvas id="dashChart" height="130"></canvas>
    </div>
    <div class="stitch panel">
      <div class="panel-head"><h3>Low stock</h3><span class="stamp ${lowStock.length?'bad':'ok'}">${lowStock.length} item(s)</span></div>
      ${lowStock.length? lowStock.slice(0,6).map(p=>`<div class="ledger-line"><span>${p.name}</span><span class="mono">${p.stock||0} left</span></div>`).join('') : '<p class="muted" style="font-size:13px">All stock levels healthy.</p>'}
    </div>
  </div>

  <div class="stitch panel">
    <div class="panel-head"><h3>Recent activity</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Type</th><th>Details</th><th>Date</th><th class="right">Amount</th></tr></thead>
      <tbody>
        ${recent.length? recent.map(r=>`
          <tr><td><span class="stamp ${r._k==='Sale'?'ok':r._k==='Purchase'?'warn':'mute'}">${r._k}</span></td>
          <td>${r._k==='Sale'? (r.partyName||'Walk-in') : r._k==='Purchase'? (r.supplierName||'') : (r.note||r.type||'')}</td>
          <td>${r.date||'—'}</td><td class="right mono">${fmt(r.total ?? r.amount ?? 0)}</td></tr>`).join('')
          : `<tr class="empty-row"><td colspan="4">No activity yet — record a sale or purchase to get started.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;
}

function drawDashboardChart(){
  const canvas = $('dashChart');
  if(!canvas || !window.Chart) return;
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
  const totals = days.map(d=> STATE.sales.filter(s=>s.date===d).reduce((a,b)=>a+Number(b.total||0),0));
  if(canvas._chart) canvas._chart.destroy();
  canvas._chart = new Chart(canvas, {
    type:'line',
    data:{ labels: days.map(d=>d.slice(5)), datasets:[{ data: totals, borderColor:'#1f4d2c', backgroundColor:'rgba(31,77,44,.1)', fill:true, tension:.35, pointBackgroundColor:'#c98a1f' }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true, grid:{color:'#eee5cc'}}, x:{grid:{display:false}} } }
  });
}

/* ===================== SUPPLIERS ===================== */
function supplierBalance(id){
  const s = STATE.suppliers.find(x=>x.id===id);
  const purchased = STATE.purchases.filter(p=>p.supplierId===id).reduce((a,b)=>a+Number(b.total||0),0);
  const paid = STATE.payments.filter(p=>p.partyType==='supplier' && p.partyId===id).reduce((a,b)=>a+Number(b.amount||0),0);
  return Number(s?.openingBalance||0) + purchased - paid;
}
function pageSuppliers(){
  return genericListPage('suppliers', [

    {label:'Phone', key:'phone'},
    {label:'Address', key:'address'},
    {label:'Payable', render:r=>{
      const bal = supplierBalance(r.id);
      return `<span class="mono" style="color:${bal>0?'var(--danger)':'var(--ok)'};font-weight:700">${fmt(bal)}</span>`;
    }},
  ]);
}

/* ===================== PARTIES / CUSTOMERS (Udhaar) ===================== */
function partyBalance(id){
  const p = STATE.parties.find(x=>x.id===id);
  const sold = STATE.sales.filter(s=>s.partyId===id).reduce((a,b)=>a+Number(b.total||0),0);
  const paid = STATE.payments.filter(x=>x.partyType==='party' && x.partyId===id).reduce((a,b)=>a+Number(b.amount||0),0);
  return Number(p?.openingBalance||0) + sold - paid;
}

      return `<span class="mono" style="color:${bal>0?'var(--danger)':'var(--ok)'};font-weight:700">${fmt(bal)}</span> <button class="btn btn-gold btn-sm" style="margin-left:6px" onclick="openPaymentModal('${r.id}','${(r.name||'').replace(/'/g,"")}')">Record payment</button> <button class="btn btn-outline btn-sm" onclick="openLedger('${r.id}')">Ledger</button>`;

}

window.savePayment = async function(partyType, partyId){

  try{
    await addDoc(collection(db,'payments'), {

window.openLedger = function(partyId){
  const p = STATE.parties.find(x=>x.id===partyId);
  const sales = STATE.sales.filter(s=>s.partyId===partyId).map(s=>({date:s.date, desc:`Sale — ${s.productName||''}`, debit:Number(s.total||0), credit:0}));
  const pays = STATE.payments.filter(x=>x.partyType==='party'&&x.partyId===partyId).map(x=>({date:x.date, desc:x.note||'Payment received', debit:0, credit:Number(x.amount||0)}));
  let rows = [{date:'—', desc:'Opening balance', debit:Number(p?.openingBalance||0), credit:0}, ...sales, ...pays].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let running = 0;
  rows = rows.map(r=>{ running += r.debit - r.credit; return {...r, bal:running}; });
  openModal(`Ledger — ${p?.name||''}`, `
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Description</th><th class="right">Debit</th><th class="right">Credit</th><th class="right">Balance</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.desc}</td><td class="right mono">${r.debit?fmt(r.debit):''}</td><td class="right mono">${r.credit?fmt(r.credit):''}</td><td class="right mono" style="font-weight:700">${fmt(r.bal)}</td></tr>`).join('')}</tbody>

};

  openModal('New Purchase', `

window.savePurchase = async function(){
  const productId = $('pProduct').value;
  const qty = Number($('pQty').value)||0;
  const rate = Number($('pRate').value)||0;
  if(!productId || qty<=0 || rate<=0){ toast('Fill product, quantity and rate','error'); return; }
  const product = STATE.products.find(p=>p.id===productId);
  const supplier = STATE.suppliers.find(s=>s.id===$('pSupplier').value);
  const total = qty*rate;
  try{
    await addDoc(collection(db,'purchases'), {
      productId, productName: product.name, supplierId: supplier?.id||'', supplierName: supplier?.name||'Walk-in / cash',
      qty, rate, total, date: $('pDate').value||todayISO(), atLocal: new Date().toISOString()
    });
    await updateDoc(doc(db,'products',productId), { stock: Number(product.stock||0) + qty });
    await logAudit('Purchase', `${qty} x ${product.name} purchased`);
    toast('Purchase saved & stock updated','success'); closeModal();
  }catch(e){ toast('Failed: '+e.message,'error'); }
};
window.deletePurchase = async function(id, productId, qty){
  if(!confirm('Delete this purchase? Stock will be reduced back.')) return;
  try{
    const product = STATE.products.find(p=>p.id===productId);
    if(product) await updateDoc(doc(db,'products',productId), { stock: Math.max(0, Number(product.stock||0) - qty) });
    await deleteDoc(doc(db,'purchases',id));
    await logAudit('Delete', 'Purchase entry deleted');
    toast('Purchase deleted','success');
  }catch(e){ toast('Failed: '+e.message,'error'); }
};

    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Customer</th><th>Product</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Total</th><th>Payment</th><th class="right">Actions</th></tr></thead>
      <tbody>${rows.length? rows.map(r=>`
        <tr><td>${r.date}</td><td>${r.partyName||'Walk-in'}</td><td>${r.productName}</td>
        <td class="right mono">${r.qty}</td><td class="right mono">${fmt(r.rate)}</td><td class="right mono" style="font-weight:700">${fmt(r.total)}</td>
        <td><span class="stamp ${r.payMode==='Cash'?'ok':'warn'}">${r.payMode||'Cash'}</span></td>
        <td class="right"><button class="btn btn-danger btn-sm" onclick="deleteSale('${r.id}','${r.productId}',${r.qty})">Delete</button></td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="8">No sales recorded yet.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}
window.openSaleModal = function(){
  const partyOpts = STATE.parties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  const prodOpts = STATE.products.map(p=>`<option value="${p.id}" data-rate="${p.salePrice||0}" data-stock="${p.stock||0}">${p.name} (${p.stock||0} in stock)</option>`).join('');
  openModal('New Sale', `
    <div class="grid2">
      <div class="field"><label>Customer</label><select id="sParty"><option value="">Walk-in</option>${partyOpts}</select></div>
      <div class="field"><label>Date</label><input type="date" id="sDate" value="${todayISO()}"></div>
      <div class="field"><label>Product *</label><select id="sProduct" onchange="const o=this.selectedOptions[0]; document.getElementById('sRate').value=o?.dataset.rate||0;">${prodOpts}</select></div>
      <div class="field"><label>Quantity *</label><input type="number" id="sQty" step="1"></div>
      <div class="field"><label>Rate per unit *</label><input type="number" id="sRate" step="0.01"></div>
      <div class="field"><label>Payment mode</label><select id="sPayMode"><option>Cash</option><option>Udhaar (credit)</option></select></div>
    </div>`, `<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveSale()">Save sale</button>`);
};
window.saveSale = async function(){
  const productId = $('sProduct').value;
  const qty = Number($('sQty').value)||0;
  const rate = Number($('sRate').value)||0;
  if(!productId || qty<=0 || rate<=0){ toast('Fill product, quantity and rate','error'); return; }
  const product = STATE.products.find(p=>p.id===productId);
  if(qty > Number(product.stock||0)){ toast('Not enough stock available','error'); return; }
  const party = STATE.parties.find(p=>p.id===$('sParty').value);
  const total = qty*rate;
  try{
    await addDoc(collection(db,'sales'), {
      productId, productName: product.name, partyId: party?.id||'', partyName: party?.name||'Walk-in',
      qty, rate, total, payMode: $('sPayMode').value, date: $('sDate').value||todayISO(), atLocal: new Date().toISOString()
    });
    await updateDoc(doc(db,'products',productId), { stock: Number(product.stock||0) - qty });
    await logAudit('Sale', `${qty} x ${product.name} sold`);
    toast('Sale saved & stock updated','success'); closeModal();
  }catch(e){ toast('Failed: '+e.message,'error'); }
};
window.deleteSale = async function(id, productId, qty){
  if(!confirm('Delete this sale? Stock will be added back.')) return;
  try{
    const product = STATE.products.find(p=>p.id===productId);
    if(product) await updateDoc(doc(db,'products',productId), { stock: Number(product.stock||0) + qty });
    await deleteDoc(doc(db,'sales',id));
    await logAudit('Delete', 'Sale entry deleted');
    toast('Sale deleted','success');
  }catch(e){ toast('Failed: '+e.message,'error'); }
};

/* ===================== DAILY BALANCE SHEET =====================
   Opening balance for a day = the running cash position built up
   from every earlier day (cash sales + cash-in vouchers, minus
   purchases, expenses and cash-out vouchers). Closing balance
   simply carries that forward through the selected day. */
let DAILY_BAL_DATE = todayISO();

function cumulativeCashBefore(dateStr){
  const salesCash = STATE.sales.filter(s=>s.date < dateStr).reduce((a,b)=>a+Number(b.total||0),0);
  const vIn = STATE.vouchers.filter(v=>v.type==='In' && v.date < dateStr).reduce((a,b)=>a+Number(b.amount||0),0);
  const vOut = STATE.vouchers.filter(v=>v.type==='Out' && v.date < dateStr).reduce((a,b)=>a+Number(b.amount||0),0);
  const purch = STATE.purchases.filter(p=>p.date < dateStr).reduce((a,b)=>a+Number(b.total||0),0);
  const exp = STATE.expenses.filter(e=>e.date < dateStr).reduce((a,b)=>a+Number(b.amount||0),0);
  return salesCash + vIn - vOut - purch - exp;
}

function pageDailyBalance(){
  const d = DAILY_BAL_DATE;
  const opening = cumulativeCashBefore(d);
  const salesToday = STATE.sales.filter(s=>s.date===d);
  const purchToday = STATE.purchases.filter(p=>p.date===d);
  const expToday = STATE.expenses.filter(e=>e.date===d);
  const vInToday = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
  const vOutToday = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);

  const salesTotal = salesToday.reduce((a,b)=>a+Number(b.total||0),0);
  const vInTotal = vInToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const purchTotal = purchToday.reduce((a,b)=>a+Number(b.total||0),0);
  const expTotal = expToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const vOutTotal = vOutToday.reduce((a,b)=>a+Number(b.amount||0),0);

  const cashIn = salesTotal + vInTotal;
  const cashOut = purchTotal + expTotal + vOutTotal;
  const closing = opening + cashIn - cashOut;

  const lines = [
    ...salesToday.map(s=>({label:`Sale — ${s.productName} (${s.partyName||'Walk-in'})`, amount: Number(s.total||0), sign:1})),
    ...vInToday.map(v=>({label:`Cash in — ${v.note||'Voucher'}`, amount: Number(v.amount||0), sign:1})),
    ...purchToday.map(p=>({label:`Purchase — ${p.productName} (${p.supplierName||'—'})`, amount: Number(p.total||0), sign:-1})),
    ...expToday.map(e=>({label:`Expense — ${e.category}${e.note?': '+e.note:''}`, amount: Number(e.amount||0), sign:-1})),
    ...vOutToday.map(v=>({label:`Cash out — ${v.note||'Voucher'}`, amount: Number(v.amount||0), sign:-1})),
  ];

  return `
  <div class="stitch panel no-print">
    <div class="panel-head"><h3>Choose date</h3>
      <div class="toolbar">
        <input type="date" id="dbDate" value="${d}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <button class="btn btn-primary btn-sm" onclick="applyDailyBalanceDate()">Show</button>
        <button class="btn btn-outline btn-sm" onclick="window.print()">Print</button>
        <button class="btn btn-outline btn-sm" onclick="exportDailyBalancePdf()">Export PDF</button>
      </div>
    </div>
  </div>

  <div class="stitch panel" style="text-align:center;margin-bottom:16px">
    <h3 style="font-family:var(--serif);font-size:19px;color:var(--field-dark)">Daily Balance Sheet</h3>
    <p class="muted" style="font-size:12.5px">Kissan Fertilizer, Miro Khan Road, Kamber — ${d}</p>
  </div>

  <div class="stats">
    <div class="stitch stat"><div class="lbl">Opening balance</div><div class="val">${fmt(opening)}</div><div class="sub">carried from previous days</div></div>
    <div class="stitch stat"><div class="lbl">Cash in today</div><div class="val" style="color:var(--ok)">${fmt(cashIn)}</div><div class="sub">${salesToday.length} sale(s), ${vInToday.length} voucher(s)</div></div>
    <div class="stitch stat red"><div class="lbl">Cash out today</div><div class="val">${fmt(cashOut)}</div><div class="sub">${purchToday.length} purchase(s), ${expToday.length} expense(s), ${vOutToday.length} voucher(s)</div></div>
    <div class="stitch stat gold"><div class="lbl">Closing balance</div><div class="val">${fmt(closing)}</div><div class="sub">opening + in − out</div></div>
  </div>

  <div class="stitch panel">
    <div class="panel-head"><h3>Movements on ${d}</h3></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Description</th><th class="right">In</th><th class="right">Out</th></tr></thead>
      <tbody>
        ${lines.length? lines.map(l=>`<tr><td>${l.label}</td><td class="right mono">${l.sign>0?fmt(l.amount):''}</td><td class="right mono">${l.sign<0?fmt(l.amount):''}</td></tr>`).join('')
        : `<tr class="empty-row"><td colspan="3">No movements recorded for this date.</td></tr>`}
      </tbody>
      <tfoot>
        <tr style="font-weight:700"><td>Total</td><td class="right mono">${fmt(cashIn)}</td><td class="right mono">${fmt(cashOut)}</td></tr>
        <tr style="font-weight:700;border-top:2px solid var(--line)"><td>Closing balance</td><td class="right mono" colspan="2">${fmt(closing)}</td></tr>
      </tfoot>
    </table></div>
  </div>`;
}
window.applyDailyBalanceDate = function(){
  DAILY_BAL_DATE = $('dbDate').value || todayISO();
  goPage('dailybalance');
};
window.exportDailyBalancePdf = function(){
  const jsPDFCtor = window.jspdf?.jsPDF;
  if(!jsPDFCtor){ toast('PDF library not ready','error'); return; }
  const d = DAILY_BAL_DATE;
  const opening = cumulativeCashBefore(d);
  const salesToday = STATE.sales.filter(s=>s.date===d);
  const purchToday = STATE.purchases.filter(p=>p.date===d);
  const expToday = STATE.expenses.filter(e=>e.date===d);
  const vInToday = STATE.vouchers.filter(v=>v.type==='In' && v.date===d);
  const vOutToday = STATE.vouchers.filter(v=>v.type==='Out' && v.date===d);
  const cashIn = salesToday.reduce((a,b)=>a+Number(b.total||0),0) + vInToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const cashOut = purchToday.reduce((a,b)=>a+Number(b.total||0),0) + expToday.reduce((a,b)=>a+Number(b.amount||0),0) + vOutToday.reduce((a,b)=>a+Number(b.amount||0),0);
  const closing = opening + cashIn - cashOut;
  const lines = [
    ...salesToday.map(s=>['Sale', `${s.productName} (${s.partyName||'Walk-in'})`, fmt(s.total), '']),
    ...vInToday.map(v=>['Cash In', v.note||'Voucher', fmt(v.amount), '']),
    ...purchToday.map(p=>['Purchase', `${p.productName} (${p.supplierName||'—'})`, '', fmt(p.total)]),
    ...expToday.map(e=>['Expense', `${e.category}${e.note?': '+e.note:''}`, '', fmt(e.amount)]),
    ...vOutToday.map(v=>['Cash Out', v.note||'Voucher', '', fmt(v.amount)]),
  ];
  const pdf = new jsPDFCtor();
  pdf.setFontSize(14); pdf.text('Kissan Fertilizer — Daily Balance Sheet', 14, 16);
  pdf.setFontSize(10); pdf.text(`Date: ${d}`, 14, 22);
  pdf.text(`Opening: ${fmt(opening)}   Cash In: ${fmt(cashIn)}   Cash Out: ${fmt(cashOut)}   Closing: ${fmt(closing)}`, 14, 28);
  pdf.autoTable({ startY:34, head:[['Type','Description','In','Out']], body: lines });
  pdf.save(`daily_balance_${d}.pdf`);
};

/* ===================== REPORTS ===================== */
let REPORT_FROM = new Date(new Date().setDate(new Date().getDate()-6)).toISOString().slice(0,10);
let REPORT_TO = todayISO();
function pageReports(){
  const sales = STATE.sales.filter(s=>s.date>=REPORT_FROM && s.date<=REPORT_TO);
  const purch = STATE.purchases.filter(p=>p.date>=REPORT_FROM && p.date<=REPORT_TO);
  const exp = STATE.expenses.filter(e=>e.date>=REPORT_FROM && e.date<=REPORT_TO);
  const salesTotal = sales.reduce((a,b)=>a+Number(b.total||0),0);
  const purchTotal = purch.reduce((a,b)=>a+Number(b.total||0),0);
  const expTotal = exp.reduce((a,b)=>a+Number(b.amount||0),0);
  const profit = salesTotal - purchTotal - expTotal;
  return `
  <div class="stitch panel">
    <div class="panel-head"><h3>Date range</h3>
      <div class="toolbar">
        <input type="date" id="repFrom" value="${REPORT_FROM}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <input type="date" id="repTo" value="${REPORT_TO}" style="padding:8px 10px;border:1.5px solid var(--line);border-radius:9px">
        <button class="btn btn-primary btn-sm" onclick="applyReportRange()">Apply</button>
        <button class="btn btn-outline btn-sm" onclick="exportReportExcel()">Export Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportReportPdf()">Export PDF</button>
      </div>
    </div>
  </div>
  <div class="stats">
    <div class="stitch stat"><div class="lbl">Sales</div><div class="val">${fmt(salesTotal)}</div><div class="sub">${sales.length} invoices</div></div>
    <div class="stitch stat gold"><div class="lbl">Purchases</div><div class="val">${fmt(purchTotal)}</div><div class="sub">${purch.length} entries</div></div>
    <div class="stitch stat red"><div class="lbl">Expenses</div><div class="val">${fmt(expTotal)}</div><div class="sub">${exp.length} entries</div></div>
    <div class="stitch stat"><div class="lbl">Estimated profit</div><div class="val" style="color:${profit>=0?'var(--ok)':'var(--danger)'}">${fmt(profit)}</div></div>
  </div>
  <div class="stitch panel">
    <div class="panel-head"><h3>Sales in range</h3></div>
    <div class="tbl-wrap"><table class="tbl" id="repTable">
      <thead><tr><th>Date</th><th>Customer</th><th>Product</th><th class="right">Qty</th><th class="right">Total</th></tr></thead>
      <tbody>${sales.length? sales.map(s=>`<tr><td>${s.date}</td><td>${s.partyName||'Walk-in'}</td><td>${s.productName}</td><td class="right mono">${s.qty}</td><td class="right mono">${fmt(s.total)}</td></tr>`).join('')
      : `<tr class="empty-row"><td colspan="5">No sales in this range.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}
window.applyReportRange = function(){
  REPORT_FROM = $('repFrom').value || REPORT_FROM;
  REPORT_TO = $('repTo').value || REPORT_TO;
  goPage('reports');
};
window.exportReportExcel = function(){
  const sales = STATE.sales.filter(s=>s.date>=REPORT_FROM && s.date<=REPORT_TO);
  const ws = XLSX.utils.json_to_sheet(sales.map(s=>({Date:s.date, Customer:s.partyName, Product:s.productName, Qty:s.qty, Rate:s.rate, Total:s.total})));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sales');
  XLSX.writeFile(wb, `sales_${REPORT_FROM}_to_${REPORT_TO}.xlsx`);
};
window.exportReportPdf = function(){
  const sales = STATE.sales.filter(s=>s.date>=REPORT_FROM && s.date<=REPORT_TO);
  const jsPDFCtor = window.jspdf?.jsPDF;
  if(!jsPDFCtor){ toast('PDF library not ready','error'); return; }
  const pdf = new jsPDFCtor();
  pdf.setFontSize(14); pdf.text('Kissan Fertilizer — Sales Report', 14, 16);
  pdf.setFontSize(10); pdf.text(`${REPORT_FROM} to ${REPORT_TO}`, 14, 22);
  pdf.autoTable({ startY:28, head:[['Date','Customer','Product','Qty','Rate','Total']], body: sales.map(s=>[s.date,s.partyName,s.productName,s.qty,s.rate,s.total]) });
  pdf.save(`sales_${REPORT_FROM}_to_${REPORT_TO}.pdf`);
};
