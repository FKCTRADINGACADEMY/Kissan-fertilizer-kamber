<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kissan Fertilizer — Kamber</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1f4d2c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Kissan Fertilizer" />
<link rel="icon" href="icon-192-1.png" />
<link rel="apple-touch-icon" href="icon-192-1.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --field:#1f4d2c; --field-dark:#123420; --field-soft:#e7efe4;
  --wheat:#c98a1f; --wheat-soft:#f6e6bf; --soil:#7a4b2e;
  --paper:#faf6ec; --card:#fffdf8; --ink:#23291f; --sub:#6b6152;
  --line:#e7e0cf; --ok:#1f7a3d; --ok-soft:#d9f0e0; --danger:#b5462f; --danger-soft:#f6d9d0;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
input,select,textarea{font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--field);outline-offset:1px;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
.btn{border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--field);color:#fff;}
.btn-primary:hover{background:var(--field-dark);}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.btn-icon{width:32px;height:32px;padding:0;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--field-dark);}
.login-card{background:var(--card);padding:34px;border-radius:16px;width:320px;text-align:center;}
.login-mark{font-size:38px;}
.login-card h1{font-size:20px;margin:6px 0 2px;}
.login-card .sub{font-size:12px;color:var(--sub);margin-bottom:16px;}
.login-card .field{margin-bottom:12px;text-align:left;}
.login-card label{font-size:11.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}
.login-err{color:var(--danger);font-size:12px;min-height:16px;margin-top:8px;}

#app{display:none;min-height:100vh;}
#app.show{display:flex;}
.sidebar{width:220px;background:var(--field-dark);color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-head .mark{font-size:24px;}
.sidebar-head h1{font-size:15px;color:#fff;}
.sidebar-head span{font-size:10.5px;color:#c9d8cd;}
.nav{flex:1;padding:12px 8px;overflow-y:auto;}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cfe0d3;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
.nav a i{width:16px;text-align:center;}
.nav a.active,.nav a:hover{background:rgba(255,255,255,.1);color:#fff;}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.1);}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.av{width:30px;height:30px;border-radius:50%;background:var(--wheat);color:var(--field-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
.who .nm{font-size:12.5px;font-weight:700;color:#fff;}
.who .rl{font-size:10.5px;color:#a9bcae;}
.logout-btn{width:100%;background:rgba(255,255,255,.08);color:#fff;border:none;padding:8px;border-radius:8px;font-size:12px;font-weight:700;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);}
.topbar-left{display:flex;align-items:center;gap:12px;}
.burger{display:none;background:none;border:none;font-size:20px;}
.crumb span{display:block;font-weight:800;font-size:15px;}
.crumb small{color:var(--sub);font-size:11.5px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.badge-place{font-size:11px;color:var(--sub);background:var(--field-soft);padding:6px 10px;border-radius:20px;}
.sync-dot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);font-weight:700;}
.sync-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px var(--ok-soft);}
.sync-dot.offline{color:var(--danger);}
.sync-dot.offline i{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft);}
.install-btn{display:none;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--field);background:var(--wheat-soft);border:1px solid var(--wheat);padding:6px 10px;border-radius:8px;}
.install-btn.show{display:inline-flex;}
.offline-banner{display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:var(--danger);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:8px 12px;}
.offline-banner.show{display:block;}
.content{flex:1;padding:20px;overflow-y:auto;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.panel-head h3{font-size:15px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.field label{font-size:11.5px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
.kpi .lbl{font-size:11px;color:var(--sub);font-weight:700;}
.kpi .val{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:4px;}
.kpi.green .val{color:var(--field);}
.kpi.gold .val{color:var(--wheat);}
.kpi.red .val{color:var(--danger);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;background:var(--field-soft);color:var(--field-dark);font-size:11px;text-transform:uppercase;letter-spacing:.3px;font-weight:800;}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:hover td{background:#fbf8f0;}
.right{text-align:right;}
.center{text-align:center;}
.mono{font-family:'JetBrains Mono',monospace;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;}
.tag.green{background:var(--ok-soft);color:var(--ok);}
.tag.red{background:var(--danger-soft);color:var(--danger);}
.tag.gold{background:var(--wheat-soft);color:var(--soil);}
.row-actions{display:flex;gap:6px;}
.empty{text-align:center;padding:30px;color:var(--sub);font-size:13px;}
.hint{font-size:11.5px;color:var(--sub);margin-top:6px;}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.search-bar input{max-width:260px;}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(18,52,32,.5);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:15px;}
.modal-close{background:none;border:none;font-size:16px;color:var(--sub);}
.modal-body{padding:18px;}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

#toast{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast-msg{background:var(--field-dark);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast-msg.err{background:var(--danger);}

.item-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
@media(max-width:760px){.item-row{grid-template-columns:1fr 1fr;}}
.inv-total-box{background:var(--field-soft);border-radius:10px;padding:14px;margin-top:10px;}
.inv-total-box .line{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.inv-total-box .line.grand{font-weight:800;font-size:16px;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;}

.no-print{}
@media print{
  .no-print,.sidebar,.topbar,#toast,.modal-backdrop,.offline-banner{display:none !important;}
  body{background:#fff;}
  .content{padding:0;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-mark">🌾</div>
    <h1>Kissan Fertilizer</h1>
    <p class="sub">Miro Khan Road, Kamber — ledger &amp; store manager</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@kissan.com" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()"><span id="loginBtnLabel">Sign in</span></button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<div id="app">
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-head">
      <div class="mark">🌾</div>
      <div><h1>Kissan Fertilizer</h1><span>Kamber Branch</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <div class="av" id="whoAv">K</div>
        <div><div class="nm" id="whoName">—</div><div class="rl">Signed in</div></div>
      </div>
      <button class="logout-btn" onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar no-print">
      <div class="topbar-left">
        <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div class="crumb"><span id="crumbTitle">Dashboard</span><small id="crumbSub">Today's overview</small></div>
      </div>
      <div class="topbar-right">
        <span class="badge-place">📍 Miro Khan Road, Kamber</span>
        <button class="install-btn" id="installBtn" onclick="window.installApp()"><i class="fas fa-download"></i> Install app</button>
        <span class="sync-dot" id="syncDot"><i></i><span id="syncLabel">Synced</span></span>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </main>
</div>

<div class="offline-banner" id="offlineBanner">You're offline — changes are saved locally and will sync automatically once you're back online.</div>
<div id="toast"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-head"><h3 id="modalTitle">Title</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, getDocs,
  onSnapshot, query, orderBy, where, increment, runTransaction, serverTimestamp,
  writeBatch, limit
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

/* ===================== FIREBASE ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBgj4ICBiPlikXgTjkzPrRUCv3CX3At0KA",
  authDomain: "kissan-fertilizer.firebaseapp.com",
  projectId: "kissan-fertilizer",
  storageBucket: "kissan-fertilizer.firebasestorage.app",
  messagingSenderId: "476514606793",
  appId: "1:476514606793:web:157d8f78e74f426644f718"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

/* ===================== COLLECTIONS =====================
   Every entity lives in its own small document — nothing is ever
   packed into one big array/object doc, so the 1MB Firestore
   document limit is never a concern, no matter how much data grows.
   - warehouses/{id}            one doc per godam
   - products/{id}               one doc per product (master info only)
   - stock/{warehouseId_productId}  one small doc per product-per-warehouse qty
   - parties/{id}                 one doc per customer/supplier
   - invoices/{id}                one doc per bill (items array stays small & bounded)
   - ledger/{id}                  one doc per party transaction (statement source)
   - dailyClosing/{YYYY-MM-DD}    one doc per day, auto generated
   - counters/invoiceCounter      tiny doc just for auto invoice numbers
========================================================= */
const col = (name) => collection(db, name);

let CURRENT_USER = null;
let CACHE = { warehouses: [], products: [], parties: [], stock: [] };
let unsubs = [];

/* ===================== AUTH ===================== */
window.doLogin = async function () {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  const btnLabel = document.getElementById('loginBtnLabel');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Enter email and password'; return; }
  btnLabel.textContent = 'Signing in…';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    errEl.textContent = 'Invalid email or password';
  }
  btnLabel.textContent = 'Sign in';
};

window.doLogout = async function () {
  unsubs.forEach((u) => u());
  unsubs = [];
  await signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    CURRENT_USER = user;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('show');
    document.getElementById('whoName').textContent = user.email;
    document.getElementById('whoAv').textContent = (user.email || 'K')[0].toUpperCase();
    buildNav();
    startLiveData();
    navigate('dashboard');
  } else {
    CURRENT_USER = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').classList.remove('show');
  }
});

/* ===================== TOAST / MODAL ===================== */
window.toast = function (msg, isErr) {
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-msg' + (isErr ? ' err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
};

window.closeModal = function () {
  document.getElementById('modalBackdrop').classList.remove('show');
};
function openModal(title, bodyHtml, footHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFoot').innerHTML = footHtml || '';
  document.getElementById('modalBackdrop').classList.add('show');
}
window.openModal = openModal;

function fmtMoney(n) {
  n = Number(n) || 0;
  return 'Rs ' + n.toLocaleString('en-PK', { maximumFractionDigits: 0 });
}
function todayStr(d) {
  const dt = d ? new Date(d) : new Date();
  return dt.toISOString().slice(0, 10);
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
window._fmtMoney = fmtMoney;

/* ===================== NAV ===================== */
const PAGES = [
  { id: 'dashboard', label: 'Dashboard', icon: 'fa-gauge' },
  { id: 'invoices', label: 'Invoices', icon: 'fa-file-invoice' },
  { id: 'parties', label: 'Parties', icon: 'fa-users' },
  { id: 'statement', label: 'Party Statement', icon: 'fa-scroll' },
  { id: 'products', label: 'Products', icon: 'fa-box' },
  { id: 'warehouses', label: 'Godam (Warehouse)', icon: 'fa-warehouse' },
  { id: 'closing', label: 'Daily Closing', icon: 'fa-calendar-check' },
  { id: 'settings', label: 'Settings', icon: 'fa-gear' },
];
function buildNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = PAGES.map((p) =>
    `<a href="#" data-page="${p.id}" onclick="navigate('${p.id}');return false;"><i class="fas ${p.icon}"></i>${p.label}</a>`
  ).join('');
}
window.navigate = function (pageId, param) {
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.page === pageId));
  const page = PAGES.find((p) => p.id === pageId);
  document.getElementById('crumbTitle').textContent = page ? page.label : '';
  const renderer = PAGE_RENDERERS[pageId];
  if (renderer) renderer(param);
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
};

/* ===================== LIVE DATA (small collections cached client-side) ===================== */
let ACTIVE_PAGE_REFRESH = null;
function startLiveData() {
  unsubs.push(onSnapshot(query(col('warehouses'), orderBy('name')), (snap) => {
    CACHE.warehouses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (ACTIVE_PAGE_REFRESH) ACTIVE_PAGE_REFRESH();
  }));
  unsubs.push(onSnapshot(query(col('products'), orderBy('name')), (snap) => {
    CACHE.products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (ACTIVE_PAGE_REFRESH) ACTIVE_PAGE_REFRESH();
  }));
  unsubs.push(onSnapshot(query(col('parties'), orderBy('name')), (snap) => {
    CACHE.parties = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (ACTIVE_PAGE_REFRESH) ACTIVE_PAGE_REFRESH();
  }));
  unsubs.push(onSnapshot(col('stock'), (snap) => {
    CACHE.stock = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (ACTIVE_PAGE_REFRESH) ACTIVE_PAGE_REFRESH();
  }));
}
function stockFor(warehouseId, productId) {
  const row = CACHE.stock.find((s) => s.warehouseId === warehouseId && s.productId === productId);
  return row ? (row.qty || 0) : 0;
}
function totalStockFor(productId) {
  return CACHE.stock.filter((s) => s.productId === productId).reduce((sum, s) => sum + (s.qty || 0), 0);
}
async function adjustStock(warehouseId, productId, deltaQty, warehouseName, productName) {
  const stockId = warehouseId + '_' + productId;
  const ref = doc(db, 'stock', stockId);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    await updateDoc(ref, { qty: increment(deltaQty), updatedAt: serverTimestamp() });
  } else {
    await setDoc(ref, { warehouseId, productId, warehouseName, productName, qty: deltaQty, updatedAt: serverTimestamp() });
  }
}

/* ===================== WAREHOUSES (GODAM) ===================== */
function pageWarehouses() {
  ACTIVE_PAGE_REFRESH = pageWarehouses;
  document.getElementById('crumbSub').textContent = CACHE.warehouses.length + ' godam registered';
  const rows = CACHE.warehouses.map((w) => {
    const items = CACHE.stock.filter((s) => s.warehouseId === w.id);
    const totalQty = items.reduce((s, x) => s + (x.qty || 0), 0);
    return `<tr>
      <td><strong>${w.name}</strong></td>
      <td>${w.address || '—'}</td>
      <td class="right mono">${totalQty}</td>
      <td class="row-actions">
        <button class="btn btn-outline btn-icon" onclick="editWarehouse('${w.id}')"><i class="fas fa-pen"></i></button>
        <button class="btn btn-danger btn-icon" onclick="deleteWarehouse('${w.id}','${w.name}')"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('pageContent').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h3>Godam / Warehouses</h3>
        <button class="btn btn-primary" onclick="editWarehouse()"><i class="fas fa-plus"></i> Add Godam</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Address</th><th class="right">Total Stock</th><th>Actions</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="empty">No godam added yet — add your first warehouse.</td></tr>'}</tbody>
      </table>
    </div>`;
}
window.editWarehouse = function (id) {
  const w = id ? CACHE.warehouses.find((x) => x.id === id) : null;
  openModal(w ? 'Edit Godam' : 'Add Godam', `
    <div class="grid grid-2">

  const warehouseId = document.getElementById('stWarehouse').value;
  const mode = document.getElementById('stMode').value;
  const qty = Number(document.getElementById('stQty').value) || 0;
  const p = CACHE.products.find((x) => x.id === productId);
  const w = CACHE.warehouses.find((x) => x.id === warehouseId);
  if (qty <= 0 && mode !== 'set') { toast('Enter a valid quantity', true); return; }
  try {
    if (mode === 'in') await adjustStock(warehouseId, productId, qty, w.name, p.name);
    else if (mode === 'out') {
      const current = stockFor(warehouseId, productId);
      if (qty > current) { toast('Not enough stock in this godam', true); return; }
      await adjustStock(warehouseId, productId, -qty, w.name, p.name);
    } else {
      const ref = doc(db, 'stock', warehouseId + '_' + productId);
      await setDoc(ref, { warehouseId, productId, warehouseName: w.name, productName: p.name, qty, updatedAt: serverTimestamp() });

  } catch (e) { toast('Failed: ' + e.message, true); }
};

async function computePartyBalance(partyId, openingBalance) {
  const snap = await getDocs(query(col('ledger'), where('partyId', '==', partyId)));
  let bal = Number(openingBalance) || 0;
  snap.forEach((d) => { const l = d.data(); bal += (Number(l.debit) || 0) - (Number(l.credit) || 0); });
  return bal;
}

window.updateInvoiceItemRow = function (idx, field, value) {
  const row = invoiceFormItems[idx];
  if (field === 'productId') {
    const p = CACHE.products.find((x) => x.id === value);
    row.productId = value;
    row.name = p ? p.name : '';
    row.unit = p ? p.unit : '';
    if (p && !row.rate) row.rate = p.salePrice || 0;
  } else if (field === 'qty') {
    row.qty = Number(value) || 0;
  } else if (field === 'rate') {
    row.rate = Number(value) || 0;
  }
  row.amount = (row.qty || 0) * (row.rate || 0);
  renderInvoiceItemRows(true);

async function nextInvoiceNo() {
  const ref = doc(db, 'counters', 'invoiceCounter');
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const next = snap.exists() ? (snap.data().value || 0) + 1 : 1;
    tx.set(ref, { value: next }, { merge: true });
    return 'INV-' + String(next).padStart(5, '0');
  });
}

window.saveInvoice = async function () {
  const partyId = document.getElementById('ivParty').value;
  const warehouseId = document.getElementById('ivWarehouse').value;
  const date = document.getElementById('ivDate').value || todayStr();
  const discount = Number(document.getElementById('ivDiscount').value) || 0;
  const received = Number(document.getElementById('ivReceived').value) || 0;
  const note = document.getElementById('ivNote').value.trim();
  const items = invoiceFormItems.filter((it) => it.productId && it.qty > 0);

  if (!partyId) { toast('Select a party', true); return; }
  if (!warehouseId) { toast('Select a godam', true); return; }
  if (!items.length) { toast('Add at least one item', true); return; }

  const party = CACHE.parties.find((p) => p.id === partyId);
  const warehouse = CACHE.warehouses.find((w) => w.id === warehouseId);
  const subtotal = items.reduce((s, it) => s + it.amount, 0);
  const total = Math.max(0, subtotal - discount);
  const balance = total - received;

  try {
    if (invoiceFormEditingId) {
      const old = invoicesCache.find((x) => x.id === invoiceFormEditingId);
      // reverse old stock effect
      for (const it of old.items) {
        await adjustStock(old.warehouseId, it.productId, it.qty, old.warehouseName, it.name);
      }
      // apply new stock effect
      for (const it of items) {
        await adjustStock(warehouseId, it.productId, -it.qty, warehouse.name, it.name);
      }
      await updateDoc(doc(db, 'invoices', invoiceFormEditingId), {
        partyId, partyName: party.name, warehouseId, warehouseName: warehouse.name,
        date, items, subtotal, discount, total, received, balance, note,
        updatedAt: serverTimestamp()
      });
      if (old.ledgerId) {
        await updateDoc(doc(db, 'ledger', old.ledgerId), {
          partyId, partyName: party.name, date, debit: total, credit: received,
          note: 'Invoice ' + old.invoiceNo, updatedAt: serverTimestamp()
        });
      }
      toast('Invoice updated');
      regenerateDailyClosing(date);
      if (old.date !== date) regenerateDailyClosing(old.date);
    } else {
      const invoiceNo = await nextInvoiceNo();
      const ledgerRef = await addDoc(col('ledger'), {
        partyId, partyName: party.name, date, type: 'invoice',
        debit: total, credit: received, note: 'Invoice ' + invoiceNo,
        createdAt: serverTimestamp()
      });
      for (const it of items) {
        await adjustStock(warehouseId, it.productId, -it.qty, warehouse.name, it.name);
      }
      await addDoc(col('invoices'), {
        invoiceNo, partyId, partyName: party.name, warehouseId, warehouseName: warehouse.name,
        date, items, subtotal, discount, total, received, balance, note,
        ledgerId: ledgerRef.id, createdAt: serverTimestamp()
      });
      toast('Invoice ' + invoiceNo + ' saved');
      regenerateDailyClosing(date);
    }
    navigate('invoices');
  } catch (e) {
    toast('Failed: ' + e.message, true);
  }
};

window.deleteInvoice = async function (id) {
  const inv = invoicesCache.find((x) => x.id === id);
  if (!inv) return;
  if (!confirm('Delete invoice ' + inv.invoiceNo + '? Stock and party balance will be reversed.')) return;
  try {
    for (const it of inv.items) {
      await adjustStock(inv.warehouseId, it.productId, it.qty, inv.warehouseName, it.name);
    }
    if (inv.ledgerId) await deleteDoc(doc(db, 'ledger', inv.ledgerId));
    await deleteDoc(doc(db, 'invoices', id));
    toast('Invoice deleted');
    regenerateDailyClosing(inv.date);
  } catch (e) { toast('Failed: ' + e.message, true); }
};

window.loadStatement = async function () {
  const partyId = document.getElementById('stmtParty').value;
  if (!partyId) return;
  const party = CACHE.parties.find((p) => p.id === partyId);
  const from = document.getElementById('stmtFrom').value;
  const to = document.getElementById('stmtTo').value;
  const snap = await getDocs(query(col('ledger'), where('partyId', '==', partyId)));
  let entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  entries.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (from) entries = entries.filter((e) => e.date >= from);
  if (to) entries = entries.filter((e) => e.date <= to);

  let running = Number(party.openingBalance) || 0;
  if (!from) {
    // running balance starts from opening balance when no filter start applied
  } else {
    // if filtered, still start from true opening (simpler & always accurate)
  }
  const rows = entries.map((e) => {
    running += (Number(e.debit) || 0) - (Number(e.credit) || 0);
    return `<tr>
      <td>${fmtDate(e.date)}</td>
      <td>${e.note || e.type}</td>
      <td class="right mono">${e.debit ? fmtMoney(e.debit) : '—'}</td>
      <td class="right mono">${e.credit ? fmtMoney(e.credit) : '—'}</td>
      <td class="right mono"><strong>${fmtMoney(running)}</strong></td>
    </tr>`;
  }).join('');
  document.getElementById('stmtPanel').innerHTML = `
    <div class="panel-head"><h3>${party.name} — Statement</h3><span class="tag ${running>0?'red':running<0?'green':'gold'}">${running>0?'Owes ':running<0?'Advance ':'Settled '}${fmtMoney(Math.abs(running))}</span></div>
    <table>
      <thead><tr><th>Date</th><th>Description</th><th class="right">Debit</th><th class="right">Credit</th><th class="right">Balance</th></tr></thead>
      <tbody>
        <tr><td colspan="4">Opening Balance</td><td class="right mono">${fmtMoney(party.openingBalance||0)}</td></tr>

};

/* ===================== DAILY CLOSING (auto call sheet) ===================== */
async function regenerateDailyClosing(date) {
  if (!date) return;
  const invSnap = await getDocs(query(col('invoices'), where('date', '==', date)));
  let totalSales = 0, totalReceived = 0, invoiceCount = 0;
  invSnap.forEach((d) => { const v = d.data(); totalSales += v.total || 0; totalReceived += v.received || 0; invoiceCount++; });
  const creditGiven = totalSales - totalReceived;
  await setDoc(doc(db, 'dailyClosing', date), {
    date, totalSales, totalReceived, creditGiven, invoiceCount, generatedAt: serverTimestamp()
  }, { merge: true });
  return { date, totalSales, totalReceived, creditGiven, invoiceCount };
}

  loadClosing(date);
}

};

<script>
/* ===================== PWA: install + offline ===================== */
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('SW registration failed:', err);
      });
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.add('show');
  });
  window.installApp = async function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (installBtn) installBtn.classList.remove('show');
  };
  window.addEventListener('appinstalled', () => {
    if (installBtn) installBtn.classList.remove('show');
    deferredPrompt = null;
  });

  const syncDot = document.getElementById('syncDot');
  const syncLabel = document.getElementById('syncLabel');
  const offlineBanner = document.getElementById('offlineBanner');
  function updateOnlineStatus() {
    const online = navigator.onLine;
    if (syncDot) syncDot.classList.toggle('offline', !online);
    if (syncLabel) syncLabel.textContent = online ? 'Synced' : 'Offline — saved locally';
    if (offlineBanner) offlineBanner.classList.toggle('show', !online);
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();
})();
</script>
